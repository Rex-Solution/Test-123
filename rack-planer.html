<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack-Planer</title>
<style>
  :root {
    --bg: #1b1e23;
    --panel: #252a31;
    --panel2: #2e343c;
    --line: #3a414b;
    --text: #e6e8eb;
    --muted: #9aa3ad;
    --accent: #4da3ff;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
    --rack: #3b4047;
    --rail: #121417;
    --rail-line: #22262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 290px 1fr 290px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "kopf kopf kopf" "bib flaeche info";
  }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

  header {
    grid-area: kopf;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header .spacer { flex: 1; }

  button, select, input {
    font: inherit; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.aktiv { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.gefahr:hover { border-color: var(--bad); color: var(--bad); }
  .toggle { display: inline-flex; }
  .toggle button { border-radius: 0; }
  .toggle button:first-child { border-radius: 6px 0 0 6px; }
  .toggle button:last-child { border-radius: 0 6px 6px 0; }

  aside {
    background: var(--panel);
    overflow-y: auto;
    padding: 12px;
  }
  #bibliothek { grid-area: bib; border-right: 1px solid var(--line); }
  #info { grid-area: info; border-left: 1px solid var(--line); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .zeile { display: flex; gap: 6px; }
  .zeile > select, .zeile > input { flex: 1; min-width: 0; }
  #suche { width: 100%; margin-bottom: 8px; }

  .kat { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .bib-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; margin-bottom: 4px;
    background: var(--panel2); border: 1px solid transparent; border-radius: 6px;
    cursor: grab; touch-action: none; user-select: none;
  }
  .bib-item:hover { border-color: var(--accent); }
  .bib-item .farbe { width: 6px; align-self: stretch; border-radius: 3px; }
  .bib-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--line); color: var(--muted); white-space: nowrap; }
  .badge.grafik { background: #1f3b5c; color: #9cc9ff; }
  .badge.warn { background: #4a3a12; color: #f0c663; }
  .hinweis { font-size: 12px; color: var(--muted); }

  #flaeche {
    grid-area: flaeche;
    overflow: auto;
    padding: 24px;
  }
  #racks { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .rack { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .rack-kopf { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rack-kopf .titel { font-weight: 600; cursor: text; }
  .rack-kopf .typ { color: var(--muted); font-size: 12px; flex: 1; }
  .rack-kopf button { padding: 2px 8px; font-size: 12px; }
  .rack-warn { font-size: 12px; color: var(--warn); margin-bottom: 6px; }
  .rack-fuss { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .leer { color: var(--muted); padding: 40px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; }

  /* SVG-Elemente */
  svg.rack-svg { display: block; touch-action: none; }
  .r-rahmen { fill: var(--rack); stroke: #555c66; stroke-width: 2; }
  .r-schiene { fill: var(--rail); }
  .r-linie { stroke: var(--rail-line); stroke-width: 1; }
  .r-nr { fill: var(--muted); font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
  .r-rolle { fill: #111; stroke: #666; stroke-width: 2; }
  .g { cursor: grab; }
  .g-platz { stroke: rgba(0,0,0,.6); stroke-width: 1; }
  .g-ohr { fill: rgba(0,0,0,.25); }
  .g-schraube { fill: rgba(0,0,0,.55); }
  .g-text { fill: #fff; font-size: 12px; font-weight: 600; dominant-baseline: middle; pointer-events: none; }
  .g-sub { fill: rgba(255,255,255,.7); font-size: 10.5px; dominant-baseline: middle; pointer-events: none; }
  .g-rand { fill: none; stroke: none; pointer-events: none; }
  .g.ausgewaehlt .g-rand { stroke: var(--accent); stroke-width: 3; }
  .g.gezogen { opacity: .35; }
  .vorschau { pointer-events: none; stroke-width: 2; stroke-dasharray: 5 3; }
  .vorschau.ok { fill: rgba(63,185,80,.25); stroke: var(--ok); }
  .vorschau.bad { fill: rgba(248,81,73,.25); stroke: var(--bad); }

  .ghost {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none;
    padding: 4px 10px; border-radius: 6px; background: var(--accent); color: #fff;
    font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .info-block { background: var(--panel2); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .info-block h3 { margin: 0 0 8px; font-size: 14px; }

  @media (max-width: 1000px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
      grid-template-areas: "kopf" "bib" "flaeche" "info";
      height: auto;
    }
    #bibliothek { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #info { border-left: 0; border-top: 1px solid var(--line); }
    #flaeche { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Rack-Planer</h1>
  <div class="toggle" role="group" aria-label="Ansicht">
    <button id="btn-vorne" class="aktiv">Vorderseite</button>
    <button id="btn-hinten">Rückseite</button>
  </div>
  <span class="spacer"></span>
  <span class="hinweis" id="datenquelle-hinweis"></span>
  <button id="btn-neu" class="gefahr">Neuer Plan</button>
</header>

<aside id="bibliothek">
  <h2>Rack / Case</h2>
  <div class="zeile">
    <select id="rack-typ"></select>
    <button id="btn-rack-add">+ Rack</button>
  </div>

  <h2>Geräte-Library</h2>
  <input id="suche" type="search" placeholder="Suchen …">
  <div id="geraete-liste"></div>
  <p class="hinweis">Geräte per Drag &amp; Drop ins Rack ziehen. Zum Entfernen ein Gerät zurück in die Library ziehen oder auswählen und <kbd>Entf</kbd> drücken.</p>
</aside>

<main id="flaeche">
  <div id="racks"></div>
</main>

<aside id="info"></aside>

<script>
'use strict';

/* =====================================================================
   KONFIGURATION
   Später: API_BASIS_URL auf den Datenbank-Agent zeigen lassen und
   NAS_BASIS_URL auf die Freigabe, unter der die Grafiken erreichbar sind.
   ===================================================================== */
const KONFIG = {
  API_BASIS_URL: null,          // z.B. 'http://rex-server/api' – null = Demodaten
  NAS_BASIS_URL: '',            // Präfix für relative Grafikpfade aus der DB
  KATEGORIE_RACK: 'Rack/Case',
  SPEICHER_SCHLUESSEL: 'rackplaner.plan.v1',
};

// Zeichen-Geometrie (Pixel). 19" : 1 HE ≈ 10,86 : 1
const HE_PX = 22;
const SP_W = 240;      // Breite einer Rack-Spalte
const NUM_W = 22;      // Streifen für HE-Nummern
const GAP = 14;        // Abstand zwischen Spalten
const PAD = 16;        // Rahmenstärke
const ROLLEN_H = 26;

/* =====================================================================
   DEMODATEN – bilden Einträge der Hauptgruppe "Material" nach
   (id, name, kategorie, attribute = flexibles JSON-Feld).
   ===================================================================== */
function demoGrafik(hintergrund, beschriftung, hinten) {
  const deko = hinten
    ? '<circle cx="80" cy="22" r="7" fill="#777"/><circle cx="100" cy="22" r="7" fill="#777"/><circle cx="120" cy="22" r="7" fill="#777"/><rect x="300" y="12" width="40" height="20" fill="#333" stroke="#888"/><rect x="350" y="12" width="40" height="20" fill="#333" stroke="#888"/>'
    : '<rect x="330" y="10" width="110" height="24" rx="3" fill="#0b2a3a" stroke="#3aa0d8"/><circle cx="60" cy="22" r="8" fill="#2d2d2d" stroke="#aaa"/><circle cx="85" cy="22" r="3" fill="#3fb950"/>';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="482" height="44" viewBox="0 0 482 44">
    <rect width="482" height="44" fill="${hintergrund}"/>
    <rect width="20" height="44" fill="#6b6f75"/><rect x="462" width="20" height="44" fill="#6b6f75"/>
    <circle cx="10" cy="11" r="3" fill="#222"/><circle cx="10" cy="33" r="3" fill="#222"/>
    <circle cx="472" cy="11" r="3" fill="#222"/><circle cx="472" cy="33" r="3" fill="#222"/>
    ${deko}
    <text x="150" y="27" font-family="sans-serif" font-size="13" fill="#ddd">${beschriftung}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const DEMO_MATERIAL = [
  // Racks / Cases
  { id: 'R-001', name: 'Stagerack 2×16 HE fahrbar', kategorie: 'Rack/Case',
    attribute: { spalten: 2, he_pro_spalte: 16, aussenmasse: { laenge: 125, breite: 65, hoehe: 100 }, gewicht_leer: 42, rollen: true, grafik: null } },
  { id: 'R-002', name: 'Rack 12 HE', kategorie: 'Rack/Case',
    attribute: { spalten: 1, he_pro_spalte: 12, aussenmasse: { laenge: 60, breite: 55, hoehe: 70 }, gewicht_leer: 18, rollen: false } },
  { id: 'R-003', name: 'Doppelrack 2×8 HE', kategorie: 'Rack/Case',
    attribute: { spalten: 2, he_pro_spalte: 8, gewicht_leer: 26, rollen: true } },
  { id: 'R-004', name: 'Case 4 HE (Daten unvollständig)', kategorie: 'Rack/Case',
    attribute: { gewicht_leer: 8 } },

  // Geräte
  { id: 'G-101', name: 'Stagebox 32/16', kategorie: 'Audio',
    attribute: { he: 3, stromverbrauch: 60, gewicht: 9.5, masse: { laenge: 48, breite: 35, hoehe: 13 }, anschluesse: '32× XLR In, 16× XLR Out, 2× RJ45' } },
  { id: 'G-102', name: 'Funkempfänger 2-Kanal', kategorie: 'Funk',
    attribute: { he: 1, stromverbrauch: 25, gewicht: 4.2, anschluesse: '2× XLR Out, 2× BNC Antenne',
      grafik_vorne: demoGrafik('#26292e', 'FUNK RX 2CH', false),
      grafik_hinten: demoGrafik('#1d1f23', 'ANT A · ANT B · OUT', true) } },
  { id: 'G-103', name: 'Endstufe 4×1300 W', kategorie: 'Audio',
    attribute: { he: 2, stromverbrauch: 800, gewicht: 13, anschluesse: '4× XLR In, 2× NL4 Out, powerCON',
      grafik_vorne: demoGrafik('#2a2a2a', 'AMP 4×1300', false) } },
  { id: 'G-104', name: 'In-Ear Sender', kategorie: 'Funk',
    attribute: { stromverbrauch: 15, gewicht: 2.1 } },   // he fehlt absichtlich
  { id: 'G-105', name: 'Stromverteiler 8× Schuko', kategorie: 'Strom',
    attribute: { he: 1, stromverbrauch: 0, gewicht: 2.5, anschluesse: 'CEE 16A In, 8× Schuko' } },
  { id: 'G-106', name: 'Netzwerk-Switch 16 Port', kategorie: 'Netzwerk',
    attribute: { he: 1, stromverbrauch: 30, gewicht: 3, anschluesse: '16× RJ45, 2× SFP' } },
  { id: 'G-107', name: 'Licht-Node DMX 4 Univ.', kategorie: 'Licht',
    attribute: { he: 1, stromverbrauch: 12, gewicht: 1.8, anschluesse: '4× DMX 5pol, 1× RJ45' } },
  { id: 'G-108', name: 'Schublade 3 HE', kategorie: 'Zubehör',
    attribute: { he: 3, gewicht: 6 } },
  { id: 'G-109', name: 'Blindblende 1 HE', kategorie: 'Zubehör',
    attribute: { he: 1, gewicht: 0.4 } },
  { id: 'G-110', name: 'Blindblende 2 HE', kategorie: 'Zubehör',
    attribute: { he: 2, gewicht: 0.7 } },
];

/* =====================================================================
   DATENQUELLE – einzige Stelle, die später auf den Datenbank-Agent
   (REST, Hauptgruppe "Material") umgestellt wird.
   ===================================================================== */
const Datenquelle = {
  async ladeMaterial() {
    if (KONFIG.API_BASIS_URL) {
      // TODO: Route/Antwortformat an den Datenbank-Agent anpassen.
      const antwort = await fetch(`${KONFIG.API_BASIS_URL}/material`);
      if (!antwort.ok) throw new Error(`Datenbank-Agent: HTTP ${antwort.status}`);
      return antwort.json();
    }
    return DEMO_MATERIAL;
  },
};

/** Grafikpfad aus der DB → ladbare URL (NAS). */
function grafikUrl(pfad) {
  if (!pfad) return null;
  if (/^(data:|https?:|file:|\/)/.test(pfad)) return pfad;
  return KONFIG.NAS_BASIS_URL + pfad;
}

/* =====================================================================
   NORMALISIERUNG – fängt fehlende/ungültige Attribute ab
   ===================================================================== */
function positiveZahl(wert) {
  const n = Number(wert);
  return Number.isFinite(n) && n > 0 ? n : null;
}

function normalisiereRack(e) {
  const a = e.attribute || {};
  const warnungen = [];
  let spalten = Math.floor(positiveZahl(a.spalten) || 0);
  let hePro = Math.floor(positiveZahl(a.he_pro_spalte) || 0);
  if (!spalten) { spalten = 1; warnungen.push('„spalten“ fehlt – 1 angenommen'); }
  if (!hePro) { hePro = 12; warnungen.push('„he_pro_spalte“ fehlt – 12 angenommen'); }
  return {
    id: e.id, name: e.name || e.id, spalten, hePro,
    aussenmasse: a.aussenmasse || null,
    gewichtLeer: positiveZahl(a.gewicht_leer) || 0,
    rollen: !!a.rollen,
    grafik: a.grafik || null,
    warnungen,
  };
}

function normalisiereGeraet(e) {
  const a = e.attribute || {};
  const warnungen = [];
  let he = Math.floor(positiveZahl(a.he) || 0);
  if (!he) { he = 1; warnungen.push('„he“ fehlt – 1 HE angenommen'); }
  return {
    id: e.id, name: e.name || e.id, kategorie: e.kategorie || 'Ohne Kategorie', he,
    masse: a.masse || null,
    stromverbrauch: Number(a.stromverbrauch) || 0,
    gewicht: Number(a.gewicht) || 0,
    anschluesse: a.anschluesse || '',
    foto: a.foto || null,
    grafikVorne: a.grafik_vorne || null,
    grafikHinten: a.grafik_hinten || null,
    warnungen,
  };
}

/* =====================================================================
   ZUSTAND
   Plan = { racks: [ { uid, typId, name, geraete: [ { uid, geraetId, spalte, he } ] } ] }
   spalte: 0-basiert (von vorne gesehen links = 0), he: 1-basiert von oben
   ===================================================================== */
const S = {
  rackTypen: new Map(),
  geraete: new Map(),
  plan: { racks: [] },
  ansicht: 'vorne',
  auswahl: null,       // { rackUid, uid }
  bibAuswahl: null,    // geraetId
  drag: null,
};

const $ = (sel) => document.querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, stellen = 1) => Number(n).toLocaleString('de-DE', { maximumFractionDigits: stellen });

function kategorieFarbe(kategorie) {
  let h = 0;
  for (const c of kategorie) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function speichern() {
  try { localStorage.setItem(KONFIG.SPEICHER_SCHLUESSEL, JSON.stringify(S.plan)); } catch (_) { /* egal */ }
}

function laden() {
  try {
    const roh = localStorage.getItem(KONFIG.SPEICHER_SCHLUESSEL);
    if (!roh) return;
    const plan = JSON.parse(roh);
    // Nur Einträge übernehmen, deren Typ/Gerät es (noch) in der DB gibt
    S.plan.racks = (plan.racks || [])
      .filter((r) => S.rackTypen.has(r.typId))
      .map((r) => ({ ...r, geraete: (r.geraete || []).filter((g) => S.geraete.has(g.geraetId)) }));
  } catch (_) { /* ungültiger Speicherstand wird ignoriert */ }
}

/* =====================================================================
   PLAN-LOGIK
   ===================================================================== */
const rackPerUid = (u) => S.plan.racks.find((r) => r.uid === u);
const typVon = (rack) => S.rackTypen.get(rack.typId);

function istFrei(rack, spalte, start, he, ausserUid) {
  const typ = typVon(rack);
  if (spalte < 0 || spalte >= typ.spalten) return false;
  if (start < 1 || start + he - 1 > typ.hePro) return false;
  return rack.geraete.every((p) => {
    if (p.uid === ausserUid || p.spalte !== spalte) return true;
    const pe = p.he + S.geraete.get(p.geraetId).he - 1;
    return start + he - 1 < p.he || start > pe;
  });
}

function rackHinzufuegen(typId) {
  const typ = S.rackTypen.get(typId);
  if (!typ) return;
  S.plan.racks.push({ uid: uid(), typId, name: `Rack ${S.plan.racks.length + 1}`, geraete: [] });
  aenderung();
}

function rackEntfernen(rackUid) {
  const rack = rackPerUid(rackUid);
  if (rack.geraete.length && !confirm(`„${rack.name}“ mit ${rack.geraete.length} Gerät(en) entfernen?`)) return;
  S.plan.racks = S.plan.racks.filter((r) => r.uid !== rackUid);
  if (S.auswahl?.rackUid === rackUid) S.auswahl = null;
  aenderung();
}

function geraetEntfernen(rackUid, platzUid) {
  const rack = rackPerUid(rackUid);
  if (!rack) return;
  rack.geraete = rack.geraete.filter((g) => g.uid !== platzUid);
  if (S.auswahl?.uid === platzUid) S.auswahl = null;
  aenderung();
}

function rackStatistik(rack) {
  const typ = typVon(rack);
  let he = 0, gewicht = typ.gewichtLeer, strom = 0;
  for (const p of rack.geraete) {
    const g = S.geraete.get(p.geraetId);
    he += g.he; gewicht += g.gewicht; strom += g.stromverbrauch;
  }
  return { he, heGesamt: typ.spalten * typ.hePro, gewicht, strom };
}

function aenderung() {
  speichern();
  render();
}

/* =====================================================================
   RENDERING
   ===================================================================== */
const spaltenX = (d) => PAD + d * (NUM_W + SP_W + GAP) + NUM_W;
const svgBreite = (typ) => PAD * 2 + typ.spalten * (NUM_W + SP_W) + (typ.spalten - 1) * GAP;
const rahmenHoehe = (typ) => PAD * 2 + typ.hePro * HE_PX;
// In der Rückansicht sind die Spalten gespiegelt
const anzeigeSpalte = (typ, spalte) => (S.ansicht === 'hinten' ? typ.spalten - 1 - spalte : spalte);

function render() {
  renderRacks();
  renderInfo();
}

function renderBibliothek() {
  const sel = $('#rack-typ');
  sel.innerHTML = [...S.rackTypen.values()]
    .map((t) => `<option value="${esc(t.id)}">${esc(t.name)} (${t.spalten}×${t.hePro} HE)</option>`)
    .join('') || '<option value="">Keine Racks in der Datenbank</option>';
  renderGeraeteListe();
}

function renderGeraeteListe() {
  const filter = $('#suche').value.trim().toLowerCase();
  const gruppen = new Map();
  for (const g of S.geraete.values()) {
    if (filter && !`${g.name} ${g.kategorie}`.toLowerCase().includes(filter)) continue;
    if (!gruppen.has(g.kategorie)) gruppen.set(g.kategorie, []);
    gruppen.get(g.kategorie).push(g);
  }
  const html = [...gruppen.entries()]
    .sort(([a], [b]) => a.localeCompare(b, 'de'))
    .map(([kat, liste]) => `<div class="kat">${esc(kat)}</div>` + liste
      .sort((a, b) => a.name.localeCompare(b.name, 'de'))
      .map((g) => `
        <div class="bib-item" data-geraet="${esc(g.id)}" title="${esc(g.name)}">
          <span class="farbe" style="background:hsl(${kategorieFarbe(g.kategorie)} 45% 45%)"></span>
          <span class="name">${esc(g.name)}</span>
          ${g.warnungen.length ? '<span class="badge warn" title="Daten unvollständig">!</span>' : ''}
          ${g.grafikVorne || g.grafikHinten ? '<span class="badge grafik" title="Eigene Grafik vorhanden">Grafik</span>' : ''}
          <span class="badge">${g.he} HE</span>
        </div>`).join(''))
    .join('');
  $('#geraete-liste').innerHTML = html || '<p class="hinweis">Keine Treffer.</p>';
}

function renderRacks() {
  const cont = $('#racks');
  if (!S.plan.racks.length) {
    cont.innerHTML = '<div class="leer">Noch kein Rack im Plan.<br>Links einen Rack-Typ wählen und „+ Rack“ klicken.</div>';
    return;
  }
  // Von hinten betrachtet ist auch die Reihenfolge der Racks gespiegelt
  const liste = S.ansicht === 'hinten' ? [...S.plan.racks].reverse() : S.plan.racks;
  cont.innerHTML = liste.map(rackHtml).join('');
}

function rackHtml(rack) {
  const typ = typVon(rack);
  const st = rackStatistik(rack);
  return `
    <div class="rack" data-rack="${rack.uid}">
      <div class="rack-kopf">
        <span class="titel" data-aktion="umbenennen" title="Doppelklick zum Umbenennen">${esc(rack.name)}</span>
        <span class="typ">${esc(typ.name)}</span>
        <button class="gefahr" data-aktion="rack-entfernen" title="Rack entfernen">✕</button>
      </div>
      ${typ.warnungen.map((w) => `<div class="rack-warn">⚠ ${esc(w)}</div>`).join('')}
      ${rackSvg(rack, typ)}
      <div class="rack-fuss">
        <span>${st.he}/${st.heGesamt} HE</span>
        <span>${fmt(st.gewicht)} kg</span>
        <span>${fmt(st.strom, 0)} W</span>
      </div>
    </div>`;
}

function rackSvg(rack, typ) {
  const b = svgBreite(typ);
  const hRahmen = rahmenHoehe(typ);
  const h = hRahmen + (typ.rollen ? ROLLEN_H : 0);
  const teile = [`<rect class="r-rahmen" x="1" y="1" width="${b - 2}" height="${hRahmen - 2}" rx="6"/>`];

  for (let d = 0; d < typ.spalten; d++) {
    const x = spaltenX(d);
    teile.push(`<rect class="r-schiene" x="${x}" y="${PAD}" width="${SP_W}" height="${typ.hePro * HE_PX}"/>`);
    for (let i = 0; i < typ.hePro; i++) {
      const y = PAD + i * HE_PX;
      if (i > 0) teile.push(`<line class="r-linie" x1="${x}" y1="${y}" x2="${x + SP_W}" y2="${y}"/>`);
      teile.push(`<text class="r-nr" x="${x - NUM_W / 2}" y="${y + HE_PX / 2}">${i + 1}</text>`);
    }
  }

  for (const p of rack.geraete) teile.push(geraetSvg(rack, typ, p));

  if (typ.rollen) {
    const r = ROLLEN_H / 2 - 2;
    for (const x of [PAD + 18, b - PAD - 18]) teile.push(`<circle class="r-rolle" cx="${x}" cy="${hRahmen + r}" r="${r}"/>`);
  }

  return `<svg class="rack-svg" data-rack="${rack.uid}" width="${b}" height="${h}" viewBox="0 0 ${b} ${h}">${teile.join('')}</svg>`;
}

function kuerze(text, maxZeichen) {
  return text.length > maxZeichen ? text.slice(0, maxZeichen - 1) + '…' : text;
}

function geraetSvg(rack, typ, p) {
  const g = S.geraete.get(p.geraetId);
  const x = spaltenX(anzeigeSpalte(typ, p.spalte));
  const y = PAD + (p.he - 1) * HE_PX;
  const hoehe = g.he * HE_PX;
  const hinten = S.ansicht === 'hinten';
  const hue = kategorieFarbe(g.kategorie);
  const ausgewaehlt = S.auswahl?.uid === p.uid;
  const gezogen = S.drag?.aktiv && S.drag.von?.uid === p.uid;
  const grafik = grafikUrl(hinten ? g.grafikHinten : g.grafikVorne);
  const ohr = 14;
  const mitte = y + hoehe / 2;

  // Phase 1: Platzhalter – wird immer gezeichnet, echte Grafik liegt darüber
  let text;
  if (g.he === 1) {
    text = `<text class="g-text" x="${x + ohr + 6}" y="${mitte}">${esc(kuerze(g.name + (hinten ? ' (hinten)' : ''), 30))}</text>`;
  } else {
    text = `<text class="g-text" x="${x + ohr + 6}" y="${mitte - 7}">${esc(kuerze(g.name, 28))}</text>
            <text class="g-sub" x="${x + ohr + 6}" y="${mitte + 8}">${esc(g.kategorie)} · ${g.he} HE${hinten ? ' · Rückseite' : ''}</text>`;
  }
  const schrauben = [x + ohr / 2, x + SP_W - ohr / 2]
    .map((sx) => `<circle class="g-schraube" cx="${sx}" cy="${y + 6}" r="2.5"/><circle class="g-schraube" cx="${sx}" cy="${y + hoehe - 6}" r="2.5"/>`)
    .join('');

  // Phase 2: Falls Grafik vorhanden → darüberlegen; schlägt das Laden fehl, bleibt der Platzhalter sichtbar
  const bild = grafik
    ? `<image href="${esc(grafik)}" x="${x}" y="${y}" width="${SP_W}" height="${hoehe}" preserveAspectRatio="none" onerror="this.remove()"/>`
    : '';

  return `
    <g class="g${ausgewaehlt ? ' ausgewaehlt' : ''}${gezogen ? ' gezogen' : ''}" data-platz="${p.uid}">
      <rect class="g-platz" x="${x}" y="${y}" width="${SP_W}" height="${hoehe}"
            fill="hsl(${hue} ${hinten ? '20%' : '35%'} ${hinten ? '22%' : '30%'})"/>
      <rect class="g-ohr" x="${x}" y="${y}" width="${ohr}" height="${hoehe}"/>
      <rect class="g-ohr" x="${x + SP_W - ohr}" y="${y}" width="${ohr}" height="${hoehe}"/>
      ${schrauben}
      ${text}
      ${bild}
      <rect class="g-rand" x="${x + 1.5}" y="${y + 1.5}" width="${SP_W - 3}" height="${hoehe - 3}"/>
    </g>`;
}

function renderInfo() {
  const info = $('#info');
  let html = '';

  // Details zum ausgewählten Gerät (im Rack oder in der Library)
  let g = null, platz = null, rack = null;
  if (S.auswahl) {
    rack = rackPerUid(S.auswahl.rackUid);
    platz = rack?.geraete.find((p) => p.uid === S.auswahl.uid);
    if (platz) g = S.geraete.get(platz.geraetId); else S.auswahl = null;
  } else if (S.bibAuswahl) {
    g = S.geraete.get(S.bibAuswahl);
  }

  if (g) {
    const m = g.masse ? `${g.masse.laenge ?? '?'} × ${g.masse.breite ?? '?'} × ${g.masse.hoehe ?? '?'} cm` : '–';
    html += `
      <h2>Details</h2>
      <div class="info-block">
        <h3>${esc(g.name)}</h3>
        <dl>
          <dt>ID</dt><dd>${esc(g.id)}</dd>
          <dt>Kategorie</dt><dd>${esc(g.kategorie)}</dd>
          <dt>Höhe</dt><dd>${g.he} HE</dd>
          <dt>Maße</dt><dd>${m}</dd>
          <dt>Gewicht</dt><dd>${g.gewicht ? fmt(g.gewicht) + ' kg' : '–'}</dd>
          <dt>Strom</dt><dd>${g.stromverbrauch ? fmt(g.stromverbrauch, 0) + ' W' : '–'}</dd>
          <dt>Anschlüsse</dt><dd>${esc(g.anschluesse) || '–'}</dd>
          <dt>Grafik vorne</dt><dd>${g.grafikVorne ? 'vorhanden' : 'Platzhalter'}</dd>
          <dt>Grafik hinten</dt><dd>${g.grafikHinten ? 'vorhanden' : 'Platzhalter'}</dd>
          ${platz ? `<dt>Position</dt><dd>${esc(rack.name)}, Spalte ${platz.spalte + 1}, HE ${platz.he}–${platz.he + g.he - 1}</dd>` : ''}
        </dl>
        ${g.warnungen.map((w) => `<div class="rack-warn" style="margin-top:8px">⚠ ${esc(w)}</div>`).join('')}
        ${platz ? `<button class="gefahr" data-aktion="geraet-entfernen" style="margin-top:10px;width:100%">Aus Rack entfernen</button>` : ''}
      </div>`;
  }

  // Übersicht
  html += '<h2>Übersicht</h2>';
  if (!S.plan.racks.length) {
    html += '<p class="hinweis">Noch keine Racks.</p>';
  } else {
    let gewicht = 0, strom = 0, anzahl = 0;
    for (const r of S.plan.racks) {
      const st = rackStatistik(r);
      gewicht += st.gewicht; strom += st.strom; anzahl += r.geraete.length;
      html += `<div class="info-block">
        <h3>${esc(r.name)}</h3>
        <div class="stat"><span>Belegung</span><span>${st.he} / ${st.heGesamt} HE</span></div>
        <div class="stat"><span>Gewicht</span><span>${fmt(st.gewicht)} kg</span></div>
        <div class="stat"><span>Strom</span><span>${fmt(st.strom, 0)} W</span></div>
      </div>`;
    }
    html += `<div class="info-block">
      <h3>Gesamt</h3>
      <div class="stat"><span>Racks</span><span>${S.plan.racks.length}</span></div>
      <div class="stat"><span>Geräte</span><span>${anzahl}</span></div>
      <div class="stat"><span>Gewicht</span><span>${fmt(gewicht)} kg</span></div>
      <div class="stat"><span>Strom</span><span>${fmt(strom, 0)} W</span></div>
    </div>`;
  }
  info.innerHTML = html;
}

/* =====================================================================
   DRAG & DROP (Pointer-Events → Maus, Stift und Touch)
   ===================================================================== */

/** Pixel im Client → SVG-Koordinaten des Racks */
function svgPunkt(svg, clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/** Ermittelt Ziel-Rack/Spalte/HE unter dem Mauszeiger */
function zielBestimmen(clientX, clientY, drag) {
  for (const svg of document.querySelectorAll('svg.rack-svg')) {
    const box = svg.getBoundingClientRect();
    if (clientX < box.left || clientX > box.right || clientY < box.top || clientY > box.bottom) continue;
    const rack = rackPerUid(svg.dataset.rack);
    const typ = typVon(rack);
    const { x, y } = svgPunkt(svg, clientX, clientY);

    let d = -1;
    for (let i = 0; i < typ.spalten; i++) {
      const sx = spaltenX(i);
      if (x >= sx - NUM_W && x <= sx + SP_W + GAP / 2) { d = i; break; }
    }
    if (d < 0) return null;

    const spalte = anzeigeSpalte(typ, d);   // Spiegelung ist symmetrisch
    const he = drag.geraet.he;
    let start = Math.floor((y - PAD) / HE_PX) + 1 - drag.griffHE;
    start = Math.max(1, Math.min(start, typ.hePro - he + 1));
    const frei = he <= typ.hePro && istFrei(rack, spalte, start, he, drag.von?.uid);
    return { svg, rack, typ, spalte, anzeige: d, start, frei };
  }
  return null;
}

function vorschauZeigen(ziel, geraet) {
  vorschauEntfernen();
  if (!ziel) return;
  const hoehe = Math.min(geraet.he, ziel.typ.hePro) * HE_PX;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('class', `vorschau ${ziel.frei ? 'ok' : 'bad'}`);
  rect.setAttribute('x', spaltenX(ziel.anzeige));
  rect.setAttribute('y', PAD + (ziel.start - 1) * HE_PX);
  rect.setAttribute('width', SP_W);
  rect.setAttribute('height', hoehe);
  ziel.svg.appendChild(rect);
}

function vorschauEntfernen() {
  document.querySelectorAll('.vorschau').forEach((el) => el.remove());
}

function imBereich(el, clientX, clientY) {
  const b = el.getBoundingClientRect();
  return clientX >= b.left && clientX <= b.right && clientY >= b.top && clientY <= b.bottom;
}

function dragStarten(ev, geraet, von) {
  if (ev.button !== undefined && ev.button !== 0) return;
  ev.preventDefault();
  let griffHE = 0;
  if (von) {
    // Bei bereits platzierten Geräten die Griffposition innerhalb des Geräts merken
    const svg = ev.target.closest('svg.rack-svg');
    const { y } = svgPunkt(svg, ev.clientX, ev.clientY);
    const platz = rackPerUid(von.rackUid).geraete.find((p) => p.uid === von.uid);
    griffHE = Math.max(0, Math.min(geraet.he - 1, Math.floor((y - PAD) / HE_PX) + 1 - platz.he));
  }
  S.drag = { geraet, von, griffHE, startX: ev.clientX, startY: ev.clientY, aktiv: false, ziel: null, ghost: null };
}

function dragAbbrechen() {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  d.ghost?.remove();
  document.body.classList.remove('dragging');
  vorschauEntfernen();
  if (d.aktiv) renderRacks();
}

document.addEventListener('pointermove', (ev) => {
  const d = S.drag;
  if (!d) return;
  if (!d.aktiv) {
    if (Math.hypot(ev.clientX - d.startX, ev.clientY - d.startY) < 4) return;
    d.aktiv = true;
    d.ghost = document.createElement('div');
    d.ghost.className = 'ghost';
    d.ghost.textContent = `${d.geraet.name} · ${d.geraet.he} HE`;
    document.body.appendChild(d.ghost);
    document.body.classList.add('dragging');
    if (d.von) renderRacks();   // Original halbtransparent darstellen
  }
  d.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
  d.ziel = zielBestimmen(ev.clientX, ev.clientY, d);
  vorschauZeigen(d.ziel, d.geraet);
});

document.addEventListener('pointerup', (ev) => {
  const d = S.drag;
  if (!d) return;

  if (!d.aktiv) {
    // Kein Ziehen → Klick = Auswahl
    S.drag = null;
    if (d.von) { S.auswahl = { ...d.von }; S.bibAuswahl = null; }
    else { S.bibAuswahl = d.geraet.id; S.auswahl = null; }
    render();
    return;
  }

  const ziel = d.ziel;
  dragAbbrechen();

  if (ziel && ziel.frei) {
    let platzUid = d.von?.uid;
    if (d.von) {
      const quelle = rackPerUid(d.von.rackUid);
      quelle.geraete = quelle.geraete.filter((p) => p.uid !== d.von.uid);
    } else {
      platzUid = uid();
    }
    ziel.rack.geraete.push({ uid: platzUid, geraetId: d.geraet.id, spalte: ziel.spalte, he: ziel.start });
    S.auswahl = { rackUid: ziel.rack.uid, uid: platzUid };
    S.bibAuswahl = null;
    aenderung();
  } else if (d.von && imBereich($('#bibliothek'), ev.clientX, ev.clientY)) {
    // Zurück in die Library gezogen → entfernen
    geraetEntfernen(d.von.rackUid, d.von.uid);
  }
});

document.addEventListener('pointercancel', dragAbbrechen);

/* =====================================================================
   EVENTS
   ===================================================================== */
$('#geraete-liste').addEventListener('pointerdown', (ev) => {
  const item = ev.target.closest('.bib-item');
  if (item) dragStarten(ev, S.geraete.get(item.dataset.geraet), null);
});

$('#racks').addEventListener('pointerdown', (ev) => {
  const gEl = ev.target.closest('.g');
  if (!gEl) return;
  const rackUid = ev.target.closest('svg.rack-svg').dataset.rack;
  const platz = rackPerUid(rackUid).geraete.find((p) => p.uid === gEl.dataset.platz);
  dragStarten(ev, S.geraete.get(platz.geraetId), { rackUid, uid: platz.uid });
});

$('#racks').addEventListener('click', (ev) => {
  const rackEl = ev.target.closest('.rack');
  if (!rackEl) return;
  if (ev.target.closest('[data-aktion="rack-entfernen"]')) { rackEntfernen(rackEl.dataset.rack); return; }
  // Klick auf leere Fläche im Rack hebt Auswahl auf
  if (!ev.target.closest('.g') && S.auswahl) { S.auswahl = null; render(); }
});

$('#racks').addEventListener('dblclick', (ev) => {
  const titel = ev.target.closest('[data-aktion="umbenennen"]');
  if (!titel) return;
  const rack = rackPerUid(titel.closest('.rack').dataset.rack);
  const name = prompt('Rack-Name:', rack.name);
  if (name && name.trim()) { rack.name = name.trim(); aenderung(); }
});

$('#info').addEventListener('click', (ev) => {
  if (ev.target.closest('[data-aktion="geraet-entfernen"]') && S.auswahl) {
    geraetEntfernen(S.auswahl.rackUid, S.auswahl.uid);
  }
});

$('#btn-rack-add').addEventListener('click', () => rackHinzufuegen($('#rack-typ').value));
$('#suche').addEventListener('input', renderGeraeteListe);

function ansichtSetzen(ansicht) {
  S.ansicht = ansicht;
  $('#btn-vorne').classList.toggle('aktiv', ansicht === 'vorne');
  $('#btn-hinten').classList.toggle('aktiv', ansicht === 'hinten');
  render();
}
$('#btn-vorne').addEventListener('click', () => ansichtSetzen('vorne'));
$('#btn-hinten').addEventListener('click', () => ansichtSetzen('hinten'));

$('#btn-neu').addEventListener('click', () => {
  if (S.plan.racks.length && !confirm('Aktuellen Plan verwerfen?')) return;
  S.plan = { racks: [] };
  S.auswahl = null;
  aenderung();
});

document.addEventListener('keydown', (ev) => {
  if (ev.target.matches('input, select, textarea')) return;
  if (ev.key === 'Escape') { dragAbbrechen(); if (S.auswahl) { S.auswahl = null; render(); } }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && S.auswahl) {
    ev.preventDefault();
    geraetEntfernen(S.auswahl.rackUid, S.auswahl.uid);
  }
});

/* =====================================================================
   START
   ===================================================================== */
(async function start() {
  try {
    const material = await Datenquelle.ladeMaterial();
    for (const e of material) {
      if (e.kategorie === KONFIG.KATEGORIE_RACK) {
        const r = normalisiereRack(e);
        S.rackTypen.set(r.id, r);
      } else {
        const g = normalisiereGeraet(e);
        S.geraete.set(g.id, g);
      }
    }
    $('#datenquelle-hinweis').textContent = KONFIG.API_BASIS_URL ? 'Datenbank-Agent' : 'Demodaten';
  } catch (err) {
    $('#racks').innerHTML = `<div class="leer">Material konnte nicht geladen werden:<br>${esc(err.message)}</div>`;
    return;
  }
  laden();
  renderBibliothek();
  render();
})();
</script>
