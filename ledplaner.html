/* ===== 12-kurve.js ===== */
/* Kurven und Winkel: Knick an senkrechten Fugen zwischen Modulspalten.
   s.winkel = { [x der Fuge in mm]: Grad }  + = konkav (Bogen um das Publikum), − = konvex (nach außen).
   Die Vorderansicht bleibt die Abwicklung (Pixel, Strom, Signal unverändert); dazu kommt eine Draufsicht. */

const rad = g => g * Math.PI / 180;

/* Alle senkrechten Fugen eines Screens; durchgehend = kein Modul überspannt sie */
function screenFugen(s) {
  if (!s.module.length) return [];
  const g = grenzen(s.module);
  const rects = s.module.map(modRect);
  const xs = [...new Set(rects.map(r => Math.round(r.x)).filter(x => x > g.x))].sort((a, b) => a - b);
  return xs.map(x => ({ x, grad: Number(s.winkel?.[x]) || 0, durchgehend: !rects.some(r => r.x < x - 0.5 && r.x + r.b > x + 0.5) }));
}

/* Draufsicht und Kennzahlen */
function kurveDaten(s) {
  const fugen = screenFugen(s);
  const erg = { fugen, knicke: fugen.filter(f => f.grad && f.durchgehend), punkte: [], sehneMm: 0, stichMm: 0, gesamtGrad: 0, radiusMm: null, gebogen: false };
  if (!s.module.length) return erg;
  const g = grenzen(s.module);
  const kanten = [g.x, ...erg.knicke.map(f => f.x), g.x + g.b];
  let x = 0, y = 0, h = 0;
  const pts = [[0, 0]];
  for (let i = 1; i < kanten.length; i++) {
    const w = kanten[i] - kanten[i - 1];
    x += w * Math.cos(h); y += w * Math.sin(h);
    pts.push([x, y]);
    if (i < kanten.length - 1) h += rad(erg.knicke[i - 1].grad);   // + dreht zum Publikum (unten)
  }
  // Sehne waagerecht legen, oben bündig
  const [ex, ey] = pts[pts.length - 1];
  const dreh = -Math.atan2(ey, ex), c = Math.cos(dreh), si = Math.sin(dreh);
  let rot = pts.map(([px, py]) => [px * c - py * si, px * si + py * c]);
  const minY = Math.min(...rot.map(p => p[1]));
  rot = rot.map(([px, py]) => [px, py - minY]);
  erg.punkte = rot;
  erg.sehneMm = Math.hypot(ex, ey);
  erg.stichMm = Math.max(...rot.map(p => p[1]));
  erg.gesamtGrad = erg.knicke.reduce((a, f) => a + f.grad, 0);
  erg.gebogen = erg.knicke.length > 0;
  // Radius nur bei gleichmäßigem Bogen (gleiche Winkel, gleiche Segmentbreiten)
  const breiten = kanten.slice(1).map((k, i) => k - kanten[i]);
  if (erg.knicke.length && new Set(erg.knicke.map(f => f.grad)).size === 1 && new Set(breiten.map(b => Math.round(b))).size === 1)
    erg.radiusMm = breiten[0] / (2 * Math.sin(rad(Math.abs(erg.knicke[0].grad)) / 2));
  return erg;
}

/* Winkel aus Radius: Sehne w zwischen zwei Fugen → Knickwinkel */
function winkelAusRadius(w, radiusMm) { return w >= 2 * radiusMm ? null : 2 * Math.asin(w / (2 * radiusMm)) * 180 / Math.PI; }

function winkelSetzen(s, x, grad) {
  s.winkel = s.winkel || {};
  const g = Math.round(grad * 10) / 10;
  if (g) s.winkel[x] = g; else delete s.winkel[x];
}

/* Dialog für eine Fuge (Klick auf die Marke unter der Wand) */
async function fugeBearbeiten(s, x) {
  const alt = Number(s.winkel?.[x]) || 0;
  const erg = await formularDialog(`Winkel an der Fuge bei ${fmt(x - grenzen(s.module).x)} mm`, [
    { name: "grad", label: "Winkel (°), 0 = gerade", art: "zahl", wert: fmtFlex(Math.abs(alt)) },
    { name: "richtung", label: "Richtung", art: "auswahl", wert: alt < 0 ? "konvex" : "konkav", optionen: [["konkav", "konkav – Bogen um das Publikum"], ["konvex", "konvex – nach außen"]] },
  ]);
  if (!erg) return;
  if (!(erg.grad >= 0 && erg.grad <= 90)) return toast("Winkel: 0 bis 90°.", "fehler");
  winkelSetzen(s, x, erg.richtung === "konvex" ? -erg.grad : erg.grad);
  aenderung();
}

/* Dialog für mehrere Fugen: gleicher Winkel oder Radius */
async function winkelDialog(s) {
  const fugen = screenFugen(s).filter(f => f.durchgehend);
  if (!fugen.length) return toast("Der Screen hat keine durchgehende senkrechte Fuge.", "fehler");
  const auswahl = s.module.filter(m => ui.auswahl.has(m.id)).map(modRect);
  const imBereich = f => auswahl.length < 2 || (f.x > Math.min(...auswahl.map(r => r.x)) && f.x < Math.max(...auswahl.map(r => r.x + r.b)));
  const erg = await formularDialog("Kurve / Winkel", [
    { name: "hinweis", art: "hinweis", label: auswahl.length >= 2 ? `Gilt für die Fugen innerhalb der Auswahl (${fugen.filter(imBereich).length}).` : `Gilt für alle ${fugen.length} Fugen. Für einen Teilbereich vorher Module auswählen.` },
    { name: "modus", label: "Angabe", art: "auswahl", wert: "winkel", optionen: [["winkel", "Winkel je Fuge (°)"], ["radius", "Radius (m)"], ["gerade", "gerade machen"]] },
    { name: "wert", label: "Wert", art: "zahl", wert: "" },
    { name: "richtung", label: "Richtung", art: "auswahl", wert: "konkav", optionen: [["konkav", "konkav – Bogen um das Publikum"], ["konvex", "konvex – nach außen"]] },
  ], "Übernehmen");
  if (!erg) return;
  const ziel = fugen.filter(imBereich);
  const vz = erg.richtung === "konvex" ? -1 : 1;
  if (erg.modus === "gerade") { for (const f of ziel) winkelSetzen(s, f.x, 0); return aenderung(); }
  if (erg.modus === "winkel") {
    if (!(erg.wert >= 0 && erg.wert <= 90)) return toast("Winkel: 0 bis 90°.", "fehler");
    for (const f of ziel) winkelSetzen(s, f.x, vz * erg.wert);
    return aenderung();
  }
  if (!(erg.wert > 0)) return toast("Radius: Zahl in Metern größer 0.", "fehler");
  // Je Fuge: mittlere Breite der angrenzenden Segmente (exakt bei gleich breiten Spalten)
  const g = grenzen(s.module);
  const kanten = [g.x, ...fugen.map(f => f.x), g.x + g.b];
  for (const f of ziel) {
    const i = kanten.indexOf(f.x);
    const w = ((kanten[i] - kanten[i - 1]) + (kanten[i + 1] - kanten[i])) / 2;
    const grad = winkelAusRadius(w, erg.wert * 1000);
    if (grad == null) return toast(`Radius zu klein für ${fmt(w)} mm breite Spalten.`, "fehler");
    winkelSetzen(s, f.x, vz * grad);
  }
  aenderung();
}

/* ---------- Darstellung ---------- */
/* Marken unter der Abwicklung: alle durchgehenden Fugen (alleFugen) oder nur die Knicke */
function kurveMarkenSvg(s, alleFugen = true) {
  if (!s.module.length) return "";
  const g = grenzen(s.module);
  const mm = Math.max(g.b, g.h, 1000), fs = mm * 0.02, st = Math.max(4, mm / 900);
  let t = `<g class="fugen">`;
  for (const f of screenFugen(s)) {
    if (!f.grad && (!alleFugen || !f.durchgehend)) continue;
    const farbe = !f.durchgehend ? "#d29922" : f.grad ? "#4da3ff" : "#6b6b6b";
    if (f.grad) t += `<line x1="${f.x}" y1="${g.y}" x2="${f.x}" y2="${g.y + g.h}" stroke="${farbe}" stroke-width="${st * 3}" stroke-dasharray="${st * 10} ${st * 6}" pointer-events="none"/>`;
    t += `<g data-fuge="${f.x}" style="cursor:pointer"><rect x="${f.x - fs * 1.6}" y="${g.y + g.h + fs * 0.25}" width="${fs * 3.2}" height="${fs * 1.3}" rx="${fs * 0.3}" fill="#141414" stroke="${farbe}" stroke-width="${st}"/>
      <text x="${f.x}" y="${g.y + g.h + fs * 1.25}" font-size="${fs * 0.9}" fill="${farbe}" text-anchor="middle">${f.grad > 0 ? "+" : ""}${fmtFlex(f.grad)}°</text></g>`;
  }
  return t + "</g>";
}

/* Draufsicht als eigenständiges SVG (Publikum unten) */
function draufsichtSvg(s, hoehePx = 120) {
  const d = kurveDaten(s);
  if (!d.punkte.length) return "";
  const b = d.sehneMm, h = Math.max(d.stichMm, b * 0.04);
  const rand = b * 0.06, fs = b * 0.045, st = Math.max(4, b / 400);
  const tiefe = Math.max(...d.punkte.map(p => p[1]));
  const linie = d.punkte.map(p => p.join(",")).join(" ");
  return `<svg viewBox="${-rand} ${-rand - fs} ${b + 2 * rand} ${h + 2 * rand + fs * 4}" style="width:100%;height:${hoehePx}px;background:#141414;border-radius:6px" preserveAspectRatio="xMidYMid meet">
    <polyline points="${linie}" fill="none" stroke="#e8e8e8" stroke-width="${st * 3}" stroke-linejoin="round"/>
    ${d.punkte.slice(1, -1).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${st * 2.5}" fill="#4da3ff"/>`).join("")}
    ${d.stichMm > 1 ? `<line x1="0" y1="${tiefe}" x2="${b}" y2="${tiefe}" stroke="#6b6b6b" stroke-width="${st}" stroke-dasharray="${st * 6} ${st * 4}"/>` : ""}
    <text x="${b / 2}" y="${tiefe + fs * 2.2}" font-size="${fs}" fill="#9a9a9a" text-anchor="middle">Sehne ${fmt(d.sehneMm)} mm${d.stichMm > 1 ? ` · Stich ${fmt(d.stichMm)} mm` : ""} · Publikum ↓</text></svg>`;
}

function kurveKarte(s) {
  const d = kurveDaten(s);
  return `<div class="karte"><div class="label">Kurve / Winkel · Draufsicht</div>
    ${d.gebogen ? draufsichtSvg(s) + `<table class="werte" style="margin-top:6px"><tr><td>Knicke</td><td>${d.knicke.length}</td></tr>
      <tr><td>Gesamtwinkel</td><td>${fmtFlex(Math.round(d.gesamtGrad * 10) / 10)}°</td></tr><tr><td>Sehne (Breite gebogen)</td><td>${fmt(d.sehneMm)} mm</td></tr>
      <tr><td>Stich (Tiefe)</td><td>${fmt(d.stichMm)} mm</td></tr>${d.radiusMm ? `<tr><td>Radius</td><td>${fmtFlex(Math.round(d.radiusMm / 10) / 100)} m</td></tr>` : ""}</table>
      <div class="knopfreihe" style="margin-top:8px"><button data-a="winkel">Ändern …</button><button data-a="gerade">Gerade machen</button></div>`
      : `<p class="klein leise">Gerade. Winkel über „∠ Kurve …“ setzen oder eine Fugen-Marke unter der Wand anklicken.</p>`}</div>`;
}

/* ---------- Prüfungen ---------- */
function winkelErlaubt(lib, grad) {
  const led = eintrag(lib)?.attribute?.led || {};
  if (led.mechanik?.kurve === false) return { ok: false, grund: "keine Kurve möglich" };
  const liste = led.mechanik?.winkelGrad;
  if (!Array.isArray(liste) || !liste.length) return { ok: null };
  const mitVorzeichen = liste.some(w => w < 0);
  const treffer = liste.some(w => Math.abs((mitVorzeichen ? grad : Math.abs(grad)) - w) < 0.05);
  return treffer ? { ok: true } : { ok: false, grund: `erlaubt ${liste.map(w => fmtFlex(w) + "°").join(", ")}` };
}

function kurvePruefungen(s) {
  const liste = [];
  const d = kurveDaten(s);
  const z = "screen:" + s.id;
  for (const f of d.fugen.filter(f => f.grad && !f.durchgehend)) liste.push({ art: "warn", text: `${s.name}: Knick bei ${fmt(f.x)} mm, aber ein Modul überspannt die Fuge – Winkel wird ignoriert.`, ziel: z });
  const unbekannt = new Set();
  for (const f of d.knicke) {
    const nachbarn = s.module.filter(m => { const r = modRect(m); return Math.abs(r.x + r.b - f.x) < 0.5 || Math.abs(r.x - f.x) < 0.5; });
    for (const lib of new Set(nachbarn.map(m => m.lib))) {
      const e = winkelErlaubt(lib, f.grad);
      if (e.ok === false) liste.push({ art: "warn", text: `${s.name}: ${fmtFlex(f.grad)}° bei ${fmt(f.x)} mm – ${eintrag(lib)?.name}: ${e.grund}.`, ziel: z });
      if (e.ok === null) unbekannt.add(eintrag(lib)?.name || lib);
    }
  }
  if (unbekannt.size) liste.push({ art: "info", text: `${s.name}: mögliche Winkel für ${[...unbekannt].join(", ")} unbekannt – Library ergänzen.`, ziel: "library:" + s.module.find(m => unbekannt.has(eintrag(m.lib)?.name))?.lib });
  if (d.gebogen && s.bauart === "geflogen") {
    const r = riggingDaten(s);
    const ueber = r.rahmen.filter(x => d.knicke.some(f => f.x > x.x + 0.5 && f.x < x.x + x.b - 0.5));
    if (ueber.length) liste.push({ art: "warn", text: `${s.name}: ${ueber.length} Flugrahmen über einem Knick (Rahmen ${ueber.map(x => x.nr).join(", ")}) – Kurvenrahmen oder Rahmenbreite prüfen.`, ziel: z });
  }
  return liste;
}

/* ===== 15-rigging.js ===== */
/* Rigging (im Reiter Aufbau): Flugrahmen über geflogenen Screens bzw. Bodenlast bei gestellten,
   Last je Rahmen und Aufhängepunkt (Richtwerte, gleichmäßige Verteilung auf die Punkte eines Rahmens).
   screen.rigging = { lib: <Library-ID Flugrahmen/Stacking> | null, anzeigen: true } */

function riggingDaten(s) {
  s.rigging = { lib: null, anzeigen: true, ...(s.rigging || {}) };
  const erg = { rahmen: [], punkte: [], gesamtKg: 0, unbekannt: [], lib: null, spaltenKg: [] };
  if (!s.module.length) return erg;
  const g = grenzen(s.module);
  // Spalten (linke Kante) mit Gewicht
  const spalten = new Map();
  for (const m of s.module) {
    const k = Math.round(m.x);
    const r = modRect(m);
    const sp = spalten.get(k) || { x: r.x, b: r.b, kg: 0, anzahl: 0, unbekannt: false };
    const kg = eintrag(m.lib)?.attribute?.gewicht;
    if (Number.isFinite(kg)) sp.kg += kg; else sp.unbekannt = true;
    sp.anzahl++; sp.b = Math.max(sp.b, r.b);
    spalten.set(k, sp);
  }
  erg.spaltenKg = [...spalten.values()].sort((a, b) => a.x - b.x);
  if (erg.spaltenKg.some(x => x.unbekannt)) erg.unbekannt.push("Modulgewicht");
  const e = eintrag(s.rigging.lib);
  erg.lib = e;
  if (s.bauart !== "geflogen" || !e) { erg.gesamtKg = erg.spaltenKg.reduce((a, x) => a + x.kg, 0); return erg; }
  const led = e.attribute.led || {};
  const breite = (led.breiteModule || 1) * (erg.spaltenKg[0]?.b || 500);
  const n = Math.max(1, Math.ceil(g.b / breite - 1e-6));
  const rahmenKg = e.attribute.gewicht;
  if (!Number.isFinite(rahmenKg)) erg.unbekannt.push("Rahmengewicht");
  const punkteVorlage = Array.isArray(led.punkte) && led.punkte.length ? led.punkte : [{ xMm: breite * 0.25, lastMaxKg: null }, { xMm: breite * 0.75, lastMaxKg: null }];
  for (let i = 0; i < n; i++) {
    const x0 = g.x + i * breite;
    const unter = erg.spaltenKg.filter(sp => sp.x + sp.b / 2 >= x0 && sp.x + sp.b / 2 < x0 + breite);
    const kg = unter.reduce((a, sp) => a + sp.kg, 0) + (Number.isFinite(rahmenKg) ? rahmenKg : 0);
    const rahmen = { nr: i + 1, x: x0, b: breite, y: g.y, kg, spalten: unter.length, lastMaxKg: led.lastMaxKg ?? null };
    erg.rahmen.push(rahmen);
    for (const p of punkteVorlage) erg.punkte.push({ rahmen: i + 1, x: x0 + p.xMm, kg: kg / punkteVorlage.length, lastMaxKg: p.lastMaxKg ?? null });
    erg.gesamtKg += kg;
  }
  return erg;
}

/* SVG-Zusatz: Rahmen und Punkte über dem Screen */
function riggingSvg(s) {
  const d = riggingDaten(s);
  if (s.bauart !== "geflogen" || !d.rahmen.length || !s.rigging.anzeigen) return "";
  const g = grenzen(s.module);
  const mm = Math.max(g.b, g.h, 1000);
  const h = mm * 0.035, st = Math.max(4, mm / 900), fs = mm * 0.022;
  let t = `<g class="rigging" pointer-events="none">`;
  for (const r of d.rahmen) {
    const ueber = r.lastMaxKg && r.kg > r.lastMaxKg;
    t += `<rect x="${r.x + st}" y="${g.y - h - st}" width="${r.b - 2 * st}" height="${h}" fill="none" stroke="${ueber ? "#d29922" : "#e8e8e8"}" stroke-width="${st * 1.4}"/>
      <text x="${r.x + r.b / 2}" y="${g.y - h - st * 3}" font-size="${fs}" fill="#e8e8e8" text-anchor="middle">${fmt(r.kg, 1)} kg</text>`;
  }
  for (const p of d.punkte) {
    const ueber = p.lastMaxKg && p.kg > p.lastMaxKg;
    const y0 = g.y - h - st, y1 = y0 - mm * 0.09;
    t += `<line x1="${p.x}" y1="${y0}" x2="${p.x}" y2="${y1}" stroke="#9a9a9a" stroke-width="${st}" stroke-dasharray="${st * 6} ${st * 4}"/>
      <circle cx="${p.x}" cy="${y1}" r="${mm * 0.008}" fill="#141414" stroke="${ueber ? "#d29922" : "#e8e8e8"}" stroke-width="${st * 1.2}"/>
      <text x="${p.x}" y="${y1 - mm * 0.016}" font-size="${fs * 0.85}" fill="#9a9a9a" text-anchor="middle">${fmt(p.kg, 1)}</text>`;
  }
  return t + `<text x="${g.x}" y="${g.y - h - mm * 0.15}" font-size="${fs}" fill="#9a9a9a">Aufhängepunkte · Last je Punkt in kg (Richtwert, gleichmäßig verteilt)</text></g>`;
}

function riggingKarte(s) {
  const d = riggingDaten(s);
  const serien = [...new Set(s.module.map(m => eintrag(m.lib)?.attribute?.led?.serie))];
  const passend = libListe("rigging").filter(e => (e.attribute.led.art === (s.bauart === "geflogen" ? "flugrahmen" : "stacking")));
  const maxPunkt = Math.max(0, ...d.punkte.map(p => p.kg));
  return `<div class="karte"><div class="label">Rigging · ${s.bauart}</div>
    <label class="feld"><span>${s.bauart === "geflogen" ? "Flugrahmen" : "Stacking / Bodenstütze"}</span><select data-rig="lib"><option value="">— keiner —</option>
      ${passend.map(e => `<option value="${e.id}"${s.rigging?.lib === e.id ? " selected" : ""}${eintragNutzbar(e) ? "" : " disabled"}>${esc(e.name)}${eintragNutzbar(e) ? "" : " (Pflicht fehlt)"}${(e.attribute.led.serien || []).some(x => serien.includes(x)) ? "" : " – andere Serie"}</option>`).join("")}</select></label>
    <label class="feld check"><input type="checkbox" data-rig="anzeigen" ${s.rigging?.anzeigen !== false ? "checked" : ""}><span>In der Zeichnung anzeigen</span></label>
    <table class="werte">${s.bauart === "geflogen" && d.rahmen.length ? `<tr><td>Flugrahmen</td><td>${d.rahmen.length}</td></tr><tr><td>Aufhängepunkte</td><td>${d.punkte.length}</td></tr>
      <tr><td>Max. Last je Punkt</td><td>${fmt(maxPunkt, 1)} kg</td></tr>` : ""}
      <tr><td>${s.bauart === "geflogen" ? "Gesamtlast" : "Bodenlast gesamt"}</td><td>${fmt(d.gesamtKg, 1)} kg${d.unbekannt.length ? " + ?" : ""}</td></tr>
      ${s.bauart === "gestellt" ? `<tr><td>Max. je Spalte</td><td>${fmt(Math.max(0, ...d.spaltenKg.map(x => x.kg)), 1)} kg</td></tr>` : ""}</table>
    <p class="klein leise">Richtwerte. Ersetzt keine Statik – Freigabe ${P.regeln.riggingFreigabe === "extern" ? "extern" : "intern"} durch fachkundige Person.</p></div>`;
}

function riggingPruefungen() {
  const liste = [];
  for (const s of P.screens.filter(s => s.module.length)) {
    const d = riggingDaten(s);
    if (s.bauart === "geflogen" && !d.lib) liste.push({ art: "info", text: `${s.name}: kein Flugrahmen gewählt – Lasten je Punkt nicht berechnet.`, ziel: "screen:" + s.id });
    if (d.unbekannt.length) liste.push({ art: "warn", text: `${s.name}: Rigging-Last unvollständig (${d.unbekannt.join(", ")} fehlt).`, ziel: "screen:" + s.id });
    for (const r of d.rahmen) if (r.lastMaxKg && r.kg > r.lastMaxKg) liste.push({ art: "warn", text: `${s.name}: Flugrahmen ${r.nr} trägt ${fmt(r.kg, 1)} kg, zulässig ${fmt(r.lastMaxKg)} kg.`, ziel: "screen:" + s.id });
    for (const p of d.punkte) if (p.lastMaxKg && p.kg > p.lastMaxKg) liste.push({ art: "warn", text: `${s.name}: Punkt an Rahmen ${p.rahmen} mit ${fmt(p.kg, 1)} kg über ${fmt(p.lastMaxKg)} kg.`, ziel: "screen:" + s.id });
    if (d.lib && d.rahmen.some(r => !r.lastMaxKg)) liste.push({ art: "warn", text: `${s.name}: zulässige Last des Flugrahmens unbekannt – nicht geprüft.`, ziel: "library:" + d.lib.id });
  }
  return liste;
}

function riggingEreignisse() {
  $("#rechts").addEventListener("change", e => {
    if (ui.reiter !== "aufbau") return;
    const f = e.target.dataset.rig; if (!f) return;
    const s = aktuellerScreen(); riggingDaten(s);
    if (f === "lib") { s.rigging.lib = e.target.value || null; if (s.rigging.lib) nutzeEintrag(s.rigging.lib); }
    if (f === "anzeigen") s.rigging.anzeigen = e.target.checked;
    aenderung();
  });
}

/* ===== 20-strom.js ===== */
/* Reiter Strom: Verteiler, Einspeisungen, Lakas, Kreise (Vorschlag + Pinsel), Phasen, Übersicht. */

/* ---------- Rechnen ---------- */
const PHASEN = ["L1", "L2", "L3"];

function modulLast(m, planung = P.regeln.planung) {
  const a = eintrag(m.lib)?.attribute || {};
  if (planung === "durchschnitt") return Number.isFinite(a.led?.wTyp) ? a.led.wTyp : (Number.isFinite(a.stromverbrauch) ? a.stromverbrauch : 0);
  return Number.isFinite(a.stromverbrauch) ? a.stromverbrauch : 0;
}
function verteilerLed(v) { return eintrag(v.lib)?.attribute?.led || {}; }
function kanalVon(v, nr) { return (verteilerLed(v).kanaele || []).find(k => k.nr === nr) || null; }
function kanalPhase(v, nr) {
  const k = kanalVon(v, nr);
  if (k?.phase) return { phase: k.phase, angenommen: false };
  return { phase: "L" + (((nr - 1) % 3) + 1), angenommen: true };
}
function kreisKapazitaet(k) {
  const v = geraetById(k.verteiler);
  const amp = (v && kanalVon(v, k.kanal)?.ampere) || P.regeln.absicherung;
  return amp * P.regeln.spannung * (1 - P.regeln.reserve / 100);
}
function kreisModule(k) { const s = screenById(k.screen); const map = new Map((s?.module || []).map(m => [m.id, m])); return k.module.map(id => map.get(id)).filter(Boolean); }
function kreisLast(k, planung) { return kreisModule(k).reduce((a, m) => a + modulLast(m, planung), 0); }
function maxJeBruecke(module) {
  const w = module.map(m => eintrag(m.lib)?.attribute?.led?.strom?.maxJeBruecke).filter(Number.isFinite);
  return w.length ? Math.min(...w) : Infinity;
}
/* Kreise eines Screens in Anzeigereihenfolge (nach Verteiler und Kanal) */
function kreiseVon(screenId) {
  const vIdx = id => P.geraete.findIndex(g => g.id === id);
  return P.kreise.filter(k => k.screen === screenId).sort((a, b) => vIdx(a.verteiler) - vIdx(b.verteiler) || a.kanal - b.kanal);
}
function kreisName(k) {
  const vs = P.geraete.filter(g => g.art === "verteiler");
  const vi = vs.findIndex(v => v.id === k.verteiler);
  return (vs.length > 1 ? `V${vi + 1}·` : "") + "K" + k.kanal;
}
function kreisFarbe(k) { const liste = kreiseVon(k.screen); return wegFarbe(liste.indexOf(k)); }

/* Lasten je Verteiler und Einspeisung (inkl. nachgelagerter Verteiler und Geräte) */
function stromBilanz() {
  const v = new Map();
  for (const g of P.geraete) if (g.art === "verteiler" || g.art === "einspeisung") v.set(g.id, { phasen: { L1: 0, L2: 0, L3: 0 }, phasenTyp: { L1: 0, L2: 0, L3: 0 }, w: 0, wTyp: 0 });
  const add = (id, phase, w, wTyp) => { const b = v.get(id); if (!b) return; b.phasen[phase] += w / P.regeln.spannung; b.phasenTyp[phase] += wTyp / P.regeln.spannung; b.w += w; b.wTyp += wTyp; };
  // Kreise
  for (const k of P.kreise) {
    const ver = geraetById(k.verteiler); if (!ver) continue;
    const { phase } = kanalPhase(ver, k.kanal);
    add(ver.id, phase, kreisLast(k, "max"), kreisLast(k, "durchschnitt"));
  }
  // Geräte an Kanälen (Prozessor, Stagebox)
  for (const g of P.geraete) {
    if (!g.strom?.verteiler) continue;
    const ver = geraetById(g.strom.verteiler); if (!ver) continue;
    const w = eintrag(g.lib)?.attribute?.stromverbrauch || 0;
    add(ver.id, kanalPhase(ver, g.strom.kanal).phase, w, w);
  }
  // Nachgelagerte Verteiler nach oben summieren (Schleifen werden ignoriert)
  const summe = new Map();
  const gesamt = (id, besucht = new Set()) => {
    if (summe.has(id)) return summe.get(id);
    if (besucht.has(id)) return v.get(id);
    besucht.add(id);
    const eigen = v.get(id);
    const erg = { phasen: { ...eigen.phasen }, phasenTyp: { ...eigen.phasenTyp }, w: eigen.w, wTyp: eigen.wTyp };
    for (const kind of P.geraete.filter(g => g.art === "verteiler" && g.speisung?.von === id)) {
      const k = gesamt(kind.id, besucht);
      for (const p of PHASEN) { erg.phasen[p] += k.phasen[p]; erg.phasenTyp[p] += k.phasenTyp[p]; }
      erg.w += k.w; erg.wTyp += k.wTyp;
    }
    summe.set(id, erg);
    return erg;
  };
  for (const id of v.keys()) gesamt(id);
  return summe;
}
function schieflast(ph) {
  const w = PHASEN.map(p => ph[p]); const max = Math.max(...w);
  return max > 0 ? (max - Math.min(...w)) / max : 0;
}
function einspeisungAmpere(g) {
  if (g.art === "einspeisung") return Number(g.ampere) || 0;
  return Number(verteilerLed(g).einspeisung?.ampere) || 0;
}

/* Laka für einen Ausgang sicherstellen (Harting/Socapex-Ausgänge) */
function sichereLaka(v, ausgangName, screenId) {
  const ausgang = (verteilerLed(v).ausgaenge || []).find(a => a.name === ausgangName);
  if (!ausgang || !/harting|socapex/i.test(ausgang.stecker || "")) return null;
  let l = P.lakas.find(l => l.verteiler === v.id && l.ausgang === ausgangName);
  if (l) { if (!l.screen) l.screen = screenId; return l; }
  const passend = libListe("laka").filter(e => e.attribute.led.stecker === ausgang.stecker && e.attribute.led.kreise >= ausgang.kanaele.length)
    .sort((a, b) => Math.abs(a.attribute.led.laengeM - 25) - Math.abs(b.attribute.led.laengeM - 25));
  const lib = passend[0]?.id || null;
  if (lib) nutzeEintrag(lib);
  l = { id: neueId("l"), lib, verteiler: v.id, ausgang: ausgangName, screen: screenId, laengeM: lib ? eintrag(lib).attribute.led.laengeM : null };
  P.lakas.push(l);
  return l;
}
function lakaFuerKreis(k) {
  const v = geraetById(k.verteiler); if (!v) return null;
  const kanal = kanalVon(v, k.kanal); if (!kanal) return null;
  return P.lakas.find(l => l.verteiler === v.id && l.ausgang === kanal.ausgang) || null;
}

/* Freie Kanäle eines Verteilers */
function belegteKanaele(vId) { return new Set([...P.kreise.filter(k => k.verteiler === vId).map(k => k.kanal), ...P.geraete.filter(g => g.strom?.verteiler === vId).map(g => g.strom.kanal)]); }

/* ---------- Vorschlag ---------- */
async function stromVorschlag() {
  const s = aktuellerScreen();
  if (!s?.module.length) return toast("Der Screen hat keine Module.", "fehler");
  let v = geraetById(ui.sel.verteiler);
  if (!v || v.art !== "verteiler") v = P.geraete.find(g => g.art === "verteiler");
  if (!v) {
    const lib = libListe("verteiler").find(eintragNutzbar);
    if (!lib) return toast("Keine Stromverteiler in der Library.", "fehler");
    v = verteilerAnlegen(lib.id, false);
    toast(`${v.name} (${lib.name}) angelegt.`, "ok");
  }
  const alt = P.kreise.filter(k => k.screen === s.id);
  if (alt.length && !confirm(`Die ${alt.length} vorhandenen Kreise von „${s.name}“ ersetzen?`)) return;
  P.kreise = P.kreise.filter(k => k.screen !== s.id);
  const reihe = schlangenReihenfolge(s.module, s.strom.richtung, s.strom.start);
  const led = verteilerLed(v);
  const belegt = belegteKanaele(v.id);
  // Kanäle: ganze Ausgänge bevorzugen, die schon diesem Screen gehören oder frei sind
  const ausgaenge = (led.ausgaenge || []).map(a => ({ a, frei: a.kanaele.filter(n => !belegt.has(n)),
    eigen: P.lakas.some(l => l.verteiler === v.id && l.ausgang === a.name && l.screen === s.id),
    fremd: P.lakas.some(l => l.verteiler === v.id && l.ausgang === a.name && l.screen && l.screen !== s.id) }))
    .filter(x => !x.fremd)
    .sort((x, y) => (y.eigen - x.eigen) || (y.frei.length - x.frei.length));
  const freieKanaele = ausgaenge.flatMap(x => x.frei);
  if (!led.ausgaenge?.length) freieKanaele.push(...(led.kanaele || []).map(k => k.nr).filter(n => !belegt.has(n)));
  if (!freieKanaele.length) return toast(`${v.name}: keine freien Kanäle.`, "fehler");
  const kap = Math.min(...freieKanaele.map(n => (kanalVon(v, n)?.ampere || P.regeln.absicherung) * P.regeln.spannung * (1 - P.regeln.reserve / 100)));
  // „ausgang“: so viele Kreise, wie der erste Ausgang freie Kanäle hat (mehr Reserve)
  const nMin = s.strom.verteilung === "ausgang" ? (ausgaenge[0]?.frei.length || 1) : 1;
  const { grenzen: g, ueberlast } = segmentieren(reihe.map(m => modulLast(m)), kap, maxJeBruecke(reihe), nMin);
  const n = g.length - 1;
  if (n > freieKanaele.length) return toast(`${v.name}: ${n} Kreise nötig, aber nur ${freieKanaele.length} Kanäle frei. Weiteren Verteiler anlegen.`, "fehler");
  for (let i = 0; i < n; i++) {
    const kanal = freieKanaele[i];
    P.kreise.push({ id: neueId("k"), screen: s.id, verteiler: v.id, kanal, module: reihe.slice(g[i], g[i + 1]).map(m => m.id) });
    const ka = kanalVon(v, kanal); if (ka?.ausgang) sichereLaka(v, ka.ausgang, s.id);
  }
  ui.sel.verteiler = v.id;
  aenderung();
  toast(`${n} Kreise an ${v.name} vorgeschlagen${ueberlast ? " – Achtung: einzelne Module über der Kreisgrenze" : ""}.`, ueberlast ? "fehler" : "ok");
}

/* ---------- Geräte ---------- */
function verteilerAnlegen(libId, mitRender = true) {
  nutzeEintrag(libId);
  const n = P.geraete.filter(g => g.art === "verteiler").length + 1;
  const kabel = libListe("kabel").find(e => e.attribute.led.gewerk === "strom" && /63/.test(e.name))?.id || null;
  if (kabel) nutzeEintrag(kabel);
  const v = { id: neueId("v"), art: "verteiler", lib: libId, name: "Verteiler " + n, standort: "", speisung: { von: null, kabel, laengeM: null } };
  P.geraete.push(v);
  ui.sel.verteiler = v.id;
  if (mitRender) aenderung();
  return v;
}
async function einspeisungAnlegen() {
  const erg = await formularDialog("Einspeisung anlegen", [
    { name: "name", label: "Name *", wert: "Hausanschluss " + (P.geraete.filter(g => g.art === "einspeisung").length + 1) },
    { name: "stecker", label: "Anschluss", art: "auswahl", wert: "CEE 125 A", optionen: [["CEE 16 A", "CEE 16 A"], ["CEE 32 A", "CEE 32 A"], ["CEE 63 A", "CEE 63 A"], ["CEE 125 A", "CEE 125 A"], ["Powerlock", "Powerlock"], ["Aggregat", "Aggregat"]] },
    { name: "ampere", label: "Absicherung (A)", art: "zahl", wert: 125 },
    { name: "standort", label: "Standort", wert: "" },
  ], "Anlegen");
  if (!erg) return;
  if (!erg.name.trim() || !(erg.ampere > 0)) return toast("Name und Absicherung (A) angeben.", "fehler");
  const g = { id: neueId("e"), art: "einspeisung", name: erg.name.trim(), stecker: erg.stecker, ampere: erg.ampere, standort: erg.standort };
  P.geraete.push(g);
  ui.sel.verteiler = g.id;
  aenderung();
}
function geraetLoeschen(g) {
  if (!confirm(`„${g.name}“ löschen? Zugehörige Kreise und Lakas werden entfernt.`)) return;
  P.geraete = P.geraete.filter(x => x !== g);
  P.kreise = P.kreise.filter(k => k.verteiler !== g.id);
  P.lakas = P.lakas.filter(l => l.verteiler !== g.id);
  P.straenge = P.straenge.filter(k => k.prozessor !== g.id);
  P.geraete = P.geraete.filter(x => !(istWeg(x) && x.prozessor === g.id));
  for (const x of P.geraete) { if (x.speisung?.von === g.id) x.speisung.von = null; if (x.strom?.verteiler === g.id) x.strom = null; }
  ui.sel.verteiler = null; ui.sel.prozessor = null;
  aenderung();
}

/* ---------- Pinsel ---------- */
function pinselZiele() {
  const ziele = [];
  for (const v of P.geraete.filter(g => g.art === "verteiler")) {
    for (const k of verteilerLed(v).kanaele || []) {
      const kreis = P.kreise.find(x => x.verteiler === v.id && x.kanal === k.nr);
      const fremd = P.geraete.some(g => g.strom?.verteiler === v.id && g.strom.kanal === k.nr);
      if (fremd) continue;
      ziele.push({ wert: `${v.id}|${k.nr}`, text: `${v.name} · Kanal ${k.nr} (${kanalPhase(v, k.nr).phase})${kreis ? " · " + (screenById(kreis.screen)?.name || "") + " " + kreis.module.length + " Mod." : " · frei"}` });
    }
  }
  return ziele;
}
function stromPinselMalen(svg, s, e) {
  if (!ui.pinsel.strom) { toast("Zuerst oben einen Kanal für den Pinsel wählen.", "fehler"); return null; }
  const [vId, kanalText] = ui.pinsel.strom.split("|");
  const kanal = Number(kanalText);
  const v = geraetById(vId); if (!v) return null;
  let kreis = P.kreise.find(k => k.verteiler === vId && k.kanal === kanal);
  if (kreis && kreis.screen !== s.id) { toast(`Kanal ${kanal} versorgt schon „${screenById(kreis.screen)?.name}“.`, "fehler"); return null; }
  if (!kreis) { kreis = { id: neueId("k"), screen: s.id, verteiler: vId, kanal, module: [] }; P.kreise.push(kreis); }
  const ka = kanalVon(v, kanal); if (ka?.ausgang) sichereLaka(v, ka.ausgang, s.id);
  const hinzu = id => {
    if (kreis.module.includes(id)) return;
    for (const k of P.kreise) if (k !== kreis && k.screen === s.id) k.module = k.module.filter(x => x !== id);
    kreis.module.push(id);
    P.kreise = P.kreise.filter(k => k.module.length || k === kreis);
    svg.innerHTML = stromSvgInhalt(s);
    const last = kreisLast(kreis), kap = kreisKapazitaet(kreis);
    pinselAnzeige(`${kreisName(kreis)}: ${kreis.module.length} Module · ${fmt(last)} W von ${fmt(kap)} W (${fmt(last / kap * 100)} %)`, last > kap || kreis.module.length > maxJeBruecke(kreisModule(kreis)));
  };
  return hinzu;
}
function pinselAnzeige(text, warn) {
  let el = $("#zeichnung .pinselanzeige");
  if (!el) { el = document.createElement("div"); el.className = "zoomanzeige pinselanzeige"; el.style.bottom = "34px"; $("#zeichnung").appendChild(el); }
  el.textContent = text; el.style.color = warn ? "var(--warnung)" : "var(--text)";
}
/* Gemeinsame Pinsel-Mechanik für Strom und Signal */
function pinselInteraktion(svg, s, starte) {
  let malen = null;
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0 || leertaste.gedrueckt || ui.werkzeug !== "pinsel") return;
    const g = e.target.closest("[data-mod]"); if (!g) return;
    malen = starte(svg, s, e);
    if (!malen) return;
    malen(g.dataset.mod);
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!malen) return;
    const el = document.elementFromPoint(e.clientX, e.clientY)?.closest?.("[data-mod]");
    if (el) malen(el.dataset.mod);
  });
  svg.addEventListener("pointerup", () => { if (malen) { malen = null; aenderung(); } });
}

/* ---------- Darstellung ---------- */
function stromSvgInhalt(s) {
  const kreise = kreiseVon(s.id);
  const farbe = new Map(); kreise.forEach((k, i) => k.module.forEach(id => farbe.set(id, wegFarbe(i))));
  const ohne = new Set(s.module.filter(m => !farbe.has(m.id)).map(m => m.id));
  return screenSvgInhalt(s, {
    fuellung: m => farbe.has(m.id) ? farbe.get(m.id) + "2e" : "transparent",
    fehlerIds: ohne, auswahl: new Set(),
    wege: kreise.map((k, i) => ({ farbe: wegFarbe(i), module: k.module, start: kreisName(k) })),
    oben: `${s.name} · Strom · ${P.regeln.planung === "max" ? "Max.-Last" : "Durchschnitt"}`,
  });
}

      }).join("")}
      <div class="knopfreihe"><button data-s="geraet-loeschen" class="gefahr">Verteiler löschen</button></div></div>`;
  } else if (g && g.art === "einspeisung") {
    const b = bilanz.get(g.id);
    html += `<div class="karte"><div class="label">Einspeisung · ${esc(g.name)}</div>
      <label class="feld"><span>Name *</span><input data-g-feld="name" value="${esc(g.name)}"></label>
      <div class="zwei"><label class="feld"><span>Anschluss</span><input data-g-feld="stecker" value="${esc(g.stecker)}"></label>
      <label class="feld"><span>Absicherung (A)</span><input data-g-feld="ampere" value="${g.ampere}" inputmode="decimal"></label></div>
      <label class="feld"><span>Standort</span><input data-g-feld="standort" value="${esc(g.standort || "")}"></label>
      ${PHASEN.map(p => `<div class="phase"><span style="color:${PHASENFARBE[p]}">${p}</span>${balken(g.ampere ? b.phasen[p] / g.ampere : 0, false)}<span>${fmt(b.phasen[p], 1)} / ${fmt(g.ampere)} A</span></div>`).join("")}
      <div class="knopfreihe"><button data-s="geraet-loeschen" class="gefahr">Einspeisung löschen</button></div></div>`;
  } else if (!kreis) {
    html += `<div class="karte"><p class="klein leise">Verteiler links im Projektbaum oder in der Library anklicken. Kreise per „Vorschlag erzeugen“ oder mit dem Pinsel anlegen.</p></div>`;
  }
  return html;
}

function stromUebersicht(el) {
  el.classList.add("liste-modus");
  const bilanz = stromBilanz();
  const vs = P.geraete.filter(g => g.art === "verteiler");
  const es = P.geraete.filter(g => g.art === "einspeisung");
  if (!vs.length && !es.length) return void (el.innerHTML = `<p class="leise">Noch keine Verteiler oder Einspeisungen.</p>`);
  const pl = P.regeln.planung === "max" ? "phasen" : "phasenTyp";
  el.innerHTML = `<div class="uebersicht">${[...vs, ...es].map(g => {
    const b = bilanz.get(g.id); const amp = einspeisungAmpere(g);
    const sl = schieflast(b[pl]);
    const kopf = `<div class="knopfreihe"><h2 style="margin:0">${esc(g.name)}${g.art === "verteiler" ? " · " + esc(eintrag(g.lib)?.name || "") : ""}</h2><span class="fueller"></span>
      ${b.w ? (sl * 100 > P.regeln.schieflast ? `<span class="badge teil">Schieflast</span>` : `<span class="badge voll">ok</span>`) : `<span class="badge teil">leer</span>`}</div>`;
    const phasen = PHASEN.map(p => `<div class="phase"><span style="color:${PHASENFARBE[p]}">${p}</span>${balken(amp ? b[pl][p] / amp : 0, false)}<span>${fmt(b[pl][p], 1)} / ${fmt(amp)} A</span></div>`).join("");
    const quelle = g.speisung?.von ? geraetById(g.speisung.von)?.name : null;
    let kanaele = "";
    if (g.art === "verteiler") {
      const led = verteilerLed(g);
      kanaele = (led.ausgaenge || []).map(a => {
        const l = P.lakas.find(x => x.verteiler === g.id && x.ausgang === a.name);
        return `<div class="label">${esc(a.name)}${l ? " · Laka → " + esc(screenById(l.screen)?.name || "") : " · frei"}</div><div class="kanalgitter">${a.kanaele.map(n => {
          const k = P.kreise.find(x => x.verteiler === g.id && x.kanal === n);
          const dev = P.geraete.find(x => x.strom?.verteiler === g.id && x.strom.kanal === n);
          const ph = kanalPhase(g, n);
          if (k) return `<div class="kanal" style="border-color:${kreisFarbe(k)}"><b>${n}</b><br>${ph.phase} · ${fmt(kreisLast(k) / P.regeln.spannung, 1)} A</div>`;
          if (dev) return `<div class="kanal" style="border-color:var(--text-leise)"><b>${n}</b><br>${esc(dev.name)}</div>`;
          return `<div class="kanal frei">${n}<br>${ph.phase} · frei</div>`;
        }).join("")}</div>`;
      }).join("");
    }
    return `<div class="karte">${kopf}<p class="klein leise">${g.standort ? "Standort: " + esc(g.standort) + " · " : ""}${g.art === "verteiler" ? `Einspeisung ${esc(verteilerLed(g).einspeisung?.typ || "—")}${quelle ? " ← " + esc(quelle) : ""}` : `Anschluss ${esc(g.stecker)} · ${fmt(g.ampere)} A`}</p>
      ${phasen}<p class="klein leise">Schieflast ${fmt(sl * 100)} % · Max. ${fmt(b.w / 1000, 2)} kW · Ø ${fmt(b.wTyp / 1000, 2)} kW</p>${kanaele}</div>`;
  }).join("")}</div>`;
}

function stromListeAlle() {

  for (const v of P.geraete.filter(g => g.art === "verteiler")) {
    for (const k of P.kreise.filter(x => x.verteiler === v.id).sort((a, b) => a.kanal - b.kanal)) {
      const ph = kanalPhase(v, k.kanal);
      zeilen.push(`<tr><td>${esc(v.name)}</td><td>${k.kanal}</td><td>${ph.phase}${ph.angenommen ? " ?" : ""}</td><td>${esc(kanalVon(v, k.kanal)?.ausgang || "—")}</td>
        <td><span class="punkt" style="background:${kreisFarbe(k)}"></span>${kreisName(k)}</td><td>${esc(screenById(k.screen)?.name || "—")}</td>
        <td class="zahl">${fmt(kreisLast(k, "max"))} W</td><td class="zahl">${fmt(kreisLast(k, "durchschnitt"))} W</td><td>${balken(kreisLast(k) / kreisKapazitaet(k))}</td></tr>`);
    }
  }
  const belegt = zeilen.length;
  const gesamt = P.geraete.filter(g => g.art === "verteiler").reduce((a, v) => a + (verteilerLed(v).kanaele || []).length, 0);

    ${zeilen.join("") || `<tr><td colspan="9" class="leise">Keine Kreise.</td></tr>`}</table>`;
}

function stromPruefungen() {
  const liste = [];
  if (!P.screens.some(s => s.module.length)) return liste;
  const vs = P.geraete.filter(g => g.art === "verteiler");
  if (!vs.length) liste.push({ art: "warn", text: "Noch kein Stromverteiler angelegt." });
  for (const s of P.screens) {
    const zugeordnet = new Set(P.kreise.filter(k => k.screen === s.id).flatMap(k => k.module));
    const ohne = s.module.filter(m => !zugeordnet.has(m.id));
    if (ohne.length) liste.push({ art: "warn", text: `${s.name}: ${ohne.length} Module ohne Stromkreis.`, ziel: "screen:" + s.id });
  }
  let einschaltUnbekannt = false;
  for (const k of P.kreise) {
    const last = kreisLast(k), kap = kreisKapazitaet(k), ms = kreisModule(k);
    const s = screenById(k.screen);
    if (last > kap) liste.push({ art: "warn", text: `${s?.name} ${kreisName(k)}: ${fmt(last)} W über ${fmt(kap)} W (inkl. Reserve).`, ziel: "screen:" + k.screen });
    const mx = maxJeBruecke(ms);
    if (ms.length > mx) liste.push({ art: "warn", text: `${s?.name} ${kreisName(k)}: ${ms.length} Module an einer Brücke, erlaubt ${mx}.`, ziel: "screen:" + k.screen });
    if (P.regeln.einschaltPruefen) {
      const werte = ms.map(m => eintrag(m.lib)?.attribute?.led?.einschaltstromA);
      if (werte.some(w => !Number.isFinite(w))) einschaltUnbekannt = true;
      else {
        const summe = werte.reduce((a, b) => a + b, 0);
        const v = geraetById(k.verteiler); const ka = kanalVon(v, k.kanal);
        const faktor = { B: 5, C: 10, D: 20 }[ka?.charakteristik || "C"] || 10;
        const grenze = (ka?.ampere || P.regeln.absicherung) * faktor;
        if (summe > grenze) liste.push({ art: "warn", text: `${s?.name} ${kreisName(k)}: Einschaltstrom ${fmt(summe)} A über ${fmt(grenze)} A (${ka?.charakteristik || "C"}-Automat) – Kreis teilen oder gestaffelt einschalten.`, ziel: "screen:" + k.screen });
      }
    }
  }
  if (einschaltUnbekannt && P.regeln.einschaltPruefen && P.kreise.length) liste.push({ art: "warn", text: "Einschaltstrom der Module unbekannt – nicht geprüft." });
  const bilanz = stromBilanz();
  for (const g of P.geraete.filter(g => g.art === "verteiler" || g.art === "einspeisung")) {
    const b = bilanz.get(g.id); const amp = einspeisungAmpere(g);
    for (const p of PHASEN) if (amp && b.phasen[p] > amp) liste.push({ art: "warn", text: `${g.name}: ${p} mit ${fmt(b.phasen[p], 1)} A über ${fmt(amp)} A.`, ziel: "verteiler:" + g.id });
    const sl = schieflast(P.regeln.planung === "max" ? b.phasen : b.phasenTyp);
    if (b.w && sl * 100 > P.regeln.schieflast) liste.push({ art: "warn", text: `${g.name}: Schieflast ${fmt(sl * 100)} % (erlaubt ${fmt(P.regeln.schieflast)} %).`, ziel: "verteiler:" + g.id });
    if (g.art === "verteiler") {
      if (verteilerLed(g).phasenBekannt !== true && P.kreise.some(k => k.verteiler === g.id)) liste.push({ art: "warn", text: `${g.name}: Phasenzuordnung der Kanäle unbekannt – L1/L2/L3 der Reihe nach angenommen.`, ziel: "verteiler:" + g.id });
      if (!g.speisung?.von) liste.push({ art: "info", text: `${g.name}: Einspeisung nicht festgelegt.`, ziel: "verteiler:" + g.id });
      if (!P.kreise.some(k => k.verteiler === g.id) && !P.geraete.some(x => x.strom?.verteiler === g.id)) liste.push({ art: "info", text: `${g.name}: keine Kreise – wird er gebraucht?`, ziel: "verteiler:" + g.id });
    }
  }
  for (const l of P.lakas) {
    const anz = P.kreise.filter(k => lakaFuerKreis(k) === l).length;
    const e = eintrag(l.lib);
    if (!e) liste.push({ art: "warn", text: `Laka an ${geraetById(l.verteiler)?.name} ${l.ausgang}: kein passender Typ in der Library.` });
    else if (anz > e.attribute.led.kreise) liste.push({ art: "warn", text: `${e.name}: ${anz} Kreise, Laka hat nur ${e.attribute.led.kreise}.` });
  }
  return liste;
}

/* ---------- Ereignisse ---------- */
function stromEreignisse() {
  $("#werkzeuge").addEventListener("click", e => {
    if (ui.reiter !== "strom") return;
    const b = e.target.closest("[data-s]"); if (!b) return;
    const a = b.dataset.s;
    if (a === "vorschlag") stromVorschlag();
    else if (a === "pinsel") {
      ui.werkzeug = ui.werkzeug === "pinsel" ? "auswahl" : "pinsel";
      if (ui.werkzeug === "pinsel" && !ui.pinsel.strom) { const z = pinselZiele().find(z => z.text.endsWith("frei")) || pinselZiele()[0]; ui.pinsel.strom = z?.wert || null; }
      render();
    }
    else if (a === "kreis-loeschen" && ui.sel.kreis) kreisLoeschen(ui.sel.kreis);
    else if (a === "planung") { P.regeln.planung = b.dataset.wert; aenderung(); }
    else if (a === "modus") { ui.modus.strom = b.dataset.wert; render(); }
  });
  $("#werkzeuge").addEventListener("change", e => {
    if (ui.reiter !== "strom") return;
    const f = e.target.dataset.sFeld; const s = aktuellerScreen();
    if (f === "richtung" || f === "start" || f === "verteilung") { s.strom[f] = e.target.value; aenderung(); }
    if (f === "pinselziel") { ui.pinsel.strom = e.target.value || null; if (ui.pinsel.strom) ui.werkzeug = "pinsel"; render(); }
  });
  $("#palette").addEventListener("click", e => {
    if (ui.reiter !== "strom") return;
    const b = e.target.closest("[data-s]"); if (!b) return;
    if (b.dataset.s === "einspeisung") einspeisungAnlegen();
    if (b.dataset.s === "verteiler-neu") verteilerAnlegen(b.dataset.lib);
  });
  $("#liste").addEventListener("click", e => {
    if (ui.reiter !== "strom") return;
    const tr = e.target.closest("[data-kreis]"); if (!tr) return;
    const k = P.kreise.find(x => x.id === tr.dataset.kreis);
    ui.sel.kreis = k?.id || null; if (k) ui.sel.verteiler = k.verteiler;
    render();
  });
  $("#rechts").addEventListener("click", e => {
    if (ui.reiter !== "strom") return;
    const b = e.target.closest("[data-s]"); if (!b) return;
    const a = b.dataset.s;
    if (a === "kreis-loeschen" && ui.sel.kreis) kreisLoeschen(ui.sel.kreis);
    if (a === "kreis-pinsel") { const k = P.kreise.find(x => x.id === ui.sel.kreis); if (k) { ui.pinsel.strom = `${k.verteiler}|${k.kanal}`; ui.werkzeug = "pinsel"; ui.screen = k.screen; render(); } }
    if (a === "geraet-loeschen") { const g = geraetById(ui.sel.verteiler); if (g) geraetLoeschen(g); }
    if (a === "laka-weg") { P.lakas = P.lakas.filter(l => l.id !== b.dataset.laka); aenderung(); }
  });
  $("#rechts").addEventListener("change", e => {
    if (ui.reiter !== "strom") return;
    const g = geraetById(ui.sel.verteiler);
    const f = e.target.dataset.gFeld;
    if (f && g) {
      let wert = e.target.value;
      if (f === "name" && !wert.trim()) { toast("Name: darf nicht leer sein.", "fehler"); return render(); }
      if (f.endsWith("laengeM") || f === "ampere") { const z = leseZahl(wert); if (Number.isNaN(z)) return toast("Bitte eine Zahl eingeben.", "fehler"); wert = z; }
      if (f === "speisung.kabel" && wert) nutzeEintrag(wert);
      setzePfad(g, f, wert === "" ? null : wert);
      return aenderung();
    }
    const lakaId = e.target.dataset.laka;
    if (lakaId) {
      const l = P.lakas.find(x => x.id === lakaId); if (!l) return;
      if (e.target.dataset.lakaFeld === "lib") { l.lib = e.target.value; nutzeEintrag(l.lib); l.laengeM = eintrag(l.lib)?.attribute?.led?.laengeM ?? l.laengeM; }
      else { const z = leseZahl(e.target.value); if (Number.isNaN(z)) return toast("Länge: Zahl in Metern.", "fehler"); l.laengeM = z; }
      aenderung();
    }
  });
}

/* ===== 30-signal.js ===== */
/* Reiter Signal: Prozessoren, Datenstränge (Vorschlag + Pinsel), Backup, Ports, Übersicht.
   Port-Regel: ein Port nur Module derselben Serie mit derselben Receiving Card. */

function prozessorLed(g) { return eintrag(g.lib)?.attribute?.led || {}; }
function prozessorPorts(g) {
  const ports = anschluesseAusklappen(eintrag(g.lib)?.attribute?.anschluesse).filter(a => a.rolle === "port");
  return ports.length ? ports.map((a, i) => ({ nr: i + 1, name: a.name })) : [];
}
function modulSchluessel(m) { const led = eintrag(m.lib)?.attribute?.led || {}; return `${led.serie || "?"}|${led.receivingCard || "?"}`; }
function modulPixel(m) { const led = eintrag(m.lib)?.attribute?.led || {}; return (led.pixelB || 0) * (led.pixelH || 0); }
function passtZuModulen(prozLib, module) {
  const rcs = eintrag(prozLib)?.attribute?.led?.receivingCards || [];
  return module.every(m => rcs.includes(eintrag(m.lib)?.attribute?.led?.receivingCard));
}
function strangModule(k) { const s = screenById(k.screen); const map = new Map((s?.module || []).map(m => [m.id, m])); return k.module.map(id => map.get(id)).filter(Boolean); }
function strangPixel(k) { return strangModule(k).reduce((a, m) => a + modulPixel(m), 0); }
function portKapazitaet(g) { return (prozessorLed(g).pxJePort || 0); }
function maxJeStrang(module) {
  const w = module.map(m => eintrag(m.lib)?.attribute?.led?.daten?.maxJeStrang).filter(Number.isFinite);
  return w.length ? Math.min(...w) : Infinity;
}
function straengeVon(screenId) {
  const pIdx = id => P.geraete.findIndex(g => g.id === id);
  return P.straenge.filter(k => k.screen === screenId).sort((a, b) => pIdx(a.prozessor) - pIdx(b.prozessor) || a.port - b.port);
}
function strangName(k) {
  const ps = P.geraete.filter(g => g.art === "prozessor");
  return (ps.length > 1 ? `Pr${ps.findIndex(p => p.id === k.prozessor) + 1}·` : "") + "P" + k.port;
}
function strangFarbe(k) { return wegFarbe(straengeVon(k.screen).indexOf(k)); }
function belegtePorts(gId) { return new Set(P.straenge.filter(k => k.prozessor === gId).flatMap(k => [k.port, k.backupPort].filter(Number.isFinite))); }

/* ---------- Geräte ---------- */
function prozessorAnlegen(libId) {
  nutzeEintrag(libId);
  const n = P.geraete.filter(g => g.art === "prozessor").length + 1;
  const cat = libListe("kabel").find(e => e.attribute.led.farbsystem === "LAN")?.id || null;
  if (cat) nutzeEintrag(cat);
  const g = { id: neueId("p"), art: "prozessor", lib: libId, name: "Prozessor " + n, standort: "FOH / Regie",
    portKabel: cat, portLaengeM: null, strom: null };
  P.geraete.push(g);
  ui.sel.prozessor = g.id;
  aenderung();
  return g;
}

/* ---------- Vorschlag ---------- */
function signalVorschlag() {
  const s = aktuellerScreen();
  if (!s?.module.length) return toast("Der Screen hat keine Module.", "fehler");
  let g = geraetById(ui.sel.prozessor);
  if (!g || g.art !== "prozessor") g = P.geraete.find(x => x.art === "prozessor" && passtZuModulen(x.lib, s.module));
  if (!g) {
    const lib = libListe("prozessor").find(e => eintragNutzbar(e) && passtZuModulen(e.id, s.module));
    if (!lib) return toast("Kein passender Prozessor in der Library (Receiving Card prüfen).", "fehler");
    g = prozessorAnlegen(lib.id);
  }
  if (!passtZuModulen(g.lib, s.module)) return toast(`${g.name} passt nicht zur Receiving Card aller Module.`, "fehler");
  const alt = P.straenge.filter(k => k.screen === s.id && k.prozessor === g.id);
  if (alt.length && !confirm(`Die ${alt.length} vorhandenen Stränge von „${s.name}“ an ${g.name} ersetzen?`)) return;
  P.straenge = P.straenge.filter(k => !(k.screen === s.id && k.prozessor === g.id));
  const kap = portKapazitaet(g) * (P.regeln.portMax / 100);
  if (!kap) return toast(`${g.name}: Pixel je Port fehlen in der Library.`, "fehler");
  // je Serie + Receiving Card eigene Stränge
  const gruppen = new Map();
  for (const m of s.module) gruppen.set(modulSchluessel(m), [...(gruppen.get(modulSchluessel(m)) || []), m]);
  const segmente = [];
  let ueberlast = false;
  for (const [, ms] of gruppen) {
    const reihe = schlangenReihenfolge(ms, s.signal.richtung, s.signal.start);
    const erg = segmentieren(reihe.map(modulPixel), kap, maxJeStrang(reihe));
    ueberlast = ueberlast || erg.ueberlast;
    for (let i = 0; i + 1 < erg.grenzen.length; i++) segmente.push(reihe.slice(erg.grenzen[i], erg.grenzen[i + 1]));
  }
  const belegt = belegtePorts(g.id);
  const frei = prozessorPorts(g).map(p => p.nr).filter(n => !belegt.has(n));
  const backup = P.regeln.backup && prozessorLed(g).backup !== false;
  const noetig = segmente.length * (backup ? 2 : 1);
  if (noetig > frei.length) return toast(`${g.name}: ${noetig} Ports nötig${backup ? " (mit Backup)" : ""}, aber nur ${frei.length} frei.`, "fehler");
  segmente.forEach((seg, i) => {
    P.straenge.push({ id: neueId("d"), screen: s.id, prozessor: g.id, port: frei[i], backupPort: backup ? frei[segmente.length + i] : null, module: seg.map(m => m.id) });
  });
  wegeAbgleichen(g.id);
  ui.sel.prozessor = g.id;
  aenderung();
  toast(`${segmente.length} Datenstränge an ${g.name}${backup ? " + Backup" : ""} vorgeschlagen${ueberlast ? " – Achtung: einzelne Module über der Portgrenze" : ""}.`, ueberlast ? "fehler" : "ok");
}

/* ---------- Pinsel ---------- */
function signalZiele() {
  const ziele = [];
  for (const g of P.geraete.filter(x => x.art === "prozessor")) {
    const backups = new Set(P.straenge.filter(k => k.prozessor === g.id).map(k => k.backupPort));
    for (const p of prozessorPorts(g)) {
      if (backups.has(p.nr)) continue;
      const k = P.straenge.find(x => x.prozessor === g.id && x.port === p.nr);
      ziele.push({ wert: `${g.id}|${p.nr}`, text: `${g.name} · Port ${p.nr}${k ? " · " + (screenById(k.screen)?.name || "") + " " + k.module.length + " Mod." : " · frei"}` });
    }
  }
  return ziele;
}
function signalPinselMalen(svg, s) {
  if (!ui.pinsel.signal) { toast("Zuerst oben einen Port für den Pinsel wählen.", "fehler"); return null; }
  const [gId, portText] = ui.pinsel.signal.split("|"); const port = Number(portText);
  const g = geraetById(gId); if (!g) return null;
  let k = P.straenge.find(x => x.prozessor === gId && x.port === port);
  if (k && k.screen !== s.id) { toast(`Port ${port} versorgt schon „${screenById(k.screen)?.name}“.`, "fehler"); return null; }
  if (!k) {
    let backupPort = null;
    if (P.regeln.backup) { const belegt = belegtePorts(gId); belegt.add(port); backupPort = prozessorPorts(g).map(p => p.nr).reverse().find(n => !belegt.has(n)) ?? null; }
    k = { id: neueId("d"), screen: s.id, prozessor: gId, port, backupPort, module: [] };
    P.straenge.push(k);
  }
  let hinweis = false;
  return id => {
    if (k.module.includes(id)) return;
    const m = s.module.find(x => x.id === id);
    const erstes = strangModule(k)[0];
    if (erstes && modulSchluessel(erstes) !== modulSchluessel(m)) { if (!hinweis) { toast("Anderes Modul (Serie/Receiving Card) – nicht auf denselben Port.", "fehler"); hinweis = true; } return; }
    if (!passtZuModulen(g.lib, [m])) { if (!hinweis) { toast(`${g.name} passt nicht zur Receiving Card dieses Moduls.`, "fehler"); hinweis = true; } return; }
    for (const x of P.straenge) if (x !== k && x.screen === s.id) x.module = x.module.filter(i => i !== id);
    k.module.push(id);
    P.straenge = P.straenge.filter(x => x.module.length || x === k);
    svg.innerHTML = signalSvgInhalt(s);
    const px = strangPixel(k), kap = portKapazitaet(g);
    pinselAnzeige(`${strangName(k)}: ${k.module.length} Module · ${fmt(px)} px von ${fmt(kap)} px (${fmt(px / kap * 100)} %)`, px > kap * P.regeln.portMax / 100 || k.module.length > maxJeStrang(strangModule(k)));
  };
}

/* ---------- Darstellung ---------- */
function signalSvgInhalt(s) {
  const st = straengeVon(s.id);
  const farbe = new Map(); st.forEach((k, i) => k.module.forEach(id => farbe.set(id, wegFarbe(i))));
  return screenSvgInhalt(s, {
    fuellung: m => farbe.has(m.id) ? farbe.get(m.id) + "2e" : "transparent",
    fehlerIds: new Set(s.module.filter(m => !farbe.has(m.id)).map(m => m.id)),
    wege: st.map((k, i) => ({ farbe: wegFarbe(i), module: k.module, start: strangName(k), ende: Number.isFinite(k.backupPort) ? "B" + k.backupPort : null })),
    oben: `${s.name} · Signal · ● Start Hauptweg · ▢ Einspeisung Backup (gleicher Weg)`,
  });
}

      <table><tr><th>Strang</th><th>Prozessor</th><th>Port</th><th>Backup</th><th>Module</th><th class="zahl">Pixel</th><th>Auslastung</th><th>Weg</th></tr>

    if ((e.key === "Delete" || e.key === "Backspace") && ui.sel.strang) { strangLoeschen(ui.sel.strang); return true; }

function wegText(k) {
  const d = portWeg(k.prozessor, k.port);
  const b = Number.isFinite(k.backupPort) ? portWeg(k.prozessor, k.backupPort) : d;
  return d === b ? (d ? d.name : "direkt (Cat)") : `${d?.name || "direkt"} / Backup ${b?.name || "direkt"}`;
}

function strangLoeschen(id) { P.straenge = P.straenge.filter(k => k.id !== id); ui.sel.strang = null; aenderung(); }

  }
