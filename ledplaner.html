    const ports = prozessorPorts(g); const belegt = belegtePorts(g.id);
    const px = P.straenge.filter(x => x.prozessor === g.id).reduce((a, x) => a + strangPixel(x), 0);
    const kabel = libListe("kabel").filter(e => e.attribute.led.gewerk === "signal");
    html += `<div class="karte"><div class="label">${esc(g.name)} · ${esc(eintrag(g.lib)?.name || "")}</div>
      <label class="feld"><span>Name *</span><input data-p-feld="name" value="${esc(g.name)}"></label>
      <label class="feld"><span>Standort</span><input data-p-feld="standort" value="${esc(g.standort || "")}"></label>
      <div class="zwei"><label class="feld"><span>Port-Kabel (direkt)</span><select data-p-feld="portKabel"><option value="">—</option>${kabel.map(e => `<option value="${e.id}"${g.portKabel === e.id ? " selected" : ""}>${esc(e.name)}</option>`).join("")}</select></label>
      <label class="feld"><span>Länge (m)</span><input data-p-feld="portLaengeM" value="${g.portLaengeM ?? ""}" inputmode="decimal"></label></div>
      <label class="feld"><span>Strom für den Prozessor</span>${kanalSelect(g, 'data-p-feld="strom"')}</label>
      <table class="werte"><tr><td>Receiving Cards</td><td>${esc((led.receivingCards || []).join(", "))}</td></tr><tr><td>Belegte Ports</td><td>${belegt.size} / ${ports.length}</td></tr>
      <tr><td>Pixel</td><td>${fmt(px)} / ${fmt(led.pxGesamt)}</td></tr><tr><td>Layer</td><td>${fmt(led.layer)}</td></tr></table>
      <div class="knopfreihe" style="margin-top:8px"><button data-d="geraet-loeschen" class="gefahr">Prozessor löschen</button></div></div>`;
    html += wegeKarte(g);
    const d = geraetById(ui.sel.weg);
    if (istWeg(d) && d.prozessor === g.id) html += wegKarte(d);
  } else if (!k) html += `<div class="karte"><p class="klein leise">Prozessor links anlegen oder im Projektbaum anklicken. Stränge per „Vorschlag erzeugen“ oder mit dem Pinsel anlegen.</p></div>`;
  return html;
}

function signalUebersicht(el) {
  el.classList.add("liste-modus");
  const ps = P.geraete.filter(g => g.art === "prozessor");
  if (!ps.length) return void (el.innerHTML = `<p class="leise">Noch keine Prozessoren.</p>`);
  el.innerHTML = `<div class="uebersicht">${ps.map(g => {
    const led = prozessorLed(g); const ports = prozessorPorts(g);
    const st = P.straenge.filter(k => k.prozessor === g.id);
    const px = st.reduce((a, k) => a + strangPixel(k), 0);
    const eingaenge = anschluesseAusklappen(eintrag(g.lib)?.attribute?.anschluesse).filter(a => a.rolle === "video");
    const portHtml = ports.map(p => {
      const haupt = st.find(k => k.port === p.nr), bk = st.find(k => k.backupPort === p.nr);
      const via = portWeg(g.id, p.nr); const viaText = via ? `<br><span class="leise">über ${esc(wegKurz(via))}</span>` : "";
      if (haupt) return `<div class="port" style="border-color:${strangFarbe(haupt)}"><b>Port ${p.nr}</b><br>Haupt · ${esc(screenById(haupt.screen)?.name || "")}<br>${fmt(strangPixel(haupt) / portKapazitaet(g) * 100)} %${viaText}</div>`;
      if (bk) return `<div class="port" style="border-color:${strangFarbe(bk)};border-style:dashed"><b>Port ${p.nr}</b><br>Backup zu ${p.nr === bk.backupPort ? bk.port : ""}<br>${esc(screenById(bk.screen)?.name || "")}${viaText}</div>`;
      return `<div class="port frei"><b>Port ${p.nr}</b><br>frei</div>`;
    }).join("");
    return `<div class="karte"><div class="knopfreihe"><h2 style="margin:0">${esc(g.name)} · ${esc(eintrag(g.lib)?.name || "")}</h2><span class="fueller"></span>${st.length ? `<span class="badge voll">ok</span>` : `<span class="badge teil">leer</span>`}</div>
      <p class="klein leise">Standort: ${esc(g.standort || "—")} · Receiving Cards: ${esc((led.receivingCards || []).join(", "))}</p>
      <div class="label">Ausgänge (${ports.length} × ${fmt(led.pxJePort)} px)</div><div class="portgitter">${portHtml}</div>
      ${wegGeraete(g.id).length ? `<div class="label">Wege zur Wand</div><table class="werte">${wegGeraete(g.id).map(d => `<tr><td>${esc(wegKurz(d))} · ${esc(d.name)}</td><td>${esc(eintrag(d.lib)?.name || "—")} · Ports ${d.ports.join(", ") || "—"} · ${esc(d.standort || "")}</td></tr>`).join("")}</table>` : ""}
      <div class="label">Eingänge</div><table class="werte">${eingaenge.map(a => { const o = (P.outputs || []).filter(x => x.prozessor === g.id && x.eingang === a.name); return `<tr><td>${esc(a.name)}</td><td>${o.length ? o.map(x => esc(`${x.name} · ${x.b} × ${x.h} @ ${fmtFlex(x.hz)} Hz`)).join(", ") : '<span class="leise">frei</span>'}</td></tr>`; }).join("")}</table>
      <div class="label">Auslastung</div><table class="werte"><tr><td>Pixel</td><td>${fmt(px)} / ${fmt(led.pxGesamt)} (${fmt(led.pxGesamt ? px / led.pxGesamt * 100 : 0)} %)</td></tr>
      <tr><td>Ports</td><td>${belegtePorts(g.id).size} / ${ports.length}</td></tr><tr><td>Layer</td><td>${(P.layer || []).filter(l => l.prozessor === g.id).length} / ${fmt(led.layer)}</td></tr></table></div>`;
  }).join("")}</div>`;
}

function signalListeAlle() {
  const zeilen = [];
  for (const g of P.geraete.filter(x => x.art === "prozessor")) for (const k of P.straenge.filter(x => x.prozessor === g.id).sort((a, b) => a.port - b.port)) {
    const px = strangPixel(k);
    zeilen.push(`<tr><td>${esc(g.name)}</td><td>${k.port}</td><td>Haupt</td><td>${esc(screenById(k.screen)?.name || "—")}</td><td><span class="punkt" style="background:${strangFarbe(k)}"></span>${strangName(k)}</td><td class="zahl">${fmt(px)}</td><td>${balken(px / (portKapazitaet(g) || 1))}</td></tr>`);
    if (Number.isFinite(k.backupPort)) zeilen.push(`<tr><td>${esc(g.name)}</td><td>${k.backupPort}</td><td>Backup zu ${k.port}</td><td>${esc(screenById(k.screen)?.name || "—")}</td><td><span class="punkt" style="background:${strangFarbe(k)}"></span>${strangName(k)} (Ende)</td><td class="zahl">${fmt(px)}</td><td>${balken(px / (portKapazitaet(g) || 1))}</td></tr>`);
  }
  return `<div class="kopf"><b>Alle Ports aller Prozessoren</b></div><table><tr><th>Prozessor</th><th>Port</th><th>Art</th><th>Screen</th><th>Strang</th><th class="zahl">Pixel</th><th>Auslastung</th></tr>
    ${zeilen.join("") || `<tr><td colspan="7" class="leise">Keine Stränge.</td></tr>`}</table>`;
}

function signalPruefungen() {
  const liste = [];
  if (!P.screens.some(s => s.module.length)) return liste;
  const ps = P.geraete.filter(g => g.art === "prozessor");
  if (!ps.length) { liste.push({ art: "warn", text: "Noch kein Prozessor angelegt." }); return liste; }
  for (const s of P.screens) {
    const zu = new Set(P.straenge.filter(k => k.screen === s.id).flatMap(k => k.module));
    const ohne = s.module.filter(m => !zu.has(m.id));
    if (ohne.length) liste.push({ art: "warn", text: `${s.name}: ${ohne.length} Module ohne Datenport.`, ziel: "screen:" + s.id });
  }
  for (const k of P.straenge) {
    const g = geraetById(k.prozessor); const ms = strangModule(k); const s = screenById(k.screen);
    if (!g) continue;
    if (new Set(ms.map(modulSchluessel)).size > 1) liste.push({ art: "fehler", text: `${s?.name} ${strangName(k)}: verschiedene Serien/Receiving Cards an einem Port.`, ziel: "screen:" + k.screen });
    if (!passtZuModulen(g.lib, ms)) liste.push({ art: "fehler", text: `${s?.name} ${strangName(k)}: ${g.name} passt nicht zur Receiving Card.`, ziel: "screen:" + k.screen });
    const px = strangPixel(k), kap = portKapazitaet(g);
    if (px > kap) liste.push({ art: "warn", text: `${s?.name} ${strangName(k)}: ${fmt(px)} px über der Portkapazität ${fmt(kap)} px.`, ziel: "screen:" + k.screen });
    else if (px > kap * P.regeln.portMax / 100) liste.push({ art: "warn", text: `${s?.name} ${strangName(k)}: Auslastung ${fmt(px / kap * 100)} % über ${fmt(P.regeln.portMax)} %.`, ziel: "screen:" + k.screen });
    const mx = maxJeStrang(ms);
    if (ms.length > mx) liste.push({ art: "warn", text: `${s?.name} ${strangName(k)}: ${ms.length} Module, erlaubt ${mx} je Strang.`, ziel: "screen:" + k.screen });
    if (P.regeln.backup && !Number.isFinite(k.backupPort)) liste.push({ art: "warn", text: `${s?.name} ${strangName(k)}: kein Backup-Port.`, ziel: "screen:" + k.screen });
  }
  if (P.straenge.length && P.straenge.some(k => strangModule(k).some(m => !Number.isFinite(eintrag(m.lib)?.attribute?.led?.daten?.maxJeStrang)))) liste.push({ art: "warn", text: "Max. Module je Datenstrang unbekannt – nur Pixelkapazität geprüft." });
  for (const g of ps) {
    const led = prozessorLed(g);
    const px = P.straenge.filter(k => k.prozessor === g.id).reduce((a, k) => a + strangPixel(k), 0);
    if (led.pxGesamt && px > led.pxGesamt) liste.push({ art: "warn", text: `${g.name}: ${fmt(px)} px über der Gesamtkapazität ${fmt(led.pxGesamt)} px.`, ziel: "prozessor:" + g.id });
    if (!P.straenge.some(k => k.prozessor === g.id)) liste.push({ art: "info", text: `${g.name}: keine Ports belegt – wird er gebraucht?`, ziel: "prozessor:" + g.id });
    if (!g.strom) liste.push({ art: "info", text: `${g.name}: Stromversorgung nicht zugeordnet.`, ziel: "prozessor:" + g.id });
    const direkt = genutztePorts(g.id).some(nr => !portWeg(g.id, nr));
    if (direkt && !Number.isFinite(g.portLaengeM)) liste.push({ art: "warn", text: `${g.name}: Länge der Port-Kabel fehlt.`, ziel: "prozessor:" + g.id });
    if (direkt && g.portLaengeM > P.regeln.catMax) liste.push({ art: "warn", text: `${g.name}: Cat-Strecke ${fmtFlex(g.portLaengeM)} m über ${fmt(P.regeln.catMax)} m – Glasfaser/Stagebox nutzen.`, ziel: "prozessor:" + g.id });
  }
  liste.push(...wegePruefungen());
  return liste;
}

function signalEreignisse() {
  $("#werkzeuge").addEventListener("click", e => {
    if (ui.reiter !== "signal") return;
    const b = e.target.closest("[data-d]"); if (!b) return;
    const a = b.dataset.d;
    if (a === "vorschlag") signalVorschlag();
    else if (a === "pinsel") {
      ui.werkzeug = ui.werkzeug === "pinsel" ? "auswahl" : "pinsel";
      if (ui.werkzeug === "pinsel" && !ui.pinsel.signal) { const z = signalZiele().find(z => z.text.endsWith("frei")) || signalZiele()[0]; ui.pinsel.signal = z?.wert || null; }
      render();
    }
    else if (a === "strang-loeschen" && ui.sel.strang) strangLoeschen(ui.sel.strang);
    else if (a === "backup") { P.regeln.backup = !P.regeln.backup; aenderung(); }
    else if (a === "modus") { ui.modus.signal = b.dataset.wert; render(); }
  });
  $("#werkzeuge").addEventListener("change", e => {
    if (ui.reiter !== "signal") return;
    const f = e.target.dataset.dFeld; const s = aktuellerScreen();
    if (f === "richtung" || f === "start") { s.signal[f] = e.target.value; aenderung(); }
    if (f === "pinselziel") { ui.pinsel.signal = e.target.value || null; if (ui.pinsel.signal) ui.werkzeug = "pinsel"; render(); }
  });
  $("#palette").addEventListener("click", e => {
    if (ui.reiter !== "signal") return;
    const b = e.target.closest("[data-d='prozessor-neu']"); if (b && !b.disabled) prozessorAnlegen(b.dataset.lib);
    const w = e.target.closest("[data-d='weg-neu']"); if (w && !w.disabled) wegAnlegen(w.dataset.art, w.dataset.lib, ui.sel.prozessor);
  });
  $("#liste").addEventListener("click", e => {
    if (ui.reiter !== "signal") return;
    const tr = e.target.closest("[data-strang]"); if (!tr) return;
    const k = P.straenge.find(x => x.id === tr.dataset.strang);
    ui.sel.strang = k?.id || null; if (k) ui.sel.prozessor = k.prozessor;
    render();
  });
  $("#rechts").addEventListener("click", e => {
    if (ui.reiter !== "signal") return;
    const ws = e.target.closest("[data-weg-sel]");
    if (ws) { ui.sel.weg = ui.sel.weg === ws.dataset.wegSel ? null : ws.dataset.wegSel; return render(); }
    const wa = e.target.closest("[data-w]")?.dataset.w; const d = geraetById(ui.sel.weg);
    if (wa && istWeg(d)) {
      if (wa === "loeschen") wegLoeschen(d);
      if (wa === "auffuellen") { wegPortsAuffuellen(d); aenderung(); }
      return;
    }
    const a = e.target.closest("[data-d]")?.dataset.d; if (!a) return;
    const k = P.straenge.find(x => x.id === ui.sel.strang);
    if (a === "strang-loeschen" && k) strangLoeschen(k.id);
    if (a === "strang-pinsel" && k) { ui.pinsel.signal = `${k.prozessor}|${k.port}`; ui.werkzeug = "pinsel"; ui.screen = k.screen; render(); }
    if (a === "backup-weg" && k) {
      if (Number.isFinite(k.backupPort)) k.backupPort = null;
      else { const g = geraetById(k.prozessor); const belegt = belegtePorts(g.id); const frei = prozessorPorts(g).map(p => p.nr).reverse().find(n => !belegt.has(n)); if (!frei) return toast("Kein Port frei.", "fehler"); k.backupPort = frei; }
      aenderung();
    }
    if (a === "geraet-loeschen") { const g = geraetById(ui.sel.prozessor); if (g) geraetLoeschen(g); }
  });
  $("#rechts").addEventListener("change", e => {
    if (ui.reiter !== "signal") return;
    const neu = e.target.dataset.wNeu;
    if (neu) { if (e.target.value) wegAnlegen(neu, e.target.value, ui.sel.prozessor); return; }
    const wf = e.target.dataset.wFeld;
    if (wf) { const d = geraetById(ui.sel.weg); if (istWeg(d)) wegAendern(d, wf, e.target.value); return; }
    const g = geraetById(ui.sel.prozessor); const f = e.target.dataset.pFeld;
    if (!g || !f) return;
    let w = e.target.value;
    if (f === "name" && !w.trim()) { toast("Name: darf nicht leer sein.", "fehler"); return render(); }
    if (f === "portLaengeM") { w = leseZahl(w); if (Number.isNaN(w)) return toast("Länge: Zahl in Metern.", "fehler"); }
    if (f === "strom") { w = w ? { verteiler: w.split("|")[0], kanal: Number(w.split("|")[1]) } : null; }
    if (f === "portKabel" && w) nutzeEintrag(w);
    g[f] = w === "" ? null : w;
    aenderung();
  });
}

/* ===== 35-wege.js ===== */
/* Signalwege zur Wand: Stagebox (aktiv, braucht Strom) und Multicore (passiv) als eigene Geräte.
   Jedes Gerät hängt an einem Prozessor und führt bestimmte Prozessor-Ports (Haupt oder Backup).
   Ports, die keinem Gerät zugeordnet sind, gehen direkt per Cat vom Prozessor zur Wand. */

const WEG_ARTEN = { stagebox: "Stagebox", multicore: "Multicore" };
const WEG_MEHRZAHL = { stagebox: "Stageboxen", multicore: "Multicores" };

function istWeg(g) { return !!g && g.art in WEG_ARTEN; }
function wegGeraete(gId) { return P.geraete.filter(d => istWeg(d) && d.prozessor === gId); }
function portWeg(gId, nr) { return wegGeraete(gId).find(d => d.ports.includes(nr)) || null; }
function wegLed(d) { return eintrag(d.lib)?.attribute?.led || {}; }
function wegKapazitaet(d) { const led = wegLed(d); return (d.art === "stagebox" ? led.ports : led.adern) ?? null; }
function wegKurz(d) { return (d.art === "stagebox" ? "SB" : "MC") + (P.geraete.filter(x => x.art === d.art).indexOf(d) + 1); }
/* Ausgang des Wegs, an dem ein Port an der Wand ankommt (1-basiert, Reihenfolge der Zuordnung) */
function wegAusgang(d, nr) { return d.ports.indexOf(nr) + 1; }

/* Belegte Ports eines Prozessors in Port-Reihenfolge */
function genutztePorts(gId) { return [...belegtePorts(gId)].sort((a, b) => a - b); }

function wegAnlegen(art, libId, gId) {
  const g = geraetById(gId);
  if (!g || g.art !== "prozessor") return toast("Zuerst einen Prozessor wählen.", "fehler");
  nutzeEintrag(libId);
  const n = P.geraete.filter(x => x.art === art).length + 1;
  const cat = libListe("kabel").find(e => e.attribute.led.farbsystem === "LAN")?.id || null;
  const fiber = libListe("kabel").find(e => e.attribute.led.farbsystem === "Fiber")?.id || null;
  for (const id of [cat, fiber]) if (id) nutzeEintrag(id);
  const d = { id: neueId(art === "stagebox" ? "sb" : "mc"), art, lib: libId, name: `${WEG_ARTEN[art]} ${n}`, prozessor: gId, ports: [],
    standort: "an der Wand", ausgangKabel: cat, ausgangLaengeM: null };
  if (art === "stagebox") Object.assign(d, { zuleitung: { kabel: fiber, laengeM: g.portLaengeM ?? null, anzahl: 1 }, strom: null });
  P.geraete.push(d);
  wegPortsAuffuellen(d);
  ui.sel.prozessor = gId; ui.sel.weg = d.id;
  aenderung();
  toast(`${d.name} an ${g.name} angelegt${d.ports.length ? ` – Ports ${d.ports.join(", ")}` : ""}.`, "ok");
  return d;
}

/* Freie (belegte, aber noch keinem Weg zugeordnete) Ports bis zur Kapazität übernehmen */
function wegPortsAuffuellen(d) {
  const kap = wegKapazitaet(d) ?? Infinity;
  for (const nr of genutztePorts(d.prozessor)) {
    if (d.ports.length >= kap) break;
    if (!portWeg(d.prozessor, nr)) d.ports.push(nr);
  }
}

/* Nach neuen Strängen: nicht mehr genutzte Ports entfernen, freie Ports auffüllen */
function wegeAbgleichen(gId) {
  const genutzt = belegtePorts(gId);
  const wege = wegGeraete(gId);
  for (const d of wege) d.ports = d.ports.filter(nr => genutzt.has(nr));
  for (const d of wege) wegPortsAuffuellen(d);
}

function wegLoeschen(d) {
  if (!confirm(`„${d.name}“ löschen? Die Ports gehen dann direkt vom Prozessor zur Wand.`)) return;
  P.geraete = P.geraete.filter(x => x !== d);
  ui.sel.weg = null;
  aenderung();
}

/* Freie Kanäle aller Verteiler für ein Gerät (eigener Kanal bleibt wählbar) */
function kanalAuswahl(g) {
  const liste = [];
  for (const v of P.geraete.filter(x => x.art === "verteiler")) {
    const belegt = belegteKanaele(v.id);
    for (const ka of verteilerLed(v).kanaele || []) if (!belegt.has(ka.nr) || (g.strom?.verteiler === v.id && g.strom.kanal === ka.nr)) liste.push([`${v.id}|${ka.nr}`, `${v.name} · Kanal ${ka.nr}`]);
  }
  return liste;
}
function kanalSelect(g, attr) {
  return `<select ${attr}><option value="">— nicht zugeordnet —</option>${kanalAuswahl(g).map(([w, t]) => `<option value="${w}"${g.strom && `${g.strom.verteiler}|${g.strom.kanal}` === w ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
}

/* Port-Liste „1, 2, 5-7“ lesen */
function lesePortListe(text) {
  const erg = [];
  for (const teil of String(text).split(/[,;\s]+/).filter(Boolean)) {
    const m = teil.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) return null;
    const a = Number(m[1]), b = Number(m[2] || m[1]);
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (!erg.includes(i)) erg.push(i);
  }
  return erg;
}

/* ---------- Oberfläche (rechte Spalte im Reiter Signal) ---------- */
function wegeKarte(g) {
  const wege = wegGeraete(g.id);
  const direkt = genutztePorts(g.id).filter(nr => !portWeg(g.id, nr));
  const sb = libListe("stagebox"), mc = libListe("multicore");
  return `<div class="karte"><div class="label">Wege zur Wand · ${esc(g.name)}</div>
    <table class="werte">${wege.map(d => `<tr class="klickbar${ui.sel.weg === d.id ? " sel" : ""}" data-weg-sel="${d.id}"><td>${esc(d.name)}</td><td>${d.ports.length ? "Ports " + d.ports.join(", ") : '<span class="leise">keine Ports</span>'}</td></tr>`).join("")}
    <tr><td>direkt (Cat)</td><td>${direkt.length ? "Ports " + direkt.join(", ") : '<span class="leise">—</span>'}</td></tr></table>
    <div style="display:grid;gap:6px;margin-top:8px"><select data-w-neu="stagebox"><option value="">+ Stagebox …</option>${sb.map(e => `<option value="${e.id}" ${eintragNutzbar(e) ? "" : "disabled"}>${esc(e.name)}${eintragNutzbar(e) ? "" : " (Pflichtfeld fehlt)"}</option>`).join("")}</select>
    <select data-w-neu="multicore"><option value="">+ Multicore …</option>${mc.map(e => `<option value="${e.id}" ${eintragNutzbar(e) ? "" : "disabled"}>${esc(e.name)}${eintragNutzbar(e) ? "" : " (Pflichtfeld fehlt)"}</option>`).join("")}</select></div></div>`;
}

function wegKarte(d) {
  const led = wegLed(d); const kap = wegKapazitaet(d);
  const kabel = art => libListe("kabel").filter(e => e.attribute.led.gewerk === "signal" && (!art || e.attribute.led.farbsystem === art));
  const kabelSel = (feld, wert, liste) => `<select data-w-feld="${feld}"><option value="">—</option>${liste.map(e => `<option value="${e.id}"${wert === e.id ? " selected" : ""}>${esc(e.name)}</option>`).join("")}</select>`;
  let html = `<div class="karte"><div class="label">${esc(d.name)} · ${esc(eintrag(d.lib)?.name || "Library-Eintrag fehlt")}</div>
    <label class="feld"><span>Name *</span><input data-w-feld="name" value="${esc(d.name)}"></label>
    <label class="feld"><span>Standort</span><input data-w-feld="standort" value="${esc(d.standort || "")}"></label>
    <label class="feld"><span>Ports des Prozessors (z.B. 1-4, 6)</span><input data-w-feld="ports" value="${d.ports.join(", ")}"></label>
    <div class="knopfreihe" style="margin:-4px 0 8px"><button data-w="auffuellen" ${kap && d.ports.length >= kap ? "disabled" : ""}>Freie Ports übernehmen</button><span class="klein leise">${d.ports.length} / ${fmt(kap)} ${d.art === "stagebox" ? "Ausgänge" : "Adern"}</span></div>`;
  if (d.art === "stagebox") {
    html += `<div class="abschnitt">Zuleitung vom Prozessor</div>
      <label class="feld"><span>Kabel</span>${kabelSel("zuleitung.kabel", d.zuleitung?.kabel, kabel())}</label>
      <div class="zwei"><label class="feld"><span>Länge (m)</span><input data-w-feld="zuleitung.laengeM" value="${d.zuleitung?.laengeM ?? ""}" inputmode="decimal"></label>
      <label class="feld"><span>Anzahl</span><input data-w-feld="zuleitung.anzahl" value="${d.zuleitung?.anzahl ?? 1}" inputmode="numeric"></label></div>
      <label class="feld"><span>Strom für die Stagebox</span>${kanalSelect(d, 'data-w-feld="strom"')}</label>`;
  } else {
    html += `<table class="werte"><tr><td>Länge Multicore</td><td>${led.laengeM != null ? fmtFlex(led.laengeM) + " m" : "—"}</td></tr><tr><td>Auflösung</td><td>${esc(led.aufloesung || "—")}</td></tr></table>`;
  }
  html += `<div class="abschnitt">${d.art === "stagebox" ? "Ausgänge" : "Auflösung"} → Wand</div>
    <label class="feld"><span>Kabel</span>${kabelSel("ausgangKabel", d.ausgangKabel, kabel("LAN"))}</label>
    <label class="feld"><span>Länge (m)</span><input data-w-feld="ausgangLaengeM" value="${d.ausgangLaengeM ?? ""}" inputmode="decimal"></label>
    <div class="knopfreihe" style="margin-top:8px"><button data-w="loeschen" class="gefahr">${WEG_ARTEN[d.art]} löschen</button></div></div>`;
  return html;
}

function wegAendern(d, feld, w) {
  if (feld === "name") { if (!w.trim()) { toast("Name: darf nicht leer sein.", "fehler"); return render(); } d.name = w; }
  else if (feld === "standort") d.standort = w;
  else if (feld === "ports") {
    const liste = lesePortListe(w);
    const g = geraetById(d.prozessor); const vorhanden = new Set(prozessorPorts(g).map(p => p.nr));
    if (!liste) { toast("Ports: Zahlen mit Komma, Bereiche mit Bindestrich (z.B. 1-4, 6).", "fehler"); return render(); }
    const fremd = liste.find(nr => !vorhanden.has(nr));
    if (fremd != null) { toast(`Port ${fremd} gibt es an ${g.name} nicht.`, "fehler"); return render(); }
    const doppelt = liste.find(nr => { const x = portWeg(d.prozessor, nr); return x && x !== d; });
    if (doppelt != null) { toast(`Port ${doppelt} läuft schon über ${portWeg(d.prozessor, doppelt).name}.`, "fehler"); return render(); }
    d.ports = liste;
  }
  else if (feld === "strom") d.strom = w ? { verteiler: w.split("|")[0], kanal: Number(w.split("|")[1]) } : null;
  else if (feld === "ausgangLaengeM" || feld === "zuleitung.laengeM" || feld === "zuleitung.anzahl") {
    const z = w.trim() === "" ? null : leseZahl(w);
    if (Number.isNaN(z) || (z != null && z < (feld === "zuleitung.anzahl" ? 1 : 0))) { toast(feld === "zuleitung.anzahl" ? "Anzahl: ganze Zahl ab 1." : "Länge: Zahl in Metern.", "fehler"); return render(); }
    setzePfad(d, feld, feld === "zuleitung.anzahl" ? Math.round(z ?? 1) : z);
  }
  else if (feld === "ausgangKabel" || feld === "zuleitung.kabel") { if (w) nutzeEintrag(w); setzePfad(d, feld, w || null); }
  aenderung();
}

/* ---------- Prüfungen ---------- */
function wegePruefungen() {
  const liste = [];
  for (const d of P.geraete.filter(istWeg)) {
    const g = geraetById(d.prozessor); const z = "weg:" + d.id;
    if (!g) { liste.push({ art: "fehler", text: `${d.name}: Prozessor fehlt.`, ziel: z }); continue; }
    const e = eintrag(d.lib);
    if (!e) liste.push({ art: "warn", text: `${d.name}: Library-Eintrag fehlt – Gerät aus der Library wählen.`, ziel: z });
    else if (!eintragNutzbar(e)) liste.push({ art: "warn", text: `${d.name}: Pflichtfelder im Library-Eintrag „${e.name}“ fehlen.`, ziel: "library:" + d.lib });
    const kap = wegKapazitaet(d);
    if (kap != null && d.ports.length > kap) liste.push({ art: "warn", text: `${d.name}: ${d.ports.length} Ports, aber nur ${kap} ${d.art === "stagebox" ? "Ausgänge" : "Adern"}.`, ziel: z });
    const genutzt = belegtePorts(g.id);
    const leer = d.ports.filter(nr => !genutzt.has(nr));
    if (leer.length) liste.push({ art: "info", text: `${d.name}: Port ${leer.join(", ")} ohne Strang.`, ziel: z });
    if (!d.ports.length) liste.push({ art: "info", text: `${d.name}: keine Ports zugeordnet – wird es gebraucht?`, ziel: z });
    for (const nr of d.ports) for (const x of wegGeraete(g.id)) if (x !== d && x.ports.includes(nr) && P.geraete.indexOf(x) > P.geraete.indexOf(d)) liste.push({ art: "fehler", text: `${g.name} · Port ${nr}: in ${d.name} und ${x.name} zugeordnet.`, ziel: z });
    if (d.ports.length && !Number.isFinite(d.ausgangLaengeM)) liste.push({ art: "warn", text: `${d.name}: Kabellänge zur Wand fehlt.`, ziel: z });
    if (d.art === "stagebox") {
      if (!d.strom) liste.push({ art: "warn", text: `${d.name}: Stromversorgung nicht zugeordnet (aktives Gerät).`, ziel: z });
      if (!Number.isFinite(d.zuleitung?.laengeM)) liste.push({ art: "warn", text: `${d.name}: Länge der Zuleitung vom Prozessor fehlt.`, ziel: z });
      const pxMax = wegLed(d).pxJePort;
      for (const k of P.straenge.filter(k => k.prozessor === g.id && d.ports.includes(k.port))) {
        if (pxMax && strangPixel(k) > pxMax) liste.push({ art: "warn", text: `${d.name}: ${strangName(k)} mit ${fmt(strangPixel(k))} px über ${fmt(pxMax)} px je Ausgang.`, ziel: z });
      }
    } else {
      const lang = (wegLed(d).laengeM || 0) + (d.ausgangLaengeM || 0);
      if (lang > P.regeln.catMax) liste.push({ art: "warn", text: `${d.name}: Cat-Strecke ${fmtFlex(lang)} m über ${fmt(P.regeln.catMax)} m.`, ziel: z });
    }
  }
  for (const g of P.geraete.filter(x => x.art === "prozessor")) {
    if (!wegGeraete(g.id).length) continue;
    const direkt = genutztePorts(g.id).filter(nr => !portWeg(g.id, nr));
    if (direkt.length) liste.push({ art: "info", text: `${g.name}: Port ${direkt.join(", ")} direkt per Cat (nicht über Stagebox/Multicore).`, ziel: "prozessor:" + g.id });
  }
  return liste;
}

/* ===== 40-ausgabe.js ===== */
/* Reiter Ausgabe (Phase 1): Testbild je Screen aus der Pixel-Lage der Module, PNG, Live-Ausgabe 1:1.
   Die Zuordnung Zuspieler-Output → Prozessor-Eingang → Layer folgt in Phase 2. */

const TESTBILD_PALETTEN = {
  regenbogen: ["#d94848", "#e8892b", "#d9c32b", "#4fae3f", "#2b9fb3", "#3f62d1", "#8a4fd1", "#c94a9a"],
  pastell: ["#f2a7a7", "#f6c99a", "#efe39a", "#b5dfa4", "#9fd6dd", "#a9b9ef", "#c7aaee", "#eba9cf"],
  grau: ["#3a3a3a", "#6a6a6a", "#9a9a9a", "#cacaca"],
  kontrast: ["#ffffff", "#000000"],
};
function ausgabeOptionen() {
  P.ausgabe = { palette: "regenbogen", beschriftung: "modul", linie: 2, kreis: true, kreuz: true, info: true, cursorTempo: 240, cursorBreite: 4, ...(P.ausgabe || {}) };
  return P.ausgabe;
}
function helligkeitHex(hex) {
  const n = parseInt(hex.slice(1), 16); const k = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
}
function dunkler(hex, f) {
  const n = parseInt(hex.slice(1), 16); const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const c = v => Math.round(helligkeitHex(hex) < 0.18 ? v + (255 - v) * f * 0.6 : v * (1 - f)).toString(16).padStart(2, "0");
  return "#" + c(r) + c(g) + c(b);
}

/* Testbild eines Screens auf eine Canvas zeichnen; liefert die Canvas */
function testbildCanvas(s, canvas = document.createElement("canvas")) {
  const o = ausgabeOptionen();
  const pl = pixelLage(s);
  canvas.width = Math.max(1, pl.b); canvas.height = Math.max(1, pl.h);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const namen = modulNamen(s);
  const xs = [...new Set(s.module.map(m => Math.round(m.x)))].sort((a, b) => a - b);
  const ys = [...new Set(s.module.map(m => Math.round(m.y)))].sort((a, b) => a - b);
  const pal = TESTBILD_PALETTEN[o.palette] || TESTBILD_PALETTEN.regenbogen;
  const typen = [...new Set(s.module.map(m => m.lib))];
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const m of s.module) {
    const r = pl.lage.get(m.id);
    const c = xs.indexOf(Math.round(m.x)), z = ys.indexOf(Math.round(m.y));
    const basis = pal[typen.indexOf(m.lib) % pal.length];
    const farbe = o.palette === "kontrast" ? pal[(c + z) % 2] : (c + z) % 2 ? dunkler(basis, 0.35) : basis;
    ctx.fillStyle = farbe; ctx.fillRect(r.x, r.y, r.b, r.h);
    if (o.linie > 0) {
      ctx.fillStyle = "#fff"; const d = Math.min(o.linie, r.b / 2, r.h / 2);
      ctx.fillRect(r.x, r.y, r.b, d); ctx.fillRect(r.x, r.y + r.h - d, r.b, d); ctx.fillRect(r.x, r.y, d, r.h); ctx.fillRect(r.x + r.b - d, r.y, d, r.h);
    }
    const text = o.beschriftung === "modul" ? namen.get(m.id) : o.beschriftung === "pixel" ? `${r.x},${r.y}` : "";
    if (text) {
      const fs = Math.max(8, Math.min(r.b, r.h) * 0.22);

      ctx.fillStyle = helligkeitHex(farbe) > 0.35 ? "#000" : "#fff";

    const g = grenzen(s.module);

    const fs = Math.max(10, Math.min(48, Math.round(Math.min(W / 16, H / 9))));
    ctx.font = `700 ${fs}px "Segoe UI", system-ui, sans-serif`;
    const bb = Math.max(...zeilen.map(z => ctx.measureText(z).width)) + fs * 1.2, bh = fs * 3.4;

      ctx.fillStyle = "#fff";
      zeilen.forEach((z, i) => { ctx.font = `${i ? 500 : 700} ${i ? Math.round(fs * 0.7) : fs}px "Segoe UI", system-ui, sans-serif`; ctx.fillText(z, W / 2, H / 2 - bh / 2 + fs * (0.85 + i * 0.95)); });
    }
  }
  return canvas;
}

/* ===== 45-mapping.js ===== */
/* Ausgabe-Mapping: Zuspieler-Outputs → Prozessor-Eingänge → Layer (Ausschnitt → Fläche im Pixelraum).
   P.outputs  = [{ id, name, zuspieler, b, h, hz, anschluss, prozessor, eingang }]
   P.pixelraum = { [prozessorId]: { [screenId]: { x, y } } }
   P.layer    = [{ id, prozessor, output, ax, ay, b, h, zx, zy, zb, zh, modus: "1:1" | "skaliert" }] */

const ANSCHLUESSE = ["HDMI", "DP", "SDI", "DVI"];

function mappingDaten() {
  P.outputs = P.outputs || []; P.pixelraum = P.pixelraum || {}; P.layer = P.layer || [];
}
function prozessorScreens(gId) {
  const ids = [...new Set(P.straenge.filter(k => k.prozessor === gId).map(k => k.screen))];
  return P.screens.filter(s => ids.includes(s.id));
}
function prozessorEingaenge(g) { return anschluesseAusklappen(eintrag(g.lib)?.attribute?.anschluesse).filter(a => a.rolle === "video"); }
/* Lage der Screens im Pixelraum; fehlende werden rechts angefügt */
function pixelraum(gId) {
  mappingDaten();
  const raum = P.pixelraum[gId] = P.pixelraum[gId] || {};
  let x = Math.max(0, ...Object.entries(raum).filter(([id]) => screenById(id)).map(([id, p]) => p.x + pixelLage(screenById(id)).b));
  for (const s of prozessorScreens(gId)) if (!raum[s.id]) { raum[s.id] = { x, y: 0 }; x += pixelLage(s).b; }
  for (const id of Object.keys(raum)) if (!prozessorScreens(gId).some(s => s.id === id)) delete raum[id];
  return raum;
}
function pixelraumBloecke(gId) {
  const raum = pixelraum(gId);
  return prozessorScreens(gId).map(s => { const pl = pixelLage(s); return { s, x: raum[s.id].x, y: raum[s.id].y, b: pl.b, h: pl.h }; });
}
function pixelraumGrenzen(gId) {
  const bl = pixelraumBloecke(gId);
  if (!bl.length) return { x: 0, y: 0, b: 0, h: 0 };
  const x0 = Math.min(...bl.map(b => b.x)), y0 = Math.min(...bl.map(b => b.y));
  return { x: x0, y: y0, b: Math.max(...bl.map(b => b.x + b.b)) - x0, h: Math.max(...bl.map(b => b.y + b.h)) - y0 };
}
const outputById = id => (P.outputs || []).find(o => o.id === id) || null;

async function outputBearbeiten(o) {
  const neu = !o;
  o = o || { id: neueId("o"), name: "Medienserver 1 · Out " + ((P.outputs || []).length + 1), zuspieler: "Medienserver 1", b: 3840, h: 2160, hz: 50, anschluss: "HDMI", prozessor: null, eingang: null };
  const ps = P.geraete.filter(g => g.art === "prozessor");
  const eing = [["", "— nicht verbunden —"]];
  for (const g of ps) for (const e of prozessorEingaenge(g)) eing.push([`${g.id}|${e.name}`, `${g.name} · ${e.name}`]);
  const erg = await formularDialog(neu ? "Output anlegen" : "Output bearbeiten", [
    { name: "name", label: "Name *", wert: o.name },
    { name: "zuspieler", label: "Zuspieler", wert: o.zuspieler },
    { name: "b", label: "Breite (px)", art: "zahl", wert: o.b }, { name: "h", label: "Höhe (px)", art: "zahl", wert: o.h },
    { name: "hz", label: "Bildrate (Hz)", art: "zahl", wert: o.hz },
    { name: "anschluss", label: "Anschluss", art: "auswahl", wert: o.anschluss, optionen: ANSCHLUESSE.map(a => [a, a]) },
    { name: "eingang", label: "Verbunden mit", art: "auswahl", wert: o.prozessor ? `${o.prozessor}|${o.eingang}` : "", optionen: eing },
  ], neu ? "Anlegen" : "Übernehmen");
  if (!erg) return;
  if (!erg.name.trim() || !(erg.b > 0 && erg.h > 0 && erg.hz > 0)) return toast("Name, Breite, Höhe und Bildrate angeben.", "fehler");
  const [prozessor, eingang] = erg.eingang ? [erg.eingang.split("|")[0], erg.eingang.slice(erg.eingang.indexOf("|") + 1)] : [null, null];
  Object.assign(o, { name: erg.name.trim(), zuspieler: erg.zuspieler, b: Math.round(erg.b), h: Math.round(erg.h), hz: erg.hz, anschluss: erg.anschluss, prozessor, eingang });
  mappingDaten();
  if (neu) P.outputs.push(o);
  ui.sel.output = o.id;
  aenderung();
}

/* Layer automatisch: passt der ganze Pixelraum in den Output → ein Layer, sonst ein Layer je Screen */
function layerVorschlag(gId) {
  mappingDaten();
  const o = P.outputs.find(x => x.prozessor === gId);
  if (!o) return toast("Zuerst einen Output mit diesem Prozessor verbinden.", "fehler");
  const bl = pixelraumBloecke(gId);
  if (!bl.length) return toast("Der Prozessor versorgt noch keinen Screen (Reiter Signal).", "fehler");
  P.layer = P.layer.filter(l => l.prozessor !== gId);
  const g = pixelraumGrenzen(gId);
  if (g.b <= o.b && g.h <= o.h) {
    P.layer.push({ id: neueId("y"), prozessor: gId, output: o.id, ax: 0, ay: 0, b: g.b, h: g.h, zx: g.x, zy: g.y, zb: g.b, zh: g.h, modus: "1:1" });
  } else {
    let x = 0, y = 0, zeile = 0;
    for (const b of bl) {
      if (x + b.b > o.b) { x = 0; y += zeile; zeile = 0; }
      P.layer.push({ id: neueId("y"), prozessor: gId, output: o.id, ax: x, ay: y, b: b.b, h: b.h, zx: b.x, zy: b.y, zb: b.b, zh: b.h, modus: "1:1" });
      x += b.b; zeile = Math.max(zeile, b.h);
    }
  }
  aenderung();
  toast(`${P.layer.filter(l => l.prozessor === gId).length} Layer angelegt.`, "ok");
}

/* Testbild eines Prozessor-Pixelraums und eines Outputs */
function pixelraumCanvas(gId) {
  const g = pixelraumGrenzen(gId);
  const c = document.createElement("canvas");
  c.width = Math.max(1, g.x + g.b); c.height = Math.max(1, g.y + g.h);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  for (const b of pixelraumBloecke(gId)) ctx.drawImage(testbildCanvas(b.s), b.x, b.y);
  return c;
}
function outputCanvas(o) {
  const c = document.createElement("canvas");
  c.width = o.b; c.height = o.h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, c.width, c.height);
  const raeume = new Map();
  for (const l of (P.layer || []).filter(l => l.output === o.id)) {
    if (!raeume.has(l.prozessor)) raeume.set(l.prozessor, pixelraumCanvas(l.prozessor));
    ctx.imageSmoothingEnabled = l.modus !== "1:1";
    ctx.drawImage(raeume.get(l.prozessor), l.zx, l.zy, l.zb, l.zh, l.ax, l.ay, l.b, l.h);
  }
  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.font = `600 ${Math.max(14, o.h / 40)}px "Segoe UI", sans-serif`;
  ctx.textBaseline = "bottom"; ctx.fillText(`${o.name} · ${o.b} × ${o.h} @ ${o.hz} Hz`, 12, o.h - 10);
  return c;
}

/* ---------- Darstellung (Modus „Mapping“ im Reiter Ausgabe) ---------- */
function mappingProzessor() {
  const ps = P.geraete.filter(g => g.art === "prozessor");
  let g = geraetById(ui.sel.prozessor);
  if (!g || g.art !== "prozessor") g = ps[0] || null;
  return g;
}
function mappingSvg(g) {
  const o = outputById(ui.sel.output) && outputById(ui.sel.output).prozessor === g.id ? outputById(ui.sel.output) : (P.outputs || []).find(x => x.prozessor === g.id);
  const raum = pixelraumGrenzen(g.id);
  const rb = Math.max(raum.x + raum.b, 1920), rh = Math.max(raum.y + raum.h, 1080);
  const ob = o ? o.b : 1920, oh = o ? o.h : 1080;
  const abstand = Math.max(ob, rb) * 0.25;
  const vbB = ob + abstand + rb, vbH = Math.max(oh, rh);
  const fs = vbB / 70, st = vbB / 900;
  const layer = (P.layer || []).filter(l => l.prozessor === g.id);
  let t = `<svg viewBox="${-st * 20} ${-fs * 3} ${vbB + st * 40} ${vbH + fs * 5}" preserveAspectRatio="xMidYMid meet">`;
  t += `<text x="0" y="${-fs}" font-size="${fs}" fill="#9a9a9a">${o ? esc(`${o.name} · ${o.b} × ${o.h} @ ${o.hz} Hz · ${o.anschluss}`) : "Kein Output verbunden"}</text>`;
  t += `<rect x="0" y="0" width="${ob}" height="${oh}" fill="#1c1c1c" stroke="${kabelFarbe(o?.anschluss === "SDI" ? "SDI" : o?.anschluss === "DP" ? "DisplayPort" : "HDMI")}" stroke-width="${st * 3}"/>`;
  const x0 = ob + abstand;
  t += `<text x="${x0}" y="${-fs}" font-size="${fs}" fill="#9a9a9a">Pixelraum ${esc(g.name)} · Screens ziehen zum Anordnen</text>`;
  t += `<rect x="${x0}" y="0" width="${rb}" height="${rh}" fill="#141414" stroke="#9a9a9a" stroke-width="${st * 2}"/>`;
  for (const b of pixelraumBloecke(g.id)) {
    t += `<g class="raum-block" data-raum="${b.s.id}" style="cursor:move"><rect x="${x0 + b.x}" y="${b.y}" width="${b.b}" height="${b.h}" fill="rgba(77,163,255,.16)" stroke="#e8e8e8" stroke-width="${st * 2}"/>
      <text x="${x0 + b.x + b.b / 2}" y="${b.y + b.h / 2}" font-size="${fs}" fill="#e8e8e8" text-anchor="middle" pointer-events="none">${esc(b.s.name)} · ${b.b} × ${b.h}</text></g>`;
  }
  layer.forEach((l, i) => {
    const f = wegFarbe(i);
    const zeigen = l.output === o?.id;
    if (zeigen) t += `<rect x="${l.ax}" y="${l.ay}" width="${l.b}" height="${l.h}" fill="${f}33" stroke="${f}" stroke-width="${st * 3}"/><text x="${l.ax + fs * 0.5}" y="${l.ay + fs * 1.3}" font-size="${fs}" fill="${f}">Layer ${i + 1}</text>`;
    t += `<rect x="${x0 + l.zx}" y="${l.zy}" width="${l.zb}" height="${l.zh}" fill="none" stroke="${f}" stroke-width="${st * 3}" stroke-dasharray="${st * 12} ${st * 8}" pointer-events="none"/>`;
    if (zeigen) t += `<line x1="${l.ax + l.b}" y1="${l.ay + l.h / 2}" x2="${x0 + l.zx}" y2="${l.zy + l.zh / 2}" stroke="${f}" stroke-width="${st * 2}" pointer-events="none"/>`;
  });
  return t + "</svg>";
}

function mappingZeichnung(el) {
  const g = mappingProzessor();
  if (!g) return leerZeichnung(el, "Noch kein Prozessor – im Reiter Signal anlegen.");
  el.innerHTML = mappingSvg(g);
  const svg = el.querySelector("svg");
  let zug = null;
  svg.addEventListener("pointerdown", e => {
    const b = e.target.closest("[data-raum]"); if (!b) return;
    const raum = pixelraum(g.id);
    zug = { id: b.dataset.raum, start: svgPunkt(svg, e), x: raum[b.dataset.raum].x, y: raum[b.dataset.raum].y, el: b };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!zug) return;
    const p = svgPunkt(svg, e);
    let x = Math.max(0, Math.round(zug.x + p.x - zug.start.x)), y = Math.max(0, Math.round(zug.y + p.y - zug.start.y));
    const andere = pixelraumBloecke(g.id).filter(b => b.s.id !== zug.id);
    const pl = pixelLage(screenById(zug.id));
    ({ x, y } = einrasten({ x, y, b: pl.b, h: pl.h }, [...andere, { x: 0, y: 0, b: 0, h: 0 }], 12 * mmJePixel(svg)));
    zug.neu = { x: Math.max(0, x), y: Math.max(0, y) };
    zug.el.setAttribute("transform", `translate(${zug.neu.x - zug.x} ${zug.neu.y - zug.y})`);
  });
  svg.addEventListener("pointerup", () => {
    if (!zug) return;
    const z = zug; zug = null;
    if (!z.neu) return;
    // Layer, deren Zielfläche genau auf dem Screen lag, wandern mit
    const pl = pixelLage(screenById(z.id));
    for (const l of P.layer.filter(l => l.prozessor === g.id && l.zx === z.x && l.zy === z.y && l.zb === pl.b && l.zh === pl.h)) { l.zx = z.neu.x; l.zy = z.neu.y; }
    pixelraum(g.id)[z.id] = z.neu; aenderung();
  });
}

      <td><select data-l-feld="modus"><option value="1:1"${l.modus === "1:1" ? " selected" : ""}>1:1</option><option value="skaliert"${l.modus === "skaliert" ? " selected" : ""}>skaliert</option></select></td>

function mappingRechts() {

      <div class="knopfreihe" style="margin-top:8px"><button data-m="output-bearbeiten">Bearbeiten</button><button data-m="output-png">PNG</button><button data-m="output-live">▶ Live</button><button data-m="output-weg" class="gefahr">Löschen</button></div></div>` : "")

function mappingPruefungen() {
  mappingDaten();
  const liste = [];
  for (const o of P.outputs) {
    if (!o.prozessor) { liste.push({ art: "warn", text: `${o.name}: mit keinem Prozessor-Eingang verbunden.` }); continue; }
    const g = geraetById(o.prozessor); if (!g) continue;
    const e = prozessorEingaenge(g).find(x => x.name === o.eingang);
    if (!e) { liste.push({ art: "fehler", text: `${o.name}: Eingang „${o.eingang}“ gibt es an ${g.name} nicht.` }); continue; }
    if ((e.maxB && o.b > e.maxB) || (e.maxH && o.h > e.maxH)) liste.push({ art: "warn", text: `${o.name}: ${o.b} × ${o.h} größer als ${g.name} · ${e.name} (max. ${e.maxB} × ${e.maxH}).` });
    if (e.maxHz && o.hz > e.maxHz) liste.push({ art: "warn", text: `${o.name}: ${fmtFlex(o.hz)} Hz über ${fmtFlex(e.maxHz)} Hz des Eingangs.` });
    if (e.typ && o.anschluss && e.typ !== o.anschluss) liste.push({ art: "warn", text: `${o.name}: ${o.anschluss} an ${e.typ}-Eingang – Konverter nötig.` });
    if (P.outputs.filter(x => x.prozessor === o.prozessor && x.eingang === o.eingang).length > 1) liste.push({ art: "fehler", text: `${g.name} · ${o.eingang}: mehrere Outputs am selben Eingang.` });
  }
  for (const g of P.geraete.filter(x => x.art === "prozessor")) {
    const outs = P.outputs.filter(o => o.prozessor === g.id);
    if (new Set(outs.map(o => o.hz)).size > 1) liste.push({ art: "info", text: `${g.name}: Outputs mit unterschiedlichen Bildraten (${[...new Set(outs.map(o => fmtFlex(o.hz)))].join(" / ")} Hz).` });
    const layer = P.layer.filter(l => l.prozessor === g.id);
    const max = prozessorLed(g).layer;
    if (max && layer.length > max) liste.push({ art: "warn", text: `${g.name}: ${layer.length} Layer, möglich ${max}.`, ziel: "prozessor:" + g.id });
    for (const l of layer) {
      const o = outputById(l.output);
      if (o && (l.ax < 0 || l.ay < 0 || l.ax + l.b > o.b || l.ay + l.h > o.h)) liste.push({ art: "warn", text: `${g.name}: Layer-Ausschnitt liegt außerhalb von ${o.name}.` });
      if (l.modus === "1:1" && (l.b !== l.zb || l.h !== l.zh)) liste.push({ art: "warn", text: `${g.name}: Layer 1:1, aber Ausschnitt ${l.b} × ${l.h} ≠ Fläche ${l.zb} × ${l.zh}.` });
    }
    const bl = pixelraumBloecke(g.id);
    for (const b of bl) {
      const r = { x: b.x, y: b.y, b: b.b, h: b.h };
      if (P.outputs.some(o => o.prozessor === g.id)) {
        // Abdeckung: Schnittflächen aller Layer (Überlappung der Layer selbst wird vernachlässigt)
        const flaeche = layer.reduce((a, l) => a + Math.max(0, Math.min(r.x + r.b, l.zx + l.zb) - Math.max(r.x, l.zx)) * Math.max(0, Math.min(r.y + r.h, l.zy + l.zh) - Math.max(r.y, l.zy)), 0);
        if (!flaeche) liste.push({ art: "warn", text: `${b.s.name}: an ${g.name} ohne Bild (kein Layer).`, ziel: "screen:" + b.s.id });
        else if (flaeche < r.b * r.h) liste.push({ art: "warn", text: `${b.s.name}: nur ${fmt(flaeche / (r.b * r.h) * 100)} % von Layern abgedeckt.`, ziel: "screen:" + b.s.id });
      }
      if (bl.some(x => x !== b && schneidet(r, { x: x.x, y: x.y, b: x.b, h: x.h }))) liste.push({ art: "warn", text: `${g.name}: „${b.s.name}“ überlappt im Pixelraum.`, ziel: "prozessor:" + g.id });
    }
    if (bl.length && !outs.length) liste.push({ art: "info", text: `${g.name}: noch kein Output verbunden.`, ziel: "prozessor:" + g.id });
  }
  return liste;
}

function mappingEreignisse() {
  $("#palette").addEventListener("click", e => {

      if (!o) return toast("Zuerst einen Output mit diesem Prozessor verbinden.", "fehler");
      mappingDaten(); P.layer.push({ id: neueId("y"), prozessor: g.id, output: o.id, ax: 0, ay: 0, b: 1920, h: 1080, zx: 0, zy: 0, zb: 1920, zh: 1080, modus: "1:1" }); aenderung();

  });
  $("#liste").addEventListener("change", e => {
    if (ui.reiter !== "ausgabe") return;

    const l = P.layer.find(x => x.id === tr.dataset.layer); if (!l) return;
    if (f === "output" || f === "modus") l[f] = e.target.value;
    else { const z = leseZahl(e.target.value); if (!Number.isFinite(z)) return toast("Bitte eine ganze Zahl (px).", "fehler"); l[f] = Math.round(z); }
    if (l.modus === "1:1") { l.zb = l.b; l.zh = l.h; }
    aenderung();
  });
  $("#liste").addEventListener("click", e => {

    if (a === "output-bearbeiten") outputBearbeiten(o);
    if (a === "output-weg") { if (!confirm(`Output „${o.name}“ löschen?`)) return; P.outputs = P.outputs.filter(x => x !== o); P.layer = P.layer.filter(l => l.output !== o.id); ui.sel.output = null; aenderung(); }
    if (a === "output-png") outputCanvas(o).toBlob(b => herunterladen(b, dateiname(`${P.daten.titel}_${o.name}_testbild`, ".png"), "image/png"));
    if (a === "output-live") liveCanvasOeffnen(o.name, outputCanvas(o));
  });
}

/* ===== 50-kabel.js ===== */
/* Reiter Kabel: alle Verbindungen des Projekts (automatisch aus Strom/Signal + von Hand),
   Typ und Länge bearbeitbar, Packliste nach Typ und Länge, CSV. */

const GEWERK_KUERZEL = { strom: "S", signal: "D", video: "V" };
const GEWERK_NAME = { strom: "Strom", signal: "Signal", video: "Video" };

function kabelLibPassend(gewerk, stecker) {
  const k = libListe("kabel").filter(e => e.attribute.led.gewerk === gewerk);
  return (stecker && k.find(e => e.attribute.led.steckerA === stecker)) || null;
}
function modulAnschluss(m, rolle) {
  return (eintrag(m.lib)?.attribute?.anschluesse || []).find(a => a.rolle === rolle && a.richtung === "in")?.typ || null;
}
function libName(id) { return eintrag(id)?.name || "—"; }
function libFarbe(id) {
  const led = eintrag(id)?.attribute?.led || {};
  if (led.typ === "laka" || led.typ === "spinne") return kabelFarbe(/socapex/i.test(led.stecker || led.steckerEin || "") ? "Socapex" : "Multicore (Harting)");
  if (led.typ === "multicore") return kabelFarbe("LAN");
  return kabelFarbe(led.farbsystem);
}

/* Alle Kabel des Projekts als Zeilen */
function kabelListe() {
  const zeilen = [];
  const add = z => {
    const anp = P.kabelAnpassung[z.key] || {};
    zeilen.push({ herkunft: "automatisch", bemerkung: "", anzahl: 1, ...z, ...(anp.lib !== undefined ? { lib: anp.lib } : {}),
      ...(anp.laengeM !== undefined ? { laengeM: anp.laengeM } : {}), ...(anp.bemerkung !== undefined ? { bemerkung: anp.bemerkung } : {}) });
  };
  // Strom: Einspeisungen der Verteiler
  for (const v of P.geraete.filter(g => g.art === "verteiler")) {
    add({ key: "speisung:" + v.id, gewerk: "strom", lib: v.speisung?.kabel || null, laengeM: v.speisung?.laengeM ?? null, quelleBearbeiten: true,
      von: geraetById(v.speisung?.von)?.name || "— Einspeisung nicht festgelegt", nach: `${v.name} · Einspeisung`, screen: null });
  }
  // Strom: Lakas und Spinnen
  for (const l of P.lakas) {
    const v = geraetById(l.verteiler); const s = screenById(l.screen);
    add({ key: "laka:" + l.id, gewerk: "strom", lib: l.lib, laengeM: l.laengeM, quelleBearbeiten: true, von: `${v?.name || "—"} · ${l.ausgang}`, nach: `Spinne · ${s?.name || "—"}`, screen: l.screen });
    const stecker = eintrag(l.lib)?.attribute?.led?.stecker;
    const spinne = libListe("spinne").find(e => e.attribute.led.steckerEin === stecker);
    add({ key: "spinne:" + l.id, gewerk: "strom", lib: spinne?.id || null, laengeM: spinne?.attribute?.led?.laengeM ?? null, von: `Laka · ${l.ausgang}`, nach: `${s?.name || "—"} · Kreisanfänge`, screen: l.screen });
  }
  // Strom: Kreise ohne Laka (direkt), Brücken je Screen
  for (const s of P.screens) {
    const namen = modulNamen(s);
    const kreise = P.kreise.filter(k => k.screen === s.id);
    for (const k of kreise) {
      if (lakaFuerKreis(k)) continue;
      const m = kreisModule(k)[0]; const v = geraetById(k.verteiler);
      add({ key: "kreis:" + k.id, gewerk: "strom", lib: kabelLibPassend("strom", m && modulAnschluss(m, "strom"))?.id || null, laengeM: null,
        von: `${v?.name || "—"} · Kanal ${k.kanal}`, nach: `${s.name} · ${namen.get(m?.id) || "—"} (${kreisName(k)})`, screen: s.id });
    }
    const brStrom = kreise.reduce((a, k) => a + Math.max(0, k.module.length - 1), 0);
    if (brStrom) {
      const m = s.module[0]; const lib = kabelLibPassend("strom", modulAnschluss(m, "strom"));
      add({ key: "bruecke-strom:" + s.id, gewerk: "strom", lib: lib?.id || null, laengeM: lib?.attribute?.led?.brueckeLaengeM ?? null, anzahl: brStrom, bruecke: true,
        von: "Modul", nach: `Modul · ${s.name} (Brücken ${kreise.map(kreisName).join(", ")})`, screen: s.id });
    }
    // Signal
    const st = P.straenge.filter(k => k.screen === s.id);
    for (const k of st) {
      const g = geraetById(k.prozessor); if (!g) continue;
      const ms = strangModule(k);
      // je Port: direkt vom Prozessor oder vom Ausgang der Stagebox / Auflösung des Multicores
      const quelle = nr => {
        const d = portWeg(g.id, nr);
        if (!d) return { lib: g.portKabel, laengeM: g.portLaengeM ?? null, von: `${g.name} · Port ${nr}` };
        return { lib: d.ausgangKabel, laengeM: d.ausgangLaengeM ?? null, von: `${d.name} · ${d.art === "stagebox" ? "Ausgang" : "Ader"} ${wegAusgang(d, nr)} (Port ${nr})` };
      };
      add({ key: "port:" + k.id, gewerk: "signal", ...quelle(k.port), nach: `${s.name} · ${namen.get(ms[0]?.id) || "—"} (Daten ein)`, screen: s.id });
      if (Number.isFinite(k.backupPort)) { const q = quelle(k.backupPort); add({ key: "backup:" + k.id, gewerk: "signal", ...q, von: q.von + " Backup", nach: `${s.name} · ${namen.get(ms[ms.length - 1]?.id) || "—"} (Strangende)`, screen: s.id }); }
    }
    const brDaten = st.reduce((a, k) => a + Math.max(0, k.module.length - 1), 0);
    if (brDaten) {
      const lib = kabelLibPassend("signal", modulAnschluss(s.module[0], "daten"));
      add({ key: "bruecke-daten:" + s.id, gewerk: "signal", lib: lib?.id || null, laengeM: lib?.attribute?.led?.brueckeLaengeM ?? null, anzahl: brDaten, bruecke: true,
        von: "Modul", nach: `Modul · ${s.name} (Brücken ${st.map(strangName).join(", ")})`, screen: s.id });
    }
  }
  // Signal: Prozessor → Stagebox (Zuleitung) bzw. Multicore
  for (const d of P.geraete.filter(istWeg)) {
    const g = geraetById(d.prozessor); if (!g || !d.ports.length) continue;
    if (d.art === "stagebox") add({ key: "weg:" + d.id, gewerk: "signal", lib: d.zuleitung?.kabel || null, laengeM: d.zuleitung?.laengeM ?? null, anzahl: d.zuleitung?.anzahl || 1,
      von: `${g.name} · Glasfaser`, nach: `${d.name} (${d.standort || "—"})`, screen: null });
    else add({ key: "weg:" + d.id, gewerk: "signal", lib: d.lib, laengeM: wegLed(d).laengeM ?? null,
      von: `${g.name} · Port ${d.ports.join(", ")}`, nach: `${d.name} · Auflösung (${d.standort || "—"})`, screen: null });
  }
  // Video: Outputs → Prozessor-Eingänge
  for (const o of P.outputs || []) {
    if (!o.prozessor) continue;
    const typ = { HDMI: "HDMI", SDI: "BNC", DP: "DisplayPort", DVI: "DVI" }[o.anschluss];
    const lib = libListe("kabel").find(e => e.attribute.led.gewerk === "video" && e.attribute.led.steckerA === typ);
    add({ key: "video:" + o.id, gewerk: "video", lib: lib?.id || null, laengeM: null, von: `${o.zuspieler || "Zuspieler"} · ${o.name}`, nach: `${geraetById(o.prozessor)?.name || "—"} · ${o.eingang}`, screen: null });
  }
  // Strom für Geräte
  for (const g of P.geraete.filter(x => x.strom?.verteiler)) {
    const v = geraetById(g.strom.verteiler);
    add({ key: "geraetstrom:" + g.id, gewerk: "strom", lib: libListe("kabel").find(e => /kaltger/i.test(e.name))?.id || null, laengeM: null,
      von: `${v?.name || "—"} · Kanal ${g.strom.kanal}`, nach: g.name, screen: null });
  }
  // Von Hand
  for (const k of P.kabel) zeilen.push({ key: "hand:" + k.id, herkunft: "von Hand", gewerk: k.gewerk || libGewerk(k.lib) || "strom", lib: k.lib, laengeM: k.laengeM, anzahl: k.anzahl || 1, von: k.von, nach: k.nach, bemerkung: k.bemerkung || "", screen: null, hand: true });
  // Nach Gewerk ordnen (Strom, Signal, Video) und je Gewerk nummerieren
  const ordnung = { strom: 0, signal: 1, video: 2 };
  zeilen.sort((a, b) => ordnung[a.gewerk] - ordnung[b.gewerk]);
  const zaehler = {};
  for (const z of zeilen) { zaehler[z.gewerk] = (zaehler[z.gewerk] || 0) + 1; z.nr = GEWERK_KUERZEL[z.gewerk] + zaehler[z.gewerk]; }
  return zeilen;
}
function libGewerk(id) { const led = eintrag(id)?.attribute?.led; return led?.typ === "kabel" ? led.gewerk : led?.typ === "laka" || led?.typ === "spinne" ? "strom" : null; }

/* Typ/Länge eines Kabels ändern: bei Einspeisung und Laka an der Quelle, sonst als Anpassung */
function kabelSetzen(key, feld, wert) {
  const [art, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
  if (wert && feld === "lib") nutzeEintrag(wert);
  if (art === "hand") { const k = P.kabel.find(x => x.id === id); if (k) k[feld] = wert; return; }
  if (art === "speisung") { const v = geraetById(id); if (v && feld !== "bemerkung") { v.speisung = v.speisung || {}; v.speisung[feld === "lib" ? "kabel" : "laengeM"] = wert; return; } }
  if (art === "laka" && feld !== "bemerkung") { const l = P.lakas.find(x => x.id === id); if (l) { l[feld] = wert; return; } }
  P.kabelAnpassung[key] = { ...(P.kabelAnpassung[key] || {}), [feld]: wert };
}

function packliste(zeilen) {
  const gruppen = new Map();
  for (const z of zeilen) {
    const k = `${z.lib || "?"}|${z.laengeM ?? "?"}`;
    const g = gruppen.get(k) || { lib: z.lib, laengeM: z.laengeM, anzahl: 0, gewerk: z.gewerk, bruecke: false };
    g.anzahl += z.anzahl || 1; g.bruecke = g.bruecke || !!z.bruecke;
    gruppen.set(k, g);
  }
  return [...gruppen.values()].sort((a, b) => a.gewerk.localeCompare(b.gewerk) || libName(a.lib).localeCompare(libName(b.lib)) || (a.laengeM ?? 0) - (b.laengeM ?? 0));
}

function kabelGefiltert() {
  const f = ui.kabelFilter;
  return kabelListe().filter(z => (f.gewerk === "alle" || z.gewerk === f.gewerk) && (f.screen === "alle" || z.screen === f.screen) && (!f.ohneLaenge || z.laengeM == null));
}

function kabelEreignisse() {
  $("#werkzeuge").addEventListener("click", async e => {
    if (ui.reiter !== "kabel") return;
    const b = e.target.closest("[data-k]"); if (!b) return;
    const a = b.dataset.k;
    if (a === "gewerk") { ui.kabelFilter.gewerk = b.dataset.wert; render(); }
    if (a === "neu") kabelVonHand();
    if (a === "csv") {
      const z = kabelListe();
      herunterladen(csvText(["Nr.", "Gewerk", "Kabeltyp", "Länge (m)", "Anzahl", "Von", "Nach", "Herkunft", "Bemerkung"],
        z.map(x => [x.nr, GEWERK_NAME[x.gewerk], libName(x.lib), x.laengeM ?? "", x.anzahl, x.von, x.nach, x.herkunft + (x.bruecke ? " (Brücke)" : ""), x.bemerkung])),
        dateiname(P.daten.titel + "_kabelliste", ".csv"), "text/csv;charset=utf-8");
    }
    if (a === "pack-csv") {
      herunterladen(csvText(["Kabeltyp", "Länge (m)", "Anzahl", "Gewerk"], packliste(kabelListe()).map(g => [libName(g.lib), g.laengeM ?? "", g.anzahl, GEWERK_NAME[g.gewerk]])),
        dateiname(P.daten.titel + "_packliste_kabel", ".csv"), "text/csv;charset=utf-8");
    }
  });
  $("#werkzeuge").addEventListener("change", e => {
    if (ui.reiter !== "kabel") return;
    const f = e.target.dataset.kFeld;
    if (f === "screen") ui.kabelFilter.screen = e.target.value;
    if (f === "ohneLaenge") ui.kabelFilter.ohneLaenge = e.target.checked;
    render();
  });
  $("#zeichnung").addEventListener("change", e => {
    if (ui.reiter !== "kabel") return;
    const tr = e.target.closest("[data-kabel]"); const f = e.target.dataset.kabelFeld; if (!tr || !f) return;
    let w = e.target.value;
    if (f === "laengeM" || f === "anzahl") { w = leseZahl(w); if (Number.isNaN(w) || (w !== null && w < 0)) return toast(`${f === "anzahl" ? "Anzahl" : "Länge"}: bitte eine Zahl ≥ 0.`, "fehler"); }
    if (f === "anzahl") w = Math.max(1, Math.round(w || 1));
    kabelSetzen(tr.dataset.kabel, f, w === "" ? null : w);
    ui.sel.kabel = tr.dataset.kabel;
    aenderung();
  });
  $("#zeichnung").addEventListener("click", e => {
    if (ui.reiter !== "kabel" || e.target.closest("input, select")) return;
    const tr = e.target.closest("[data-kabel]"); if (!tr) return;
    ui.sel.kabel = tr.dataset.kabel; render();
  });
  $("#rechts").addEventListener("change", e => {
    if (ui.reiter !== "kabel") return;
    const f = e.target.dataset.kabelHand; if (!f || !ui.sel.kabel) return;
    kabelSetzen(ui.sel.kabel, f, e.target.value);
    aenderung();
  });
  $("#rechts").addEventListener("click", e => {
    if (ui.reiter !== "kabel") return;
    const a = e.target.closest("[data-k]")?.dataset.k;
    if (a === "loeschen") { P.kabel = P.kabel.filter(k => "hand:" + k.id !== ui.sel.kabel); ui.sel.kabel = null; aenderung(); }
    if (a === "zuruecksetzen") { delete P.kabelAnpassung[ui.sel.kabel]; aenderung(); }
  });
}

async function kabelVonHand() {
  const typen = libListe().filter(e => ["kabel", "laka", "spinne", "multicore"].includes(libTyp(e)));
  const erg = await formularDialog("Kabel von Hand", [
    { name: "lib", label: "Kabeltyp", art: "auswahl", wert: typen[0]?.id, optionen: typen.map(e => [e.id, e.name]) },
    { name: "laengeM", label: "Länge (m)", art: "zahl", wert: "" },
    { name: "anzahl", label: "Anzahl", art: "zahl", wert: 1 },
    { name: "von", label: "Von (Gerät · Anschluss)", wert: "" },
    { name: "nach", label: "Nach (Gerät · Anschluss)", wert: "" },
    { name: "bemerkung", label: "Bemerkung", wert: "" },
  ], "Hinzufügen");
  if (!erg) return;
  if (Number.isNaN(erg.laengeM) || Number.isNaN(erg.anzahl)) return toast("Länge und Anzahl als Zahl eingeben.", "fehler");
  nutzeEintrag(erg.lib);
  const k = { id: neueId("h"), lib: erg.lib, gewerk: libGewerk(erg.lib) || "strom", laengeM: erg.laengeM, anzahl: Math.max(1, Math.round(erg.anzahl || 1)), von: erg.von, nach: erg.nach, bemerkung: erg.bemerkung };
  P.kabel.push(k);
  ui.sel.kabel = "hand:" + k.id;
  aenderung();
}

function renderLibraryFormular() {
  const el = $("#lib-formular");

  if (!e) { libEntwurf = null; el.innerHTML = `<div class="karte"><p class="leise">Links einen Eintrag wählen oder mit „+ Neu“ anlegen.</p></div>`; return; }
  if (!libEntwurf || libEntwurf.id !== e.id) libEntwurf = klon(e);
  const d = libEntwurf;
  const typ = libTyp(d);
  const v = vollstaendigkeit(d);
  const geaendert = JSON.stringify(d) !== JSON.stringify(e);
  const projektKopie = P.library[e.id];
  const abweichung = projektKopie && JSON.stringify(projektKopie) !== JSON.stringify(e);
  const feldHtml = f => {
    if (f.abschnitt) return `<div class="abschnitt" style="grid-column:1/-1">${f.abschnitt}</div>`;
    const wert = holePfad(d.attribute, f.p);
    const fehlt = (f.pf === "pflicht" || f.pf === "pruef") && !gefuellt(f, d.attribute);
    const klasse = fehlt ? (f.pf === "pflicht" ? " pflicht-fehlt" : " fehlt") : "";
    const titel = `${f.label}${f.einheit ? " (" + f.einheit + ")" : ""}${f.pf === "pflicht" ? " *" : ""}`;
    const geaendertFeld = JSON.stringify(wert) !== JSON.stringify(holePfad(e.attribute, f.p)) || (f.paar && JSON.stringify(holePfad(d.attribute, f.paar)) !== JSON.stringify(holePfad(e.attribute, f.paar)));
    const stil = geaendertFeld ? ` style="border-left:3px solid var(--akzent)"` : "";
    let input;
    if (f.art === "ja") input = `<select data-pfad="${f.p}" data-art="ja"${stil}><option value="">—</option><option value="ja"${wert === true ? " selected" : ""}>ja</option><option value="nein"${wert === false ? " selected" : ""}>nein</option></select>`;
    else if (f.art === "auswahl") input = `<select data-pfad="${f.p}" data-art="text"${stil}><option value="">—</option>${f.optionen.map(([w, t]) => `<option value="${esc(w)}"${wert === w ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
    else if (f.art === "json") input = `<textarea data-pfad="${f.p}" data-art="json"${stil}>${esc(wert == null ? "" : JSON.stringify(wert, null, 1))}</textarea>${f.generator ? `<button data-l="gen-${f.generator}" type="button">Kanäle und Ausgänge erzeugen …</button>` : ""}`;
    else if (f.paar) input = `<div class="zwei"><input data-pfad="${f.p}" data-art="zahl" value="${wert ?? ""}" placeholder="—"${stil}><input data-pfad="${f.paar}" data-art="zahl" value="${holePfad(d.attribute, f.paar) ?? ""}" placeholder="—"${stil}></div>`;
    else {
      const anzeige = f.art === "liste" || f.art === "textliste" ? (Array.isArray(wert) ? wert.join(", ") : "") : f.art === "zahl" ? (wert == null ? "" : fmtFlex(wert, 4)) : (wert ?? "");
      input = `<input data-pfad="${f.p}" data-art="${f.art}" value="${esc(anzeige)}" placeholder="${f.pf === "pruef" ? "— aus Datenblatt" : "—"}"${f.art === "zahl" ? ' inputmode="decimal"' : ""}${stil}>`;
    }
    return `<label class="feld${klasse}"${f.art === "json" ? ' style="grid-column:1/-1"' : ""}><span>${esc(titel)}</span>${input}</label>`;
  };
  el.innerHTML = `<div class="karte">
    <div class="knopfreihe"><h2 style="margin:0">${esc(d.name || "—")}</h2>${badgeHtml(d)}<span class="leise klein">${LIB_TYPEN[typ] || typ} · ${esc(d.id)}</span><span class="fueller"></span>
      <button data-l="verwerfen" ${geaendert ? "" : "disabled"}>Verwerfen</button><button data-l="dup">Duplizieren</button>
      <button data-l="loeschen" class="gefahr" ${LIB.herkunft.get(e.id) === "beispiel" ? "disabled title='Beispiele sind eingebaut'" : LIB.herkunft.get(e.id) === "rex" ? "disabled title='Kommt aus dem Rex-System'" : ""}>Löschen</button>

function libFeldUebernehmen(t) {
  const d = libEntwurf; if (!d) return;
  const pfad = t.dataset.pfad, art = t.dataset.art;
  let w = t.value;
  if (art === "name") { d.name = w.trim(); return; }
  if (art === "kategorie") { d.kategorie = w; return; }
  if (art === "zahl") { w = leseZahl(w); if (Number.isNaN(w)) { toast("Bitte eine Zahl eingeben.", "fehler"); return false; } }
  else if (art === "ja") w = w === "" ? null : w === "ja";
  else if (art === "liste") { w = w.trim() ? w.split(/[;,]\s*|\s+/).map(leseZahl).filter(x => Number.isFinite(x)) : null; }
  else if (art === "textliste") { w = w.trim() ? w.split(/\s*[,;]\s*/).filter(Boolean) : null; }
  else if (art === "json") { if (!w.trim()) w = null; else { try { w = JSON.parse(w); } catch (e) { toast("JSON ungültig: " + e.message, "fehler"); return false; } } }
  else if (w === "" && pfad !== "hersteller") w = null;
  setzePfad(d.attribute, pfad, w);
  if (/^led\.(mmB|pixelB)$/.test(pfad) && d.attribute.led.mmB && d.attribute.led.pixelB) d.attribute.led.pitchMm = Math.round(d.attribute.led.mmB / d.attribute.led.pixelB * 100) / 100;
}

/* ===== 75-material.js ===== */
/* Materialliste des Projekts: LED-Module, Rigging, Geräte und Kabel (aus der Packliste) je Library-Eintrag.
   Rückgabe ans Rex-System (Datenbank-Agent) oder als Datei. */

const MATERIAL_GRUPPEN = ["LED-Module", "Rigging", "Geräte", "Kabel"];

function materialListe() {
  const pos = new Map();
  const add = (gruppe, lib, anzahl, laengeM = null, bemerkung = "") => {
    if (!anzahl) return;
    const k = `${gruppe}|${lib || "?"}|${laengeM ?? ""}|${lib ? "" : bemerkung}`;
    const e = eintrag(lib);
    const p = pos.get(k) || { gruppe, materialId: lib || null, name: e?.name || bemerkung || "ohne Library-Eintrag", kategorie: e?.kategorie || "",
      anzahl: 0, laengeM, gewichtKg: null, herkunft: lib ? LIB.herkunft.get(lib) || "projekt" : null };
    p.anzahl += anzahl;
    const kg = e?.attribute?.gewicht;
    p.gewichtKg = Number.isFinite(kg) ? kg * p.anzahl : null;
    pos.set(k, p);
  };
  for (const s of P.screens) {
    const n = new Map();
    for (const m of s.module) n.set(m.lib, (n.get(m.lib) || 0) + 1);
    for (const [lib, a] of n) add("LED-Module", lib, a);
    const r = riggingDaten(s);
    if (r.lib && r.rahmen.length) add("Rigging", r.lib.id, r.rahmen.length);
  }
  for (const g of P.geraete) {
    if (g.art === "einspeisung" || g.art === "multicore") continue; // Multicore steht als Kabel in der Packliste
    add("Geräte", g.lib, 1, null, `${g.name} (${g.art})`);
  }
  for (const z of packliste(kabelListe())) add("Kabel", z.lib, z.anzahl, z.laengeM, "Kabeltyp fehlt");
  const ordnung = g => MATERIAL_GRUPPEN.indexOf(g);
  return [...pos.values()].sort((a, b) => ordnung(a.gruppe) - ordnung(b.gruppe) || a.name.localeCompare(b.name, "de") || (a.laengeM ?? 0) - (b.laengeM ?? 0));
}

function materialDokument() {
  return { format: "rex-materialliste", formatVersion: 1, modul: KONFIG.MODUL, erstellt: new Date().toISOString(),
    projekt: { rexId: P.rexId || null, ...P.daten }, positionen: materialListe() };
}

function materialHinweise(liste) {
  const h = [];
  const ohne = liste.filter(p => !p.materialId);
  if (ohne.length) h.push({ art: "warn", text: `${ohne.length} Positionen ohne Library-Eintrag (z.B. Kabeltyp fehlt) – im Reiter Kabel ergänzen.` });
  if (liste.some(p => p.gruppe === "Kabel" && p.laengeM == null)) h.push({ art: "warn", text: "Kabel ohne Länge – im Reiter Kabel ergänzen." });
  if (Datenquelle.verbunden()) {
    const fremd = liste.filter(p => p.materialId && p.herkunft !== "rex");
    if (fremd.length) h.push({ art: "warn", text: `${fremd.length} Positionen nicht aus der Rex-Library (Beispiel oder lokal) – Rex kennt sie nicht.` });
  }
  return h;
}

    <p class="klein leise">Alles, was das Projekt braucht: Module, Rigging, Geräte und Kabel (wie Packliste). Gewicht ${fmt(kg, 1)} kg${kgOffen ? " + unbekannte Gewichte" : ""}.</p>

      <td class="zahl">${p.laengeM != null ? fmtFlex(p.laengeM) + " m" : "—"}</td><td class="zahl">${fmt(p.anzahl)}</td><td class="zahl">${p.gewichtKg != null ? fmt(p.gewichtKg, 1) + " kg" : "—"}</td></tr>`).join("")
      || `<tr><td colspan="6" class="leise">Noch kein Material im Projekt.</td></tr>`}</table></div>`;
}

async function materialAktion(a) {
  if (a === "material-csv") {
    const zeilen = materialListe().map(p => [p.gruppe, p.name, p.materialId || "", p.laengeM ?? "", p.anzahl, p.gewichtKg != null ? +p.gewichtKg.toFixed(2) : ""]);
    herunterladen(csvText(["Gruppe", "Material", "Materialnummer", "Länge (m)", "Anzahl", "Gewicht (kg)"], zeilen), dateiname(`${P.daten.titel}_material`, ".csv"), "text/csv");
  }
  if (a === "material-datei") herunterladen(JSON.stringify(materialDokument(), null, 2), dateiname(`${P.daten.titel}_material`, ".rexmaterial.json"));
  if (a === "material-rex") {
    if (nurLesen()) return toast("Nur ansehen – der LED-Planer ist für diesen Benutzer nicht freigeschaltet.", "fehler");
    try { await Datenquelle.materialZurueckgeben(materialDokument()); toast("Materialliste an Rex übergeben.", "ok"); }
    catch (e) { toast("Übergabe fehlgeschlagen: " + e.message, "fehler"); }
  }
}

/* ===== 80-druck.js ===== */
/* Druck: Bericht A4 hoch, Großformat (A3/A4 quer) und Kundenansicht – Druckansicht im neuen Fenster,
   PDF über den Druckdialog des Browsers. Papier weiß, Zeichnungen behalten den dunklen Grund (Styleguide 9). */

async function druckDialog() {
  if (!P.screens.length) return toast("Noch kein Screen zum Drucken.", "fehler");
  const zusatz = P.regeln.druckZusatz;
  const erg = await formularDialog("Drucken / PDF", [
    { name: "art", label: "Was drucken?", art: "auswahl", wert: "bericht", optionen: [
      ["bericht", "Bericht A4 hoch (Deckblatt, Pläne, Listen)"],
      ["gross", `Großformat – alle Pläne ${zusatz === "A4" ? "A4" : "A3"} quer`],
      ["kunde", "Kundenansicht (1 Blatt je Screen)"]] },
    { name: "hinweis", art: "hinweis", label: "Es öffnet sich eine Druckansicht. Dort „Drucken / als PDF speichern“ wählen." },
  ], "Öffnen");
  if (!erg) return;
  const html = erg.art === "bericht" ? berichtHtml() : erg.art === "gross" ? grossformatHtml(zusatz === "A4" ? "A4" : "A3") : kundenHtml();
  const f = window.open("", "rex-ledplaner-druck");
  if (!f) return toast("Popup wurde blockiert – bitte Popups erlauben.", "fehler");
  f.document.open(); f.document.write(html); f.document.close();
}

function druckSeite(titel, format, inhalt) {
  const groesse = { "A4hoch": ["A4 portrait", "210mm", "297mm"], "A4quer": ["A4 landscape", "297mm", "210mm"], "A3quer": ["A3 landscape", "420mm", "297mm"] }[format];
  return `<!doctype html><html lang="de"><head><meta charset="utf-8"><title>${esc(titel)}</title><style>${DRUCK_CSS}
    @page { size:${groesse[0]}; margin:0; } .blatt { width:${groesse[1]}; min-height:${groesse[2]}; }</style></head>
    <body><button class="druck" onclick="print()">Drucken / als PDF speichern</button>${inhalt}</body></html>`;
}
function kopfzeile(titel, seite) {
  return `<div class="kopfzeile"><span><b>REX</b> · ${esc(P.daten.titel)} · ${esc(titel)}</span><span>${esc(P.daten.datum || "")} · Rev. ${esc(P.daten.revision || "—")}${seite ? " · " + seite : ""}</span></div>`;
}
function druckSvg(s, opt, hoeheMm) {
  const v = einpassAnsicht(s);
  return `<svg viewBox="${vbText(v)}" style="max-height:${hoeheMm}mm" preserveAspectRatio="xMidYMid meet">${screenSvgInhalt(s, { ...opt, masse: true })}</svg>`;
}
function stromDruckOpt(s) {
  const kreise = kreiseVon(s.id); const farbe = new Map(); kreise.forEach((k, i) => k.module.forEach(id => farbe.set(id, wegFarbe(i))));
  return { fuellung: m => farbe.has(m.id) ? farbe.get(m.id) + "2e" : "transparent", wege: kreise.map((k, i) => ({ farbe: wegFarbe(i), module: k.module, start: kreisName(k) })) };
}
function signalDruckOpt(s) {
  const st = straengeVon(s.id); const farbe = new Map(); st.forEach((k, i) => k.module.forEach(id => farbe.set(id, wegFarbe(i))));
  return { fuellung: m => farbe.has(m.id) ? farbe.get(m.id) + "2e" : "transparent", wege: st.map((k, i) => ({ farbe: wegFarbe(i), module: k.module, start: strangName(k), ende: Number.isFinite(k.backupPort) ? "B" + k.backupPort : null })) };
}
function projektSummen() {
  const sum = { module: 0, m2: 0, kg: 0, wMax: 0, wTyp: 0, px: 0 };
  for (const s of P.screens) { const x = screenSummen(s); sum.module += x.anzahl; sum.m2 += x.m2; sum.kg += x.kg; sum.wMax += x.wMax; sum.wTyp += x.wTyp; sum.px += x.px; }
  return sum;
}
function alleHinweise() {
  return ["aufbau", "strom", "signal", "ausgabe", "kabel"].flatMap(r => REITER[r].pruefungen().filter(h => h.art !== "ok").map(h => ({ ...h, reiter: r })));
}

  // Kabel
  const kabel = kabelListe();
  blaetter.push(`<div class="blatt">${kopfzeile("Kabel", "Blatt " + (++nr))}<h2>Kabelliste</h2>

  // Materialliste
  const mat = materialListe();
  if (mat.length) blaetter.push(`<div class="blatt">${kopfzeile("Material", "Blatt " + (++nr))}<h2>Materialliste</h2>
    <table><tr><th>Gruppe</th><th>Material</th><th>Nr.</th><th class="z">Länge</th><th class="z">Anzahl</th><th class="z">Gewicht</th></tr>
    ${mat.map(p => `<tr><td>${esc(p.gruppe)}</td><td>${esc(p.name)}</td><td>${esc(p.materialId || "—")}</td><td class="z">${p.laengeM != null ? fmtFlex(p.laengeM) + " m" : "—"}</td><td class="z">${fmt(p.anzahl)}</td><td class="z">${p.gewichtKg != null ? fmt(p.gewichtKg, 1) + " kg" : "—"}</td></tr>`).join("")}
    <tr><td colspan="5"><b>Summe bekannter Gewichte</b></td><td class="z"><b>${fmt(mat.reduce((a, p) => a + (p.gewichtKg || 0), 0), 1)} kg</b></td></tr></table></div>`);
  // Offene Punkte
  const h = alleHinweise();
  blaetter.push(`<div class="blatt">${kopfzeile("Offene Punkte", "Blatt " + (++nr))}<h2>Offene Punkte und Hinweise</h2>
    ${h.map(x => `<div class="hinweis ${x.art}">${esc(x.text)}</div>`).join("") || "<p>Keine.</p>"}
    <p style="font-size:8pt;color:#666;margin-top:12px">Gewicht, Leistung und Stromstärke sind Richtwerte aus der Library. Kapazitäten sind Planungswerte – Herstellerangaben, Netzform und Vorschriften gehen vor. Die Planung ersetzt keine Statik und keine Freigabe durch eine Elektrofachkraft.</p></div>`);
  return druckSeite(`${P.daten.titel} – Bericht`, "A4hoch", blaetter.join(""));
}

function riggingDruckTabelle(s) {
  const d = riggingDaten(s);
  if (s.bauart !== "geflogen" || !d.rahmen.length) return `<p style="font-size:9pt">${s.bauart === "gestellt" ? "Gestellt · Bodenlast gesamt " + fmt(d.gesamtKg, 1) + " kg" : "Kein Flugrahmen gewählt."}</p>`;
  return `<h3>Rigging</h3><table><tr><th>Rahmen</th><th class="z">Spalten</th><th class="z">Last Rahmen</th><th class="z">Last je Punkt</th><th class="z">Zulässig</th></tr>
    ${d.rahmen.map(r => `<tr><td>${esc(d.lib.name)} · ${r.nr}</td><td class="z">${r.spalten}</td><td class="z">${fmt(r.kg, 1)} kg</td><td class="z">${fmt(r.kg / (d.punkte.length / d.rahmen.length), 1)} kg</td><td class="z">${r.lastMaxKg ? fmt(r.lastMaxKg) + " kg" : "—"}</td></tr>`).join("")}
    <tr><td><b>Gesamt</b></td><td></td><td class="z"><b>${fmt(d.gesamtKg, 1)} kg${d.unbekannt.length ? " + ?" : ""}</b></td><td></td><td></td></tr></table>
    <p style="font-size:8pt;color:#666">Richtwerte, gleichmäßig auf die Punkte verteilt${d.unbekannt.length ? " · fehlt: " + esc(d.unbekannt.join(", ")) : ""}. Freigabe: ${P.regeln.riggingFreigabe === "extern" ? "extern (Location/Statiker)" : "intern"} · Name: ____________ Datum: ________</p>`;
}

function schriftfeld(planTitel, blatt) {
  const d = P.daten;
  return `<div class="schriftfeld"><div><span>Projekt</span>${esc(d.titel)}</div><div><span>Plan</span>${esc(planTitel)}</div><div><span>Kunde</span>${esc(d.kunde || "—")}</div>
    <div><span>Ersteller</span>${esc(d.ersteller || "—")}</div><div><span>Rev. · Datum</span>${esc(d.revision || "—")} · ${esc(d.datum || "—")}</div><div><span>Blatt</span>${blatt}</div></div>`;
}
function grossformatHtml(format) {
  const blaetter = [];
  const hoehe = format === "A3" ? 230 : 150;
  let nr = 0;
  const plaene = [];
  for (const s of P.screens) {
    plaene.push(["Aufbau / Rigging · " + s.name, druckSvg(s, { zusatz: riggingSvg(s) + kurveMarkenSvg(s, false), masseTiefer: kurveDaten(s).gebogen }, hoehe) + (kurveDaten(s).gebogen ? draufsichtSvg(s, 110) : "") + riggingDruckTabelle(s)]);
    if (kreiseVon(s.id).length) plaene.push(["Strom · " + s.name, druckSvg(s, stromDruckOpt(s), hoehe)]);
    if (straengeVon(s.id).length) plaene.push(["Signal · " + s.name, druckSvg(s, signalDruckOpt(s), hoehe)]);
  }
  for (const [titel, svg] of plaene) blaetter.push(`<div class="blatt">${kopfzeile(titel, "")}<h2>${esc(titel)}</h2>${svg}${schriftfeld(titel, `${++nr} / ${plaene.length}`)}</div>`);
  return druckSeite(`${P.daten.titel} – Pläne ${format} quer`, format + "quer", blaetter.join(""));
}
function kundenHtml() {
  const blaetter = P.screens.filter(s => s.module.length).map(s => {
    const x = screenSummen(s); const pl = pixelLage(s);
    const pitches = [...new Set(s.module.map(m => fmtFlex(eintrag(m.lib)?.attribute?.led?.pitchMm, 2)))].join(" / ");
    return `<div class="blatt"><div class="marke">R E X &nbsp; S O L U T I O N</div><h1 style="font-size:24pt">${esc(s.name)}</h1><div class="unter">${esc(P.daten.titel)}${P.daten.kunde ? " · " + esc(P.daten.kunde) : ""}</div>
      <div style="margin:10mm 0">${druckSvg(s, { masse: true }, 130)}</div>
      <div class="eckdaten"><span>Größe</span><b>${fmtFlex(x.bM, 2)} × ${fmtFlex(x.hM, 2)} m (${fmt(x.m2, 2)} m²)</b><span>Auflösung</span><b>${fmt(pl.b)} × ${fmt(pl.h)} Pixel</b>
      <span>Pixelabstand</span><b>${pitches} mm</b><span>Module</span><b>${x.anzahl}</b><span>Bauart</span><b>${s.bauart}${s.ukM != null ? ", Unterkante " + fmtFlex(s.ukM) + " m" : ""}</b>
      <span>Leistung max. / typ.</span><b>${fmt(x.wMax / 1000, 1)} / ${fmt(x.wTyp / 1000, 1)} kW</b><span>Gewicht Module</span><b>${fmt(x.kg)} kg</b></div></div>`;
  });
  return druckSeite(`${P.daten.titel} – Kundenansicht`, "A4hoch", blaetter.join("") || `<div class="blatt">Keine Screens mit Modulen.</div>`);
}

/* ===== 90-start.js ===== */
/* Start: Library laden, letztes Projekt aus dem Autosave holen, Oberfläche verdrahten.
   Mit Rex-Anbindung danach Library und Freischaltung aus dem Datenbank-Agent nachladen. */
function start() {
  libLaden();
  if (!autosaveLaden()) { P = neuesProjekt(); gespeicherterStand = null; }
  historieStart();
  ui.screen = P.screens[0]?.id || null;
  gerustEreignisse();
  touchEreignisse();
  for (const f of [aufbauEreignisse, riggingEreignisse, typeof stromEreignisse === "function" && stromEreignisse,
    typeof signalEreignisse === "function" && signalEreignisse, typeof ausgabeEreignisse === "function" && ausgabeEreignisse, mappingEreignisse,
    typeof kabelEreignisse === "function" && kabelEreignisse, typeof libraryEreignisse === "function" && libraryEreignisse,
    typeof einstellungenEreignisse === "function" && einstellungenEreignisse]) if (f) f();
  render();
  if (Datenquelle.verbunden()) rexVerbinden();
}

async function rexVerbinden() {
  try {
    const [liste, frei] = await Promise.all([Datenquelle.ladeLibrary(), Datenquelle.ladeFreischaltung()]);
    libLaden(liste); REX.freischaltung = frei; REX.fehler = null;
    if (!frei.ledplaner) toast("Nur ansehen – der LED-Planer ist für diesen Benutzer nicht freigeschaltet.", "fehler");
  } catch (e) {
    REX.fehler = e.message;
    toast("Rex-System nicht erreichbar – eingebaute Library wird genutzt. (" + e.message + ")", "fehler");
  }
  render();
}
start();

</script>
