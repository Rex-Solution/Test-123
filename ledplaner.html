<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED-Planer – Rex</title>
<link rel="icon" href="rex-symbol.png">
<style>
/* LED-Planer – Stil nach Rex-Styleguide (rex-styleguide.md). Farben nur über Variablen. */
:root {
  --bg:#141414; --flaeche:#1c1c1c; --leiste:#1a1a1a; --linie:#333; --text:#e8e8e8;
  --text-leise:#9a9a9a; --akzent:#4da3ff; --akzent-flaeche:#16263a;
  --ok:#3fb950; --warnung:#d29922; --fehler:#f85149;
  /* interne Farben Strom/Signal (freigegeben 08.10.2026) */
  --k1:#4dabf7; --k2:#f783ac; --k3:#63e6be; --k4:#ffd43b; --k5:#b197fc;
  --k6:#66d9e8; --k7:#c0eb75; --k8:#e599f7; --k9:#ffc078; --k10:#91a7ff;
  --l1:#c08050; --l2:#e8e8e8; --l3:#8b949e;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI",system-ui,sans-serif;
  display:grid; grid-template-rows:auto auto 1fr; overflow:hidden; }
input,select,textarea,button { font:inherit; color:var(--text); background:var(--flaeche);
  border:1px solid var(--linie); border-radius:6px; padding:6px 8px; }
input:focus,select:focus,textarea:focus,button:focus-visible { outline:none; border-color:var(--akzent); }
input[type="checkbox"] { padding:0; }
button { cursor:pointer; white-space:nowrap; } button:hover { border-color:#555; }
button:disabled { opacity:.45; cursor:default; }
button.primaer { background:#1f4f80; border-color:#2d6aa8; }
button.aktiv { border-color:var(--akzent); background:var(--akzent-flaeche); }
button.gefahr:hover { border-color:var(--fehler); }
kbd { font-size:11px; border:1px solid var(--linie); border-radius:3px; padding:0 4px; color:var(--text-leise); }
h2 { font-size:16px; margin:0 0 8px; }
.leise { color:var(--text-leise); }
.klein { font-size:13px; }
.label { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-leise); margin:16px 0 6px; }
.label:first-child { margin-top:0; }
.fueller { flex:1; }
[hidden] { display:none !important; }

/* Kopfleiste */
.kopfleiste { display:flex; align-items:center; gap:24px; padding:8px 16px;
  background:var(--leiste); border-bottom:1px solid var(--linie); }
.marke { display:flex; align-items:center; gap:10px; font-size:18px; margin:0; font-weight:600; }
.marke .zeichen { width:30px; height:30px; border:1px dashed #555; border-radius:4px; font-size:9px;
  display:grid; place-items:center; color:var(--text-leise); text-align:center; line-height:1; }
.marke img { width:30px; height:30px; }
.hauptreiter { display:flex; gap:4px; }
.hauptreiter button { border-color:transparent; background:transparent; }
.hauptreiter button[aria-selected="true"] { background:var(--akzent-flaeche); border-color:var(--akzent); }
.status { margin-left:auto; display:flex; gap:12px; align-items:center; font-size:13px; }
.status .ungespeichert { color:var(--warnung); }

/* Unterleiste */
.unterleiste { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--linie); flex-wrap:wrap; }
.umschalter { display:inline-flex; }
.umschalter button { border-radius:0; margin-left:-1px; display:flex; align-items:center; gap:6px; }
.umschalter button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
.umschalter button:last-child { border-radius:0 6px 6px 0; }
.umschalter button[aria-selected="true"] { background:var(--akzent); border-color:var(--akzent); color:#000; }
.ampel { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--linie); }
.ampel.ok { background:var(--ok); } .ampel.warn { background:var(--warnung); } .ampel.fehler { background:var(--fehler); }
.knopfreihe { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* Arbeitsbereich */
.ansicht { display:none; min-height:0; grid-row:3; }
.ansicht.aktiv { display:grid; }
#planen { grid-template-columns:260px 1fr 320px; min-height:0; }
.spalte { background:var(--leiste); overflow:auto; padding:12px; min-height:0; }
.spalte.links { border-right:1px solid var(--linie); }
.spalte.rechts { border-left:1px solid var(--linie); }
.mitte { display:grid; grid-template-rows:auto 1fr 220px; min-height:0; min-width:0; }

/* Baum, Palette */
.baum { list-style:none; margin:0; padding:0; font-size:13px; }
.baum li { padding:4px 8px; border-radius:6px; display:flex; justify-content:space-between; gap:8px; align-items:center; cursor:pointer; }
.baum li:hover { background:#202020; }
.baum li.sel { background:var(--akzent-flaeche); }
.baum li.gruppe { color:var(--text-leise); cursor:default; background:none; }
.baum li .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.palette-item { display:flex; gap:8px; align-items:center; padding:6px 8px; margin-bottom:4px; border:1px solid var(--linie);
  border-radius:6px; background:var(--flaeche); font-size:13px; cursor:grab; user-select:none; width:100%; text-align:left; }
.palette-item:hover { border-color:#555; }
.palette-item .form { border:1.5px solid var(--text-leise); flex:none; }
.palette-item .name { flex:1; min-width:0; }

/* Werkzeugleiste */
.werkzeuge { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--linie); background:var(--leiste); }
.werkzeuge .trenner { width:1px; height:24px; background:var(--linie); }

/* Zeichenfläche */
.zeichnung { position:relative; overflow:hidden; min-height:0; background:var(--bg); }
.zeichnung > svg { width:100%; height:100%; display:block; touch-action:none; user-select:none; }
.zeichnung.liste-modus { overflow:auto; padding:16px; }
.zeichnung .leer-hinweis { position:absolute; inset:0; display:grid; place-items:center; color:var(--text-leise); text-align:center; pointer-events:none; padding:24px; }
.zeichnung text { font-family:"Segoe UI",system-ui,sans-serif; }
.zeichnung.pan > svg { cursor:grab; }
.zeichnung.pinsel > svg { cursor:crosshair; }
svg .modul { cursor:pointer; }
svg .modul-rahmen { fill:none; stroke:#bdbdbd; }
svg .modul.sel .modul-rahmen { stroke:var(--akzent); }
svg .modul.fehler .modul-rahmen { stroke:var(--fehler); }
.zoomanzeige { position:absolute; left:8px; bottom:8px; padding:2px 8px; border-radius:6px; background:rgba(0,0,0,.6); font-size:12px; color:var(--text-leise); pointer-events:none; }

/* Liste unten */
.liste-unten { border-top:1px solid var(--linie); background:var(--leiste); overflow:auto; padding:8px 12px; }
.liste-unten .kopf { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; font-weight:normal; color:var(--text-leise); padding:6px 8px; border-bottom:1px solid var(--linie); white-space:nowrap; }
td { padding:6px 8px; border-bottom:1px solid #262626; white-space:nowrap; }
tr.sel td { background:var(--akzent-flaeche); }
tr.klickbar { cursor:pointer; }
tr.klickbar:hover td { background:#202020; }
td.zahl, th.zahl { text-align:right; font-variant-numeric:tabular-nums; }
.punkt { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.balken { display:inline-block; width:80px; height:8px; background:#262626; border-radius:4px; overflow:hidden; vertical-align:middle; margin-right:6px; }
.balken i { display:block; height:100%; background:var(--ok); }
.balken i.warn { background:var(--warnung); }
.balken i.fehler { background:var(--fehler); }
.tabelle-edit input, .tabelle-edit select { padding:3px 6px; font-size:13px; }
.tabelle-edit input.laenge, .tabelle-edit input.anzahl { width:72px; text-align:right; }
.tabelle-edit td.fehlt input { border-color:var(--warnung); }
.kabelpunkt { display:inline-block; width:22px; height:4px; border-radius:2px; vertical-align:middle; margin-right:6px; }

/* Karten, Formulare, Prüfhinweise */
.karte { background:var(--leiste); border:1px solid var(--linie); border-radius:10px; padding:16px; }
.spalte .karte { background:var(--flaeche); padding:12px; margin-bottom:12px; }
.feld { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; min-width:0; }
.feld > span { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-leise); }
.feld input, .feld select, .feld textarea { width:100%; min-width:0; }
.feld textarea { min-height:90px; font-family:Consolas, ui-monospace, monospace; font-size:12px; }
.feld.check { flex-direction:row; align-items:center; gap:8px; }
.feld.check > span { text-transform:none; letter-spacing:0; font-size:13px; color:var(--text); }
.feld.check input { width:auto; flex:none; }
.feld.fehlt input, .feld.fehlt select { border-color:var(--warnung); }
.feld.pflicht-fehlt input, .feld.pflicht-fehlt select { border-color:var(--fehler); }
.zwei { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.drei { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px 12px; }
.werte { width:100%; font-size:13px; }
.werte td { padding:3px 0; border-bottom:1px solid #262626; white-space:normal; }
.werte td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
.hinweis { border:1px solid var(--linie); border-left:3px solid; border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:13px; }
.hinweis[data-ziel] { cursor:pointer; }
.hinweis.fehler { border-left-color:var(--fehler); background:#2a1717; }
.hinweis.warn { border-left-color:var(--warnung); background:#2a2413; }
.hinweis.ok { border-left-color:var(--ok); background:#15261a; }
.hinweis.info { border-left-color:var(--akzent); background:#1d2c3a; }
.badge { font-size:11px; padding:1px 7px; border-radius:10px; white-space:nowrap; }
.badge.voll { background:#193a24; color:var(--ok); }
.badge.teil { background:#3a2f12; color:var(--warnung); }
.badge.fehler { background:#3a1d1d; color:var(--fehler); }
.phase { display:grid; grid-template-columns:28px 1fr 96px; gap:8px; align-items:center; font-size:13px; margin-bottom:6px; }
.phase .balken { width:100%; margin:0; }

/* Übersichten */
.uebersicht { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:12px; width:100%; }
.kanalgitter { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin:6px 0 10px; }
.kanal, .port { border:1px solid var(--linie); border-radius:6px; padding:4px 6px; font-size:11px; background:var(--bg); }
.kanal { text-align:center; }
.kanal b, .port b { font-size:12px; }
.kanal.frei, .port.frei { color:var(--text-leise); border-style:dashed; }
.portgitter { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin:8px 0; }

/* Library-Manager, Einstellungen */
#library, #einstellungen { grid-template-columns:320px 1fr; min-height:0; }
.manager-liste { background:var(--leiste); border-right:1px solid var(--linie); padding:12px; overflow:auto; }
.manager-liste .eintrag { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:13px; cursor:pointer; }
.manager-liste .eintrag .badge, .palette-item .badge { flex:none; }
.manager-liste .eintrag:hover { background:#202020; }
.manager-liste .eintrag.sel { background:var(--akzent-flaeche); }
.formular { padding:16px; overflow:auto; }
.formular .karte { max-width:900px; }
.formular .abschnitt { margin:16px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-leise); border-bottom:1px solid var(--linie); padding-bottom:4px; }
.untermenue { list-style:none; margin:0; padding:0; }
.untermenue li { padding:8px 10px; border-radius:6px; cursor:pointer; }
.untermenue li:hover { background:#202020; }
.untermenue li.sel { background:var(--akzent-flaeche); }

/* Dialog */
dialog { background:var(--leiste); color:var(--text); border:1px solid var(--linie); border-radius:10px; padding:16px; min-width:360px; max-width:min(640px, 92vw); }
dialog::backdrop { background:rgba(0,0,0,.55); }
dialog h2 { margin-bottom:12px; }

/* Toast */
#toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast { max-width:420px; padding:10px 14px; border-radius:8px; background:#1d2c3a; border:1px solid var(--linie);
  box-shadow:0 6px 20px rgba(0,0,0,.4); font-size:13px; }
.toast.fehler { background:#3a1d1d; border-color:var(--fehler); }
.toast.ok { background:#15261a; }

@media (max-width: 1100px) {
  #planen { grid-template-columns:220px 1fr 280px; }
}

/* Zoom-Knöpfe in der Zeichnung */
.zoomknoepfe { position:absolute; right:8px; bottom:8px; display:flex; gap:4px; }
.zoomknoepfe button { width:34px; height:34px; padding:0; font-size:18px; background:rgba(20,20,20,.85); }

/* Tablet: Fingerbedienung */
.nur-touch { display:none; }
body.touch .nur-touch { display:inline-flex; }
body.touch button, body.touch select, body.touch input:not([type=checkbox]) { min-height:40px; }
body.touch input, body.touch select, body.touch textarea { font-size:16px; }   /* iPad zoomt sonst beim Antippen */
body.touch .palette-item { padding:10px; touch-action:pan-y; }
body.touch .baum li { padding:9px 8px; }
body.touch .zoomknoepfe button { width:44px; height:44px; }
body.touch .werkzeuge { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin; }   /* Werkzeugleiste wischen statt umbrechen */
body.touch .werkzeuge > *, body.touch .werkzeuge .knopfreihe > * { flex:none; }
body.touch .werkzeuge .knopfreihe { flex-wrap:nowrap; }
.zeichnung > svg { touch-action:none; }   /* Gesten selbst auswerten */
.palette-item.geist { position:fixed; z-index:60; width:220px; transform:translate(-50%, -50%); opacity:.85; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.5); }

/* Schmaler Bildschirm (Tablet hochkant): Seitenspalten als ausklappbare Leisten */
.nur-schmal { display:none; }
@media (max-width: 900px) {
  .nur-schmal { display:inline-block; }
  #planen { grid-template-columns:1fr; position:relative; }
  #planen > .spalte { position:absolute; top:0; bottom:0; z-index:20; width:min(320px, 85vw); display:none; box-shadow:0 0 24px rgba(0,0,0,.6); }
  #planen > .spalte.links { left:0; }
  #planen > .spalte.rechts { right:0; }
  body.zeige-links #planen > .spalte.links, body.zeige-rechts #planen > .spalte.rechts { display:block; }
  #library, #einstellungen { grid-template-columns:1fr; }
}

</style>
</head>
<body>

<header class="kopfleiste">
  <h1 class="marke"><span class="zeichen" title="Platzhalter – rex-zeichen-weiss.png (30 px) einsetzen">Rex-<br>Zeichen</span>LED-Planer</h1>
  <nav class="hauptreiter" role="tablist">
    <button role="tab" data-haupt="planen">Planen</button>
    <button role="tab" data-haupt="library">Library</button>
    <button role="tab" data-haupt="einstellungen">Einstellungen</button>
  </nav>
  <div class="status">
    <span id="status-name"></span>
    <span id="status-gespeichert" class="leise"></span>
  </div>
</header>

<div class="unterleiste" id="unterleiste">
  <button class="nur-schmal" data-spalte="links" title="Projekt und Library ein-/ausblenden">☰</button>
  <div class="umschalter" role="tablist" id="reiterleiste">
    <button data-reiter="aufbau"><span class="ampel"></span>Aufbau</button>
    <button data-reiter="strom"><span class="ampel"></span>Strom</button>
    <button data-reiter="signal"><span class="ampel"></span>Signal</button>
    <button data-reiter="ausgabe"><span class="ampel"></span>Ausgabe</button>
    <button data-reiter="kabel"><span class="ampel"></span>Kabel</button>
  </div>
  <span class="fueller"></span>
  <div class="knopfreihe">
    <button id="btn-undo" title="Rückgängig (Strg+Z)">↶</button>
    <button id="btn-redo" title="Wiederholen (Strg+Y)">↷</button>
    <button id="btn-drucken" title="Bericht A4 hoch, Großformat oder Kundenansicht">Drucken …</button>
    <button id="btn-live" title="Testbild des gewählten Screens 1:1 in eigenem Fenster">▶ Live-Ausgabe</button>
    <button id="btn-speichern" class="primaer" title="Projekt speichern (Strg+S)">Speichern</button>
    <button class="nur-schmal" data-spalte="rechts" title="Details und Prüfhinweise ein-/ausblenden">ⓘ</button>
  </div>
</div>

<main class="ansicht" id="planen">
  <aside class="spalte links">
    <div class="label">Projekt</div>
    <ul class="baum" id="baum"></ul>
    <div class="label" id="palette-titel">Library</div>
    <div id="palette"></div>
  </aside>
  <section class="mitte">
    <div class="werkzeuge" id="werkzeuge"></div>
    <div class="zeichnung" id="zeichnung"></div>
    <div class="liste-unten" id="liste"></div>
  </section>
  <aside class="spalte rechts" id="rechts"></aside>
</main>

<main class="ansicht" id="library">
  <aside class="manager-liste" id="lib-liste"></aside>
  <section class="formular" id="lib-formular"></section>
</main>

<main class="ansicht" id="einstellungen">
  <aside class="manager-liste">
    <h2>Einstellungen</h2>
    <ul class="untermenue" id="einst-menue">
      <li data-einst="datei">Speichern / Laden</li>
      <li data-einst="projekt">Projektdaten</li>
      <li data-einst="regeln">Hausregeln</li>
      <li data-einst="material">Materialliste</li>
      <li data-einst="verknuepfung">Rex-System</li>
    </ul>
  </aside>
  <section class="formular" id="einst-inhalt"></section>
</main>

<dialog id="dialog"></dialog>
<div id="toasts"></div>
<input type="file" id="datei-projekt" accept=".json,application/json" hidden>
<input type="file" id="datei-library" accept=".json,application/json" hidden>

<script>
"use strict";
/* ===== 00-datenquelle.js ===== */
/* Rex-Anbindung: einzige Stelle, die später auf den Datenbank-Agent umgestellt wird.
   Ohne API_BASIS_URL läuft der LED-Planer eigenständig: eingebaute Library + Browser-Speicher + Dateien.
   Das Rex-System kann beim Einbetten vor dem Laden `window.REX_KONFIG = { API_BASIS_URL, ... }` setzen.

   Erwartete Routen (TODO: Route/Antwortformat mit dem Datenbank-Agent abstimmen):
     GET  {API}/material                      → [Rex-Materialeintrag]   (nur Einträge mit attribute.led.typ werden genutzt)
     GET  {API}/freischaltung                 → { module: ["ledplaner", ...] }
     GET  {API}/projekte?modul=ledplaner      → [{ id, titel, geaendert }]
     GET  {API}/projekte/{id}                 → Projektdatei (format "rex-ledplaner")
     PUT  {API}/projekte/{id}                 → { id }   (ohne id: POST {API}/projekte)
     POST {API}/material-rueckgabe            → { ok }   (Materialliste, format "rex-materialliste") */

const KONFIG = {
  API_BASIS_URL: null,        // z.B. "http://rex-server/api" – null = eigenständig
  NAS_BASIS_URL: "",          // Präfix für relative Grafikpfade aus der Datenbank
  MODUL: "ledplaner",
  ...(typeof window !== "undefined" && window.REX_KONFIG && typeof window.REX_KONFIG === "object" ? window.REX_KONFIG : {}),
};

const Datenquelle = {
  verbunden() { return !!KONFIG.API_BASIS_URL; },
  async anfrage(pfad, opt = {}) {
    const antwort = await fetch(`${KONFIG.API_BASIS_URL}${pfad}`, {
      ...opt, headers: { "Content-Type": "application/json", ...(opt.headers || {}) },
    });
    if (!antwort.ok) throw new Error(`Datenbank-Agent: HTTP ${antwort.status}`);
    return antwort.status === 204 ? null : antwort.json();
  },
  /* null = keine Rex-Library (eigenständig) */
  async ladeLibrary() {
    if (!this.verbunden()) return null;
    const liste = await this.anfrage("/material");
    return (Array.isArray(liste) ? liste : []).filter(e => e && e.id && e.attribute?.led?.typ);
  },
  /* Eigenständig ist der LED-Planer freigeschaltet; die Verknüpfung mit dem Signalfluss-Planer folgt später */
  async ladeFreischaltung() {
    if (!this.verbunden()) return { ledplaner: true, signalplaner: false, quelle: "eigenständig" };
    const d = await this.anfrage("/freischaltung");
    const module = Array.isArray(d?.module) ? d.module : [];
    return { ledplaner: module.includes("ledplaner"), signalplaner: module.includes("signalplaner"), quelle: "Rex" };
  },
  async ladeProjektListe() { return this.anfrage(`/projekte?modul=${encodeURIComponent(KONFIG.MODUL)}`); },
  async ladeProjekt(id) { return this.anfrage(`/projekte/${encodeURIComponent(id)}`); },
  async speichereProjekt(text, id) {
    const erg = await this.anfrage(id ? `/projekte/${encodeURIComponent(id)}` : "/projekte", { method: id ? "PUT" : "POST", body: text });
    return erg?.id || id;
  },
  async materialZurueckgeben(liste) { return this.anfrage("/material-rueckgabe", { method: "POST", body: JSON.stringify(liste) }); },
};

/* Zustand der Anbindung (wird beim Start gefüllt) */
const REX = { freischaltung: { ledplaner: true, signalplaner: false, quelle: "eigenständig" }, fehler: null };
const nurLesen = () => !REX.freischaltung.ledplaner;

/* ===== 01-grund.js ===== */

const $$ = (sel, wurzel = document) => [...wurzel.querySelectorAll(sel)];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Deutsche Zahlen: 1.234,5 – leere Werte bleiben leer bzw. „—“ */
function fmt(v, nk = 0) {
  if (v === null || v === undefined || v === "" || !Number.isFinite(Number(v))) return "—";
  return Number(v).toLocaleString("de-DE", { minimumFractionDigits: nk, maximumFractionDigits: nk });
}
function fmtFlex(v, maxNk = 2) {
  if (v === null || v === undefined || v === "" || !Number.isFinite(Number(v))) return "—";
  return Number(v).toLocaleString("de-DE", { maximumFractionDigits: maxNk });
}
/* Eingabe deutsch oder englisch lesen: „1.234,5“, „1234.5“, „4,81“ */
function leseZahl(text) {
  if (text === null || text === undefined) return null;
  let s = String(text).trim();
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

let uidZaehler = 0;
function neueId(praefix = "x") { return praefix + Date.now().toString(36) + (uidZaehler++).toString(36); }

function klon(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

function spaltenBuchstabe(i) {
  let s = ""; i += 1;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

/* ---------- Meldungen (Toast) ---------- */
function toast(text, art = "info") {
  const el = document.createElement("div");
  el.className = "toast " + (art === "fehler" ? "fehler" : art === "ok" ? "ok" : "");
  el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), art === "fehler" ? 6000 : 3000);
}

/* ---------- Dialoge ---------- */
/* felder: [{ name, label, art: "text"|"zahl"|"auswahl"|"check", wert, optionen:[[wert,text]], hilfe }] */
function formularDialog(titel, felder, okText = "Übernehmen") {
  return new Promise(res => {
    const d = $("#dialog");
    d.innerHTML = `<form method="dialog"><h2>${esc(titel)}</h2>
      ${felder.map(f => {
        if (f.art === "check") return `<label class="feld check"><input type="checkbox" name="${f.name}" ${f.wert ? "checked" : ""}><span>${esc(f.label)}</span></label>`;
        if (f.art === "auswahl") return `<label class="feld"><span>${esc(f.label)}</span><select name="${f.name}">${f.optionen.map(([w, t]) =>
          `<option value="${esc(w)}"${String(w) === String(f.wert) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;
        if (f.art === "hinweis") return `<p class="klein leise">${esc(f.label)}</p>`;
        return `<label class="feld"><span>${esc(f.label)}</span><input name="${f.name}" value="${esc(f.wert ?? "")}" ${f.art === "zahl" ? 'inputmode="decimal"' : ""}></label>`;
      }).join("")}
      <div class="knopfreihe" style="justify-content:flex-end;margin-top:12px">
        <button value="abbruch" type="submit">Abbrechen</button><button value="ok" type="submit" class="primaer">${esc(okText)}</button>
      </div></form>`;
    d.onclose = () => {
      if (d.returnValue !== "ok") return res(null);
      const f = d.querySelector("form");
      const erg = {};
      for (const feld of felder) {
        if (feld.art === "hinweis") continue;
        const el = f.elements[feld.name];
        if (feld.art === "check") erg[feld.name] = el.checked;
        else if (feld.art === "zahl") erg[feld.name] = leseZahl(el.value);
        else erg[feld.name] = el.value;
      }
      res(erg);
    };
    d.returnValue = "";
    d.showModal();
    d.querySelector("input, select")?.focus();
  });
}

/* ---------- Dateien ---------- */
function dateiname(basis, endung) {
  const ascii = String(basis || "").trim()
    .replace(/[äÄöÖüÜß]/g, c => ({ ä: "ae", Ä: "Ae", ö: "oe", Ö: "Oe", ü: "ue", Ü: "Ue", ß: "ss" }[c]))
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9._-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "");
  return (ascii || "ledplaner") + endung;
}
function herunterladen(inhalt, name, typ = "application/json") {
  const blob = inhalt instanceof Blob ? inhalt : new Blob([inhalt], { type: typ });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function csvText(kopf, zeilen) {
  const feld = v => { const s = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + [kopf, ...zeilen].map(z => z.map(feld).join(";")).join("\r\n") + "\r\n";
}
function waehleDatei(input) {
  return new Promise(res => {
    input.value = "";
    input.onchange = async () => {
      const f = input.files[0];
      if (!f) return res(null);
      try { res({ name: f.name, text: await f.text() }); } catch (e) { res(null); }
    };
    input.click();
  });
}

/* Pfad lesen/schreiben in attribute */
function holePfad(obj, pfad) { return pfad.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setzePfad(obj, pfad, wert) {
  const teile = pfad.split(".");
  const letzter = teile.pop();
  let o = obj;
  for (const t of teile) { if (o[t] == null || typeof o[t] !== "object") o[t] = {}; o = o[t]; }
  o[letzter] = wert;
}
function gefuellt(f, attr) {
  const v = holePfad(attr, f.p);
  const ok = w => w !== null && w !== undefined && (w !== "" || f.leerErlaubt) && !(Array.isArray(w) && w.length === 0);
  if (!ok(v)) return false;
  return f.paar ? ok(holePfad(attr, f.paar)) : true;
}

/* Vollständigkeit: { gefuellt, gesamt, offen:[labels], pflichtFehlt:[labels] } */
function vollstaendigkeit(e) {
  const typ = e?.attribute?.led?.typ;
  const felder = (SCHEMA[typ] || []).filter(f => f.p && (f.pf === "pflicht" || f.pf === "pruef"));
  const erg = { gefuellt: 0, gesamt: felder.length, offen: [], pflichtFehlt: [] };
  if (!e.name) erg.pflichtFehlt.push("Name");
  for (const f of felder) {
    if (gefuellt(f, e.attribute)) erg.gefuellt++;
    else if (f.pf === "pflicht") erg.pflichtFehlt.push(f.label);
    else erg.offen.push(f.label);
  }
  return erg;
}
function badgeHtml(e) {
  const v = vollstaendigkeit(e);
  if (v.pflichtFehlt.length) return `<span class="badge fehler" title="Pflicht fehlt: ${esc(v.pflichtFehlt.join(", "))}">${v.gefuellt}/${v.gesamt}</span>`;
  if (v.offen.length) return `<span class="badge teil" title="offen: ${esc(v.offen.join(", "))}">${v.gefuellt}/${v.gesamt}</span>`;
  return `<span class="badge voll">vollständig</span>`;
}
const eintragNutzbar = e => e && vollstaendigkeit(e).pflichtFehlt.length === 0;

/* ---------- Beispieleinträge (eingebaut, ohne Datenbank) ---------- */
function kanaeleErzeugen(anzahl, jeAusgang, ampere = 16, charakteristik = "C", fi = "30 mA Typ A", phasen = null) {
  const kanaele = [], ausgaenge = [];
  for (let i = 1; i <= anzahl; i++) {
    const ausgang = "Harting " + Math.ceil(i / jeAusgang);
    kanaele.push({ nr: i, ampere, charakteristik, fi, phase: phasen ? phasen(i) : null, ausgang });
  }
  for (let a = 1; a <= Math.ceil(anzahl / jeAusgang); a++) {
    ausgaenge.push({ name: "Harting " + a, stecker: "Harting 16-pol", kanaele: kanaele.filter(k => k.ausgang === "Harting " + a).map(k => k.nr) });
  }
  return { kanaele, ausgaenge };
}

/* ---------- Library-Speicher ---------- */
const SPEICHER_LIBRARY = "rex-ledplaner-library";
const LIB = { eintraege: new Map(), herkunft: new Map() };

/* Reihenfolge: eingebaute Beispiele < Rex-Library (Datenbank-Agent) < lokal bearbeitete Einträge */
function libLaden(rexListe = null) {
  LIB.eintraege.clear(); LIB.herkunft.clear();
  for (const e of BEISPIEL_LIBRARY) { LIB.eintraege.set(e.id, klon(e)); LIB.herkunft.set(e.id, "beispiel"); }
  for (const e of rexListe || []) { LIB.eintraege.set(e.id, e); LIB.herkunft.set(e.id, "rex"); }
  const lokal = speicher.lesen(SPEICHER_LIBRARY);
  if (lokal && Array.isArray(lokal.eintraege)) {
    for (const e of lokal.eintraege) if (e && e.id) { LIB.eintraege.set(e.id, e); LIB.herkunft.set(e.id, "lokal"); }
  }
}
function libSichern() {
  const eintraege = [...LIB.eintraege.values()].filter(e => LIB.herkunft.get(e.id) === "lokal");
  return speicher.schreiben(SPEICHER_LIBRARY, { format: "rex-ledplaner-library", formatVersion: 1, gespeichert: new Date().toISOString(), eintraege });
}
function libExport() {
  return JSON.stringify({ format: "rex-ledplaner-library", formatVersion: 1, gespeichert: new Date().toISOString(),
    eintraege: [...LIB.eintraege.values()] }, null, 2);
}
function libImport(text) {
  const d = JSON.parse(text);
  const liste = Array.isArray(d) ? d : d.eintraege;
  if (!Array.isArray(liste)) throw new Error("Keine Einträge gefunden");
  let n = 0;
  for (const e of liste) {
    if (!e || !e.id || !e.attribute?.led?.typ) continue;
    LIB.eintraege.set(e.id, e);
    if (LIB.herkunft.get(e.id) !== "beispiel") LIB.herkunft.set(e.id, "lokal"); else LIB.herkunft.set(e.id, "lokal");
    n++;
  }
  libSichern();
  return n;
}

/* Typ-Helfer */
const libTyp = e => e?.attribute?.led?.typ;
const libListe = typ => [...LIB.eintraege.values()].filter(e => !typ || libTyp(e) === typ).sort((a, b) => a.name.localeCompare(b.name, "de"));

/* Anschlüsse mit „anzahl“ ausklappen: Port × 10 → Port 1 … Port 10 */
function anschluesseAusklappen(liste) {
  const erg = [];
  for (const a of liste || []) {
    if (a.anzahl > 1) for (let i = 1; i <= a.anzahl; i++) erg.push({ ...a, anzahl: undefined, name: `${a.name} ${i}` });
    else erg.push(a);
  }
  return erg;
}

/* Projekt: Datenmodell, Neu/Laden/Speichern, Migration, Rückgängig, Autosave.

   projekt = {
     format: "rex-ledplaner", formatVersion: 1, gespeichert, rexId (Projekt im Rex-System, sonst null),
     daten:   { titel, kunde, veranstaltung, ort, ersteller, revision, datum },
     regeln:  { reserve, schieflast, planung, spannung, absicherung, einschaltPruefen, backup, portMax, catMax, druckZusatz },
     library: { [id]: Kopie des Library-Eintrags (Stand beim Einfügen) },
     screens: [{ id, name, beschreibung, ukM, bauart, module: [{ id, lib, x, y }], winkel: { [x Fuge mm]: Grad, + konkav / − konvex }, strom: { richtung, start }, signal: { richtung, start } }],
     geraete: [ verteiler { id, art:"verteiler", lib, name, standort, speisung: { von, kabel, laengeM } }
              | einspeisung { id, art:"einspeisung", name, stecker, ampere, standort }
              | prozessor { id, art:"prozessor", lib, name, standort, portKabel, portLaengeM, strom }
              | stagebox  { id, art:"stagebox", lib, name, standort, prozessor, ports: [Prozessor-Ports], zuleitung: { kabel, laengeM, anzahl }, ausgangKabel, ausgangLaengeM, strom }
              | multicore { id, art:"multicore", lib, name, standort, prozessor, ports: [...], ausgangKabel, ausgangLaengeM } ],
              Ports ohne Stagebox/Multicore gehen direkt (portKabel, portLaengeM) vom Prozessor zur Wand.
     kreise:   [{ id, screen, verteiler, kanal, module: [modulIds in Reihenfolge] }],
     straenge: [{ id, screen, prozessor, port, backupPort, module: [...] }],
     lakas:    [{ id, lib, verteiler, ausgang, screen, laengeM }],
     kabel:    [{ id, lib, laengeM, anzahl, von, nach, bemerkung }]          // von Hand
     kabelAnpassung: { [schluessel automatisches Kabel]: { lib, laengeM, bemerkung } }
   }
   Positionen in mm (x nach rechts, y nach unten, Ursprung oben links des Screens). */

const PROJEKT_FORMAT = "rex-ledplaner";
const PROJEKT_VERSION = 1;
const SPEICHER_AKTUELL = "rex-ledplaner-aktuell";

function standardRegeln() {
  return { reserve: 20, schieflast: 20, planung: "max", spannung: 230, absicherung: 16, einschaltPruefen: true,
    backup: true, portMax: 90, catMax: 100, druckZusatz: "A3", riggingFreigabe: "intern" };
}

function neuesProjekt() {
  return {
    format: PROJEKT_FORMAT, formatVersion: PROJEKT_VERSION, gespeichert: null,
    daten: { titel: "Neues Projekt", kunde: "", veranstaltung: "", ort: "", ersteller: "", revision: "1", datum: new Date().toISOString().slice(0, 10) },
    regeln: standardRegeln(),
    library: {}, screens: [], geraete: [], kreise: [], straenge: [], lakas: [], kabel: [], kabelAnpassung: {},
    outputs: [], pixelraum: {}, layer: [],
    ausgabe: { palette: "regenbogen", beschriftung: "modul", linie: 2, kreis: true, kreuz: true, info: true, cursorTempo: 240, cursorBreite: 4 },
  };
}

function neuerScreen(name) {
  return { id: neueId("s"), name, beschreibung: "", ukM: null, bauart: "geflogen", module: [], winkel: {},
    strom: { richtung: "spalten", start: "ol", verteilung: "minimal" }, signal: { richtung: "spalten", start: "ol" } };
}

/* Geladene Daten in gültige Form bringen (auch ältere/fremde Dateien) */
function normalisiereProjekt(roh) {
  const d = roh && roh.projekt ? roh.projekt : roh;
  if (!d || typeof d !== "object") throw new Error("Keine Projektdatei");
  if (d.format && d.format !== PROJEKT_FORMAT) throw new Error("Falsches Format: " + d.format);
  const p = neuesProjekt();
  p.daten = { ...p.daten, ...(d.daten || {}) };
  p.regeln = { ...standardRegeln(), ...(d.regeln || {}) };
  p.library = d.library && typeof d.library === "object" ? d.library : {};
  for (const k of ["screens", "geraete", "kreise", "straenge", "lakas", "kabel", "outputs", "layer"]) p[k] = Array.isArray(d[k]) ? d[k] : [];
  p.pixelraum = d.pixelraum && typeof d.pixelraum === "object" ? d.pixelraum : {};
  p.kabelAnpassung = d.kabelAnpassung && typeof d.kabelAnpassung === "object" ? d.kabelAnpassung : {};
  p.ausgabe = { ...p.ausgabe, ...(d.ausgabe || {}) };
  p.gespeichert = d.gespeichert || null;
  p.rexId = typeof d.rexId === "string" || typeof d.rexId === "number" ? d.rexId : null;
  // bis 10/2026: Weg zur Wand als Feld am Prozessor → eigenes Gerät ohne Library-Eintrag
  for (const g of p.geraete.filter(g => g.art === "prozessor" && "weg" in g)) {
    if (g.weg === "stagebox" || g.weg === "multicore") {
      const ports = [...new Set(p.straenge.filter(k => k.prozessor === g.id).flatMap(k => [k.port, k.backupPort]).filter(Number.isFinite))].sort((a, b) => a - b);
      const d = { id: neueId(g.weg === "stagebox" ? "sb" : "mc"), art: g.weg, lib: null, name: (g.weg === "stagebox" ? "Stagebox " : "Multicore ") + g.name, standort: "an der Wand",
        prozessor: g.id, ports, ausgangKabel: null, ausgangLaengeM: null };
      if (g.weg === "stagebox") { d.zuleitung = { kabel: g.portKabel, laengeM: g.portLaengeM ?? null, anzahl: 1 }; d.strom = null; g.portLaengeM = null; }
      p.geraete.push(d);
    }
    delete g.weg; delete g.wegLib;
  }
  for (const d of p.geraete.filter(d => d.art === "stagebox" || d.art === "multicore")) d.ports = Array.isArray(d.ports) ? d.ports.filter(Number.isFinite) : [];
  for (const s of p.screens) {
    s.module = Array.isArray(s.module) ? s.module.filter(m => m && m.lib && Number.isFinite(m.x) && Number.isFinite(m.y)) : [];
    s.strom = { richtung: "spalten", start: "ol", verteilung: "minimal", ...(s.strom || {}) };
    s.signal = { richtung: "spalten", start: "ol", ...(s.signal || {}) };
    s.bauart = s.bauart === "gestellt" ? "gestellt" : "geflogen";
    s.winkel = s.winkel && typeof s.winkel === "object" ? Object.fromEntries(Object.entries(s.winkel).filter(([x, w]) => Number.isFinite(Number(x)) && Number.isFinite(w) && w)) : {};
  }
  return p;
}

/* ---------- Zustand ---------- */
let P = neuesProjekt();
let gespeicherterStand = null; // JSON beim letzten Speichern → „ungespeichert“-Anzeige

/* Library-Eintrag fürs Projekt: zuerst die Projektkopie, sonst die Library */
function eintrag(id) { return P.library[id] || LIB.eintraege.get(id) || null; }
function nutzeEintrag(id) {
  if (!P.library[id] && LIB.eintraege.has(id)) P.library[id] = klon(LIB.eintraege.get(id));
  return eintrag(id);
}
/* Abweichungen Projektkopie ↔ Library */
function libraryAbweichungen() {
  const erg = [];
  for (const [id, kopie] of Object.entries(P.library)) {
    const aktuell = LIB.eintraege.get(id);
    if (aktuell && JSON.stringify(aktuell) !== JSON.stringify(kopie)) erg.push(id);
  }
  return erg;
}

const screenById = id => P.screens.find(s => s.id === id) || null;
const geraetById = id => P.geraete.find(g => g.id === id) || null;

/* Maße eines Moduls in mm */
function modMass(m) {
  const e = eintrag(m.lib);
  const led = e?.attribute?.led || {};
  return { b: Number(led.mmB) || 500, h: Number(led.mmH) || 500 };
}
function modRect(m) { const { b, h } = modMass(m); return { x: m.x, y: m.y, b, h }; }

/* ---------- Rückgängig / Wiederholen ---------- */
const HISTORIE_MAX = 80;
const historie = { zurueck: [], vor: [], stand: null, timer: 0 };

function historieStart() { historie.zurueck = []; historie.vor = []; historie.stand = JSON.stringify(P); }
function historieMerken(sofort = false) {
  clearTimeout(historie.timer);
  const merken = () => {
    const jetzt = JSON.stringify(P);
    if (jetzt === historie.stand) return;
    historie.zurueck.push(historie.stand);
    if (historie.zurueck.length > HISTORIE_MAX) historie.zurueck.shift();
    historie.vor.length = 0;
    historie.stand = jetzt;
    aktualisiereKopf();
  };
  if (sofort) merken(); else historie.timer = setTimeout(merken, 300);
}
function historieSchritt(von, nach) {
  historieMerken(true);
  if (!von.length) return;
  nach.push(historie.stand);
  historie.stand = von.pop();
  P = JSON.parse(historie.stand);
  aenderung({ merken: false });
}
const rueckgaengig = () => historieSchritt(historie.zurueck, historie.vor);
const wiederholen = () => historieSchritt(historie.vor, historie.zurueck);

}
function istUngespeichert() { return gespeicherterStand !== null && JSON.stringify(P) !== gespeicherterStand; }

function autosave() { speicher.schreiben(SPEICHER_AKTUELL, { projekt: P, gespeicherterStand }); }
function autosaveLaden() {
  const d = speicher.lesen(SPEICHER_AKTUELL);
  if (!d || !d.projekt) return false;

}

/* ===== 04-geometrie.js ===== */
/* Geometrie: Grenzen, Modulnamen, Einrasten, Überlappung, Schlangenlinie, Segmentierung, Pixel. */

const EPS = 0.5; // mm Toleranz

function grenzen(module) {
  if (!module.length) return { x: 0, y: 0, b: 0, h: 0 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const m of module) {
    const r = modRect(m);
    x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.b); y1 = Math.max(y1, r.y + r.h);
  }
  return { x: x0, y: y0, b: x1 - x0, h: y1 - y0 };
}

const schneidet = (a, b) => a.x < b.x + b.b - EPS && b.x < a.x + a.b - EPS && a.y < b.y + b.h - EPS && b.y < a.y + a.h - EPS;

/* Modulnamen: Spalte als Buchstabe (nach linker Kante), Reihe als Zahl (nach oberer Kante) */
function modulNamen(screen) {
  const xs = [...new Set(screen.module.map(m => Math.round(m.x)))].sort((a, b) => a - b);
  const ys = [...new Set(screen.module.map(m => Math.round(m.y)))].sort((a, b) => a - b);
  const namen = new Map();
  for (const m of screen.module) namen.set(m.id, spaltenBuchstabe(xs.indexOf(Math.round(m.x))) + (ys.indexOf(Math.round(m.y)) + 1));
  return namen;
}

/* Einrasten an Kanten anderer Module (sonst 10-mm-Raster). r = bewegtes Rechteck */
function einrasten(r, andere, toleranz) {
  const kandX = [], kandY = [];
  for (const o of andere) {
    kandX.push(o.x, o.x + o.b, o.x - r.b, o.x + o.b - r.b);
    kandY.push(o.y, o.y + o.h, o.y - r.h, o.y + o.h - r.h);
  }
  const rasten = (v, kand) => {
    let best = Math.round(v / 10) * 10, abst = toleranz;
    for (const k of kand) { const d = Math.abs(v - k); if (d < abst) { abst = d; best = k; } }
    return best;
  };
  return { x: rasten(r.x, kandX), y: rasten(r.y, kandY) };
}

/* Freier Platz? */
function platzFrei(screen, rechtecke, ignoriereIds = new Set()) {
  const andere = screen.module.filter(m => !ignoriereIds.has(m.id)).map(modRect);
  return rechtecke.every(r => !andere.some(o => schneidet(r, o)));
}

/* Module in Linien (Spalten oder Zeilen) gruppieren und als Schlangenlinie ordnen.
   richtung: "spalten" | "zeilen"; start: "ol" | "or" | "ul" | "ur" */
function schlangenReihenfolge(module, richtung = "spalten", start = "ol") {
  if (!module.length) return [];
  const spaltenweise = richtung !== "zeilen";
  const links = start[1] === "l", oben = start[0] === "o";
  const mitte = m => { const r = modRect(m); return { cx: r.x + r.b / 2, cy: r.y + r.h / 2, r }; };
  const daten = module.map(m => ({ m, ...mitte(m) }));
  // Linien bilden: Module, deren Mitte in der Querachse nah beieinander liegt
  const quer = d => spaltenweise ? d.cx : d.cy;
  const laengs = d => spaltenweise ? d.cy : d.cx;
  const groesse = d => spaltenweise ? d.r.b : d.r.h;
  daten.sort((a, b) => quer(a) - quer(b));
  const linien = [];
  for (const d of daten) {
    const l = linien[linien.length - 1];
    if (l && Math.abs(quer(d) - l.q) < Math.min(groesse(d), l.g) / 2) l.d.push(d);
    else linien.push({ q: quer(d), g: groesse(d), d: [d] });
  }
  const vorwaertsQuer = spaltenweise ? links : oben;
  const vorwaertsLaengs = spaltenweise ? oben : links;
  if (!vorwaertsQuer) linien.reverse();
  const erg = [];
  linien.forEach((l, i) => {
    const vor = (i % 2 === 0) === vorwaertsLaengs;
    l.d.sort((a, b) => vor ? laengs(a) - laengs(b) : laengs(b) - laengs(a));
    erg.push(...l.d.map(d => d.m));
  });
  return erg;
}

/* Lasten in möglichst wenige zusammenhängende, ausgewogene Abschnitte teilen.
   Grenzen: kap (Summe je Abschnitt), maxAnzahl (Module je Abschnitt, optional). */
function segmentieren(lasten, kap, maxAnzahl = Infinity, nMin = 1) {
  const L = lasten.length;
  if (!L) return { grenzen: [], ueberlast: false };
  const P0 = [0];
  for (const l of lasten) P0.push(P0[P0.length - 1] + l);
  const summe = P0[L];
  const eps = 1e-9 * Math.max(1, kap);
  const n0 = Math.min(L, Math.max(1, nMin, Math.ceil(summe / kap - 1e-9), Math.ceil(L / maxAnzahl)));
  for (let n = n0; n <= L; n++) {
    const g = [0];
    for (let k = 1; k < n; k++) {
      const ziel = summe * k / n;
      const von = g[k - 1] + 1, bis = L - (n - k);
      let best = von;
      for (let i = von; i <= bis; i++) if (Math.abs(P0[i] - ziel) < Math.abs(P0[best] - ziel)) best = i;
      g.push(best);
    }
    g.push(L);
    let ok = true;
    for (let k = 0; k < n; k++) {
      if (P0[g[k + 1]] - P0[g[k]] > kap + eps || g[k + 1] - g[k] > maxAnzahl) { ok = false; break; }
    }
    if (ok) return { grenzen: g, ueberlast: false };
  }
  return { grenzen: [...Array(L + 1).keys()], ueberlast: true };
}

/* Pixel-Lage der Module (je Modultyp eigene Dichte) relativ zur linken oberen Ecke des Screens */
function pixelLage(screen) {
  const g = grenzen(screen.module);
  const lage = new Map();
  let bMax = 0, hMax = 0;
  for (const m of screen.module) {
    const led = eintrag(m.lib)?.attribute?.led || {};
    const fx = (led.pixelB || 0) / (led.mmB || 1), fy = (led.pixelH || 0) / (led.mmH || 1);
    const r = { x: Math.round((m.x - g.x) * fx), y: Math.round((m.y - g.y) * fy), b: led.pixelB || 0, h: led.pixelH || 0 };
    lage.set(m.id, r);
    bMax = Math.max(bMax, r.x + r.b); hMax = Math.max(hMax, r.y + r.h);
  }
  return { lage, b: bMax, h: hMax };
}

/* Summen eines Screens */
function screenSummen(screen) {
  const g = grenzen(screen.module);
  const s = { m2: 0, kg: 0, wMax: 0, wTyp: 0, px: 0, anzahl: screen.module.length, typen: new Map(), bM: g.b / 1000, hM: g.h / 1000, unbekannt: new Set() };
  for (const m of screen.module) {
    const e = eintrag(m.lib); const a = e?.attribute || {}; const led = a.led || {};
    const r = modRect(m);
    s.m2 += r.b * r.h / 1e6;
    if (Number.isFinite(a.gewicht)) s.kg += a.gewicht; else s.unbekannt.add("Gewicht");
    if (Number.isFinite(a.stromverbrauch)) s.wMax += a.stromverbrauch; else s.unbekannt.add("Leistung max.");
    if (Number.isFinite(led.wTyp)) s.wTyp += led.wTyp; else s.unbekannt.add("Leistung typ.");
    s.px += (led.pixelB || 0) * (led.pixelH || 0);
    s.typen.set(m.lib, (s.typen.get(m.lib) || 0) + 1);
  }
  return s;
}

/* Spiegeln einer Modulmenge in ihrem eigenen Rahmen */
function spiegeln(module, achse) {
  const g = grenzen(module);
  for (const m of module) {
    const r = modRect(m);
    if (achse === "x") m.x = g.x + (g.x + g.b) - (r.x + r.b);
    else m.y = g.y + (g.y + g.h) - (r.y + r.h);
  }
}

/* ===== 05-ui.js ===== */
/* Oberfläche: Zustand, Reiter-Gerüst, Projektbaum, Prüfhinweise, Kopfleiste.
   Jeder Reiter meldet sich in REITER an:
   REITER.name = { werkzeuge(), palette(), zeichnung(el), liste(), rechts(), pruefungen(), titelPalette } */

const ui = {
  haupt: "planen", reiter: "aufbau",
  modus: { strom: "wand", signal: "wand", ausgabe: "screen" },
  screen: null,               // gewählter Screen (id)
  auswahl: new Set(),         // gewählte Module (ids)
  werkzeug: "auswahl",        // auswahl | pinsel
  ansicht: new Map(),         // je Screen: viewBox { x, y, b, h }
  hinten: false,              // Rückansicht im Aufbau
  sel: { verteiler: null, kreis: null, prozessor: null, strang: null, kabel: null, laka: null, output: null, weg: null },
  pinsel: { strom: null, signal: null },  // Ziel des Pinsels: { verteiler, kanal } bzw. { prozessor, port }
  libSel: null, libFilter: "", libNurOffen: false,
  einst: "datei",
  kabelFilter: { gewerk: "alle", screen: "alle", ohneLaenge: false },
  touch: false,               // Fingerbedienung erkannt (Tablet)
  mehrfach: false,            // Antippen fügt zur Auswahl hinzu (statt Shift/Strg)
  einrasten: true,            // aus = frei setzen (statt Alt)
  klickSperre: 0,             // Zeitpunkt des letzten Finger-Ziehens aus der Palette
};
const REITER = {};

function aktuellerScreen() {
  let s = screenById(ui.screen);
  if (!s && P.screens.length) { s = P.screens[0]; ui.screen = s.id; }
  return s;
}

/* Nach jeder Änderung: merken, sichern, neu zeichnen */
function aenderung({ merken = true } = {}) {
  if (merken) historieMerken(true); // jede Aktion ein eigener Rückgängig-Schritt
  autosave();
  render();
}

function render() {
  aktualisiereKopf();
  $$("[data-haupt]").forEach(b => b.setAttribute("aria-selected", b.dataset.haupt === ui.haupt));
  $$(".ansicht").forEach(a => a.classList.toggle("aktiv", a.id === ui.haupt));
  $("#unterleiste").hidden = ui.haupt !== "planen";
  if (ui.haupt === "planen") renderPlanen();
  else if (ui.haupt === "library") renderLibrary();
  else renderEinstellungen();
}

function aktualisiereKopf() {
  $("#status-name").textContent = P.daten.titel || "Projekt";
  const offen = istUngespeichert() || gespeicherterStand === null;
  $("#status-gespeichert").textContent = offen ? "· ungespeichert" : "· gespeichert";
  $("#status-gespeichert").className = offen ? "ungespeichert" : "leise";
  if (nurLesen()) { $("#status-gespeichert").textContent = "· nur ansehen"; $("#status-gespeichert").className = "ungespeichert"; }
  $("#btn-speichern").disabled = nurLesen();
  $("#btn-speichern").title = Datenquelle.verbunden() ? "Im Rex-System speichern (Strg+S)" : "Projekt als Datei speichern (Strg+S)";
  $("#btn-undo").disabled = !historie.zurueck.length && JSON.stringify(P) === historie.stand;
  $("#btn-redo").disabled = !historie.vor.length;
}

function ampelKlasse(liste) {
  if (liste.some(h => h.art === "fehler")) return "fehler";
  if (liste.some(h => h.art === "warn")) return "warn";
  return "ok";
}

function renderPlanen() {
  // Ampeln aller Reiter
  for (const b of $$("[data-reiter]")) {
    b.setAttribute("aria-selected", b.dataset.reiter === ui.reiter);
    const r = REITER[b.dataset.reiter];
    let liste = [];
    try { liste = r?.pruefungen ? r.pruefungen() : []; } catch (e) { console.error(e); liste = [{ art: "fehler", text: "Prüfung fehlgeschlagen" }]; }
    b.querySelector(".ampel").className = "ampel " + (P.screens.length ? ampelKlasse(liste) : "");
  }
  const r = REITER[ui.reiter];
  renderBaum();
  $("#palette-titel").textContent = r.titelPalette || "Library";
  $("#palette").innerHTML = r.palette ? r.palette() : "";
  $("#werkzeuge").innerHTML = r.werkzeuge ? r.werkzeuge() : "";
  const z = $("#zeichnung");
  z.className = "zeichnung";
  r.zeichnung(z);
  $("#liste").innerHTML = r.liste ? r.liste() : "";
  $("#rechts").innerHTML = (r.rechts ? r.rechts() : "") + pruefHtml(r.pruefungen ? r.pruefungen() : []);
}

function pruefHtml(liste) {
  if (!P.screens.length) return "";
  if (!liste.length) liste = [{ art: "ok", text: "Keine Auffälligkeiten." }];
  return `<div class="label">Prüfhinweise</div>` + liste.map(h =>
    `<div class="hinweis ${h.art}"${h.ziel ? ` data-ziel="${esc(h.ziel)}"` : ""}>${esc(h.text)}</div>`).join("");
}

/* Klick auf Prüfhinweis: Ziel auswählen (z.B. "screen:<id>", "modul:<id>", "kabel:<key>") */
function springeZu(ziel) {
  const [art, id] = ziel.split(":");
  if (art === "screen") { ui.screen = id; ui.auswahl.clear(); }
  if (art === "modul") { const s = P.screens.find(s => s.module.some(m => m.id === id)); if (s) { ui.screen = s.id; ui.auswahl = new Set([id]); } }
  if (art === "kabel") { ui.reiter = "kabel"; ui.sel.kabel = ziel.slice(6); }
  if (art === "verteiler") { ui.reiter = "strom"; ui.sel.verteiler = id; }
  if (art === "prozessor") { ui.reiter = "signal"; ui.sel.prozessor = id; ui.sel.weg = null; }
  if (art === "weg") { const d = geraetById(id); if (d) { ui.reiter = "signal"; ui.sel.prozessor = d.prozessor; ui.sel.weg = id; } }
  if (art === "library") { ui.haupt = "library"; ui.libSel = id; }
  render();
}

function renderBaum() {
  const s = aktuellerScreen();
  const verteiler = P.geraete.filter(g => g.art === "verteiler");
  const einspeisungen = P.geraete.filter(g => g.art === "einspeisung");
  const prozessoren = P.geraete.filter(g => g.art === "prozessor");
  const li = (klasse, attr, name, rechts = "") => `<li class="${klasse}" ${attr}><span class="name">${esc(name)}</span>${rechts}</li>`;
  $("#baum").innerHTML = [
    `<li class="gruppe">Screens <button data-aktion="screen-neu" title="Neuen Screen anlegen" style="padding:0 8px">+</button></li>`,
    ...P.screens.map(x => li(x.id === s?.id ? "sel" : "", `data-screen="${x.id}"`, x.name, `<span class="leise klein">${x.module.length}</span>`)),
    P.screens.length ? "" : `<li class="leise">noch kein Screen</li>`,
    `<li class="gruppe">Stromverteiler</li>`,
    ...verteiler.map(g => li(ui.sel.verteiler === g.id ? "sel" : "", `data-geraet="${g.id}"`, g.name)),
    ...einspeisungen.map(g => li(ui.sel.verteiler === g.id ? "sel" : "", `data-geraet="${g.id}"`, "⏚ " + g.name)),
    verteiler.length || einspeisungen.length ? "" : `<li class="leise">—</li>`,
    `<li class="gruppe">Prozessoren</li>`,
    ...prozessoren.flatMap(g => [li(ui.sel.prozessor === g.id && !ui.sel.weg ? "sel" : "", `data-geraet="${g.id}"`, g.name),
      ...wegGeraete(g.id).map(d => li(ui.sel.weg === d.id ? "sel" : "", `data-geraet="${d.id}"`, "↳ " + d.name))]),
    prozessoren.length ? "" : `<li class="leise">—</li>`,
  ].join("");
}

/* ---------- Ereignisse des Gerüsts ---------- */
function gerustEreignisse() {
  $$("[data-haupt]").forEach(b => b.onclick = () => { ui.haupt = b.dataset.haupt; render(); });
  $$("[data-reiter]").forEach(b => b.onclick = () => { ui.reiter = b.dataset.reiter; ui.werkzeug = "auswahl"; render(); });
  $("#btn-undo").onclick = rueckgaengig;
  $("#btn-redo").onclick = wiederholen;
  $("#btn-speichern").onclick = () => projektSpeichern();
  $("#btn-drucken").onclick = druckDialog;
  $("#btn-live").onclick = () => liveOeffnen(aktuellerScreen());

  $("#baum").addEventListener("click", async e => {
    const a = e.target.closest("[data-aktion]")?.dataset.aktion;
    if (a === "screen-neu") return screenAnlegen();
    const sc = e.target.closest("[data-screen]");
    if (sc) { ui.screen = sc.dataset.screen; ui.auswahl.clear(); render(); return; }
    const g = e.target.closest("[data-geraet]");
    if (g) {
      const ger = geraetById(g.dataset.geraet);
      if (ger.art === "prozessor") { ui.reiter = "signal"; ui.sel.prozessor = ger.id; ui.sel.weg = null; }
      else if (istWeg(ger)) { ui.reiter = "signal"; ui.sel.prozessor = ger.prozessor; ui.sel.weg = ger.id; }
      else { ui.reiter = "strom"; ui.sel.verteiler = ger.id; }
      render();
    }
  });
  $("#baum").addEventListener("dblclick", e => {
    const sc = e.target.closest("[data-screen]");
    if (sc) screenBearbeiten(screenById(sc.dataset.screen));
  });
  $("#rechts").addEventListener("click", e => { const h = e.target.closest(".hinweis[data-ziel]"); if (h) springeZu(h.dataset.ziel); });

  document.addEventListener("keydown", e => {
    const imFeld = e.target.matches("input, textarea, select");
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); projektSpeichern(); return; }
    if (imFeld || $("#dialog").open) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); rueckgaengig(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); wiederholen(); return; }
    if (ui.haupt !== "planen") return;
    const r = REITER[ui.reiter];
    if (r.taste && r.taste(e) === true) e.preventDefault();
  });
  window.addEventListener("beforeunload", e => { if (istUngespeichert()) { e.preventDefault(); e.returnValue = ""; } });
}

async function screenAnlegen() {
  const erg = await formularDialog("Neuer Screen", [
    { name: "name", label: "Name *", wert: "Screen " + (P.screens.length + 1) },
    { name: "beschreibung", label: "Beschreibung", wert: "" },
    { name: "ukM", label: "Unterkante (m)", art: "zahl", wert: "" },
    { name: "bauart", label: "Bauart", art: "auswahl", wert: "geflogen", optionen: [["geflogen", "geflogen"], ["gestellt", "gestellt"]] },
  ], "Anlegen");
  if (!erg) return;
  if (!erg.name.trim()) return toast("Name: darf nicht leer sein.", "fehler");
  const s = neuerScreen(erg.name.trim());
  s.beschreibung = erg.beschreibung; s.ukM = Number.isFinite(erg.ukM) ? erg.ukM : null; s.bauart = erg.bauart;
  P.screens.push(s);
  ui.screen = s.id; ui.auswahl.clear(); ui.reiter = "aufbau";
  aenderung();
}

async function screenBearbeiten(s) {
  if (!s) return;
  const erg = await formularDialog("Screen bearbeiten", [
    { name: "name", label: "Name *", wert: s.name },
    { name: "beschreibung", label: "Beschreibung", wert: s.beschreibung },
    { name: "ukM", label: "Unterkante (m)", art: "zahl", wert: s.ukM ?? "" },
    { name: "bauart", label: "Bauart", art: "auswahl", wert: s.bauart, optionen: [["geflogen", "geflogen"], ["gestellt", "gestellt"]] },
  ]);
  if (!erg) return;
  if (!erg.name.trim()) return toast("Name: darf nicht leer sein.", "fehler");
  Object.assign(s, { name: erg.name.trim(), beschreibung: erg.beschreibung, ukM: Number.isFinite(erg.ukM) ? erg.ukM : null, bauart: erg.bauart });
  aenderung();
}

/* Hilfen für Tabellen/Balken */
function balken(anteil, mitText = true) {
  const p = Math.max(0, Math.min(100, anteil * 100));
  const k = anteil > 1 ? "fehler" : anteil > 0.9 ? "warn" : "";
  return `<span class="balken"><i class="${k}" style="width:${p}%"></i></span>${mitText ? fmt(anteil * 100) + " %" : ""}`;
}

/* ===== 06-zeichnen.js ===== */
/* Zeichnen eines Screens als SVG (1 Einheit = 1 mm, Linienstil auf dunklem Grund)
   und gemeinsame Ansichtssteuerung (Zoom, Verschieben) für Aufbau, Strom und Signal. */

const TYPFARBEN = ["rgba(77,163,255,.10)", "rgba(99,230,190,.12)", "rgba(255,212,59,.10)", "rgba(229,153,247,.12)", "rgba(255,192,120,.12)"];

/* opt: { auswahl:Set, hinten, fuellung(m), wege:[{ farbe, module:[ids], start, ende }], fehlerIds:Set, druck, oben:"", zusatz:"", masseTiefer } */
function screenSvgInhalt(screen, opt = {}) {
  const g = grenzen(screen.module);
  const namen = modulNamen(screen);
  const typIndex = [...new Set(screen.module.map(m => m.lib))];
  const lx = (x, b) => opt.hinten ? g.x + g.x + g.b - x - b : x;   // Rückansicht: horizontal gespiegelt
  const mm = Math.max(g.b, g.h, 1000);
  const strich = Math.max(4, mm / 900);
  const teile = [];
  // Module
  for (const m of screen.module) {
    const r = modRect(m);
    const x = lx(r.x, r.b);
    const fuell = opt.fuellung ? opt.fuellung(m) : TYPFARBEN[typIndex.indexOf(m.lib) % TYPFARBEN.length];
    const sel = opt.auswahl?.has(m.id);
    const fehler = opt.fehlerIds?.has(m.id);
    const fs = Math.min(r.b, r.h) * 0.14;
    teile.push(`<g class="modul${sel ? " sel" : ""}${fehler ? " fehler" : ""}" data-mod="${m.id}">
      <rect x="${x}" y="${r.y}" width="${r.b}" height="${r.h}" fill="${fuell || "transparent"}"/>
      <rect class="modul-rahmen" fill="none" stroke="#bdbdbd" x="${x + strich}" y="${r.y + strich}" width="${r.b - 2 * strich}" height="${r.h - 2 * strich}" rx="${strich * 1.5}" stroke-width="${sel ? strich * 2.2 : strich}"/>
      <text x="${x + fs * 0.6}" y="${r.y + fs * 1.3}" font-size="${fs}" fill="#9a9a9a">${esc(namen.get(m.id))}</text></g>`);
  }
  // Wege (Stromkreise, Datenstränge)
  for (const w of opt.wege || []) teile.push(wegSvg(screen, w, lx, mm));
  // Maße
  if (screen.module.length && opt.masse !== false) {
    const a = mm * 0.05, fs = mm * 0.028, st = strich * 0.8;
    const y = g.y + g.h + a + (opt.masseTiefer ? mm * 0.035 : 0), x = g.x + g.b + a;   // masseTiefer: Platz für Fugen-Marken
    teile.push(`<g stroke="#9a9a9a" stroke-width="${st}" fill="none">
      <line x1="${g.x}" y1="${y}" x2="${g.x + g.b}" y2="${y}"/><line x1="${g.x}" y1="${y - a / 3}" x2="${g.x}" y2="${y + a / 3}"/><line x1="${g.x + g.b}" y1="${y - a / 3}" x2="${g.x + g.b}" y2="${y + a / 3}"/>
      <line x1="${x}" y1="${g.y}" x2="${x}" y2="${g.y + g.h}"/><line x1="${x - a / 3}" y1="${g.y}" x2="${x + a / 3}" y2="${g.y}"/><line x1="${x - a / 3}" y1="${g.y + g.h}" x2="${x + a / 3}" y2="${g.y + g.h}"/></g>
      <text x="${g.x + g.b / 2}" y="${y - a / 4}" font-size="${fs}" fill="#9a9a9a" text-anchor="middle">${fmt(g.b)} mm</text>
      <text x="${x + a / 4}" y="${g.y + g.h / 2}" font-size="${fs}" fill="#9a9a9a" text-anchor="middle" transform="rotate(90 ${x + a / 4} ${g.y + g.h / 2})">${fmt(g.h)} mm</text>`);
  }
  if (opt.zusatz) teile.push(opt.zusatz);
  if (opt.oben) teile.push(`<text x="${g.x}" y="${g.y - mm * (opt.zusatz ? 0.22 : 0.03)}" font-size="${mm * 0.028}" fill="#9a9a9a">${esc(opt.oben)}</text>`);
  return teile.join("");
}

function wegSvg(screen, w, lx, mm) {
  const map = new Map(screen.module.map(m => [m.id, m]));
  const pts = w.module.map(id => map.get(id)).filter(Boolean).map(m => { const r = modRect(m); return [lx(r.x, r.b) + r.b / 2, r.y + r.h / 2]; });
  if (!pts.length) return "";
  const b = Math.max(10, mm / 220);
  const linie = pts.map(p => p.join(",")).join(" ");
  let s = `<g class="weg" pointer-events="none">
    <polyline points="${linie}" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="${b * 1.8}" stroke-linejoin="round"/>
    <polyline points="${linie}" fill="none" stroke="${w.farbe}" stroke-width="${b}" stroke-linejoin="round"/>`;
  for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    const a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    s += `<path d="M ${b * 1.8} 0 L ${-b * 1.4} ${-b * 1.5} L ${-b * 1.4} ${b * 1.5} Z" fill="${w.farbe}" transform="translate(${(x1 + x2) / 2} ${(y1 + y2) / 2}) rotate(${a})"/>`;
  }
  const r = b * 4.5;
  const [sx, sy] = pts[0];
  s += `<circle cx="${sx}" cy="${sy}" r="${r}" fill="${w.farbe}" stroke="#141414" stroke-width="${b * 0.6}"/>
    <text x="${sx}" y="${sy + r * 0.36}" font-size="${r * 0.95}" font-weight="700" text-anchor="middle" fill="#000">${esc(w.start)}</text>`;
  if (w.ende) {
    const [ex, ey] = pts[pts.length - 1];
    s += `<rect x="${ex - r * 1.05}" y="${ey - r * 0.9}" width="${r * 2.1}" height="${r * 1.8}" rx="${r * 0.35}" fill="#141414" stroke="${w.farbe}" stroke-width="${b * 0.8}"/>
      <text x="${ex}" y="${ey + r * 0.36}" font-size="${r * 0.95}" font-weight="700" text-anchor="middle" fill="${w.farbe}">${esc(w.ende)}</text>`;
  }
  return s + "</g>";
}

/* ---------- Ansicht (viewBox) je Screen ---------- */
function einpassAnsicht(screen) {
  const g = grenzen(screen.module);
  if (!screen.module.length) return { x: -1000, y: -1000, b: 8000, h: 5000 };
  const mm = Math.max(g.b, g.h, 1000);
  const rand = mm * 0.12 + 300, oben = rand + mm * 0.18; // oben Platz für Rigging und Titel
  return { x: g.x - rand, y: g.y - oben, b: g.b + 2 * rand, h: g.h + rand + oben };
}
function ansicht(screen) {
  if (!ui.ansicht.has(screen.id)) ui.ansicht.set(screen.id, einpassAnsicht(screen));
  return ui.ansicht.get(screen.id);
}
const vbText = v => `${v.x} ${v.y} ${v.b} ${v.h}`;

/* SVG-Koordinaten (mm) aus Mausposition */
function svgPunkt(svg, e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
/* mm je Bildschirmpixel (für Toleranzen) */
function mmJePixel(svg) {
  const m = svg.getScreenCTM();
  return m ? 1 / m.a : 1;
}

/* Zoom (Mausrad) und Verschieben (Leertaste/mittlere Taste/Hand) für eine Screen-Zeichnung */
function ansichtSteuerung(el, svg, screen, { leerKlick } = {}) {
  const v = ansicht(screen);
  svg.dataset.ansicht = screen.id;   // für Zwei-Finger-Gesten und Zoom-Knöpfe
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const p = svgPunkt(svg, e);
    const f = e.deltaY < 0 ? 1 / 1.15 : 1.15;
    v.x = p.x - (p.x - v.x) * f; v.y = p.y - (p.y - v.y) * f; v.b *= f; v.h *= f;
    svg.setAttribute("viewBox", vbText(v));
    zoomAnzeige(el, svg);
  }, { passive: false });
  let pan = null;
  svg.addEventListener("pointerdown", e => {
    if (!(e.button === 1 || leertaste.gedrueckt)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    pan = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y, f: mmJePixel(svg) };
    svg.setPointerCapture(e.pointerId);
  }, true);
  svg.addEventListener("pointermove", e => {
    if (!pan) return;
    v.x = pan.vx - (e.clientX - pan.x) * pan.f; v.y = pan.vy - (e.clientY - pan.y) * pan.f;
    svg.setAttribute("viewBox", vbText(v));
  });
  svg.addEventListener("pointerup", () => { pan = null; });
  zoomAnzeige(el, svg);
}
function zoomAnzeige(el, svg) {
  let z = el.querySelector(".zoomanzeige");
  if (!z) { z = document.createElement("div"); z.className = "zoomanzeige"; el.appendChild(z); }
  requestAnimationFrame(() => { const f = mmJePixel(svg); z.textContent = `1 px ≈ ${fmtFlex(f, 1)} mm · ${ui.touch ? "zwei Finger: zoomen und verschieben" : "Mausrad: Zoom · Leertaste + Ziehen: verschieben"}`; });
  if (!el.querySelector(".zoomknoepfe")) el.insertAdjacentHTML("beforeend", `<div class="zoomknoepfe"><button data-zoom="-" title="Verkleinern">−</button><button data-zoom="+" title="Vergrößern">+</button><button data-zoom="fit" title="Einpassen">⤢</button></div>`);
}
const leertaste = { gedrueckt: false };
document.addEventListener("keydown", e => { if (e.key === " " && !e.target.matches("input, textarea, select, button")) { leertaste.gedrueckt = true; $("#zeichnung")?.classList.add("pan"); if (e.target === document.body) e.preventDefault(); } });
document.addEventListener("keyup", e => { if (e.key === " ") { leertaste.gedrueckt = false; $("#zeichnung")?.classList.remove("pan"); } });

function einpassen() {
  const s = aktuellerScreen();
  if (s) { ui.ansicht.set(s.id, einpassAnsicht(s)); render(); }
}

/* Leerer Zustand der Zeichenfläche */
function leerZeichnung(el, text) {
  el.innerHTML = `<div class="leer-hinweis">${text}</div>`;
}

/* ===== 07-touch.js ===== */
/* Tablet-Bedienung: Zwei-Finger-Zoom/-Verschieben, Module mit dem Finger aus der Palette ziehen,
   Ersatz für Tastatur-Modifikatoren (Mehrfachauswahl statt Shift, Einrasten aus statt Alt),
   ausklappbare Seitenspalten bei schmalem Bildschirm. */

const beruehrung = { punkte: new Map(), geste: null };

/* Beim ersten Fingerkontakt: Touch-Knöpfe einblenden (per CSS, ohne neu zu zeichnen) */
function touchErkannt() {
  if (ui.touch) return;
  ui.touch = true;
  document.body.classList.add("touch");
}

function gestenMitte() {
  const [a, b] = [...beruehrung.punkte.values()];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) };
}

function touchEreignisse() {
  if (matchMedia("(pointer: coarse)").matches) { ui.touch = true; document.body.classList.add("touch"); }
  const el = $("#zeichnung");
  // Capture-Phase: Gesten werden abgefangen, bevor Auswahl, Verschieben oder Pinsel reagieren
  el.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch") return;
    beruehrung.punkte.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (beruehrung.punkte.size === 2) {
      e.stopPropagation(); e.preventDefault();
      // laufende Ein-Finger-Aktion (Ziehen, Rahmen, Pinselstrich) verwerfen
      if (historie.stand && JSON.stringify(P) !== historie.stand) P = JSON.parse(historie.stand);
      beruehrung.geste = gestenMitte();
      render();
    } else if (beruehrung.punkte.size > 2 || beruehrung.geste) e.stopPropagation();
  }, true);
  el.addEventListener("pointermove", e => {
    if (e.pointerType !== "touch" || !beruehrung.punkte.has(e.pointerId)) return;
    beruehrung.punkte.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!beruehrung.geste) return;
    e.stopPropagation();
    const svg = el.querySelector("svg[data-ansicht]");
    if (!svg || beruehrung.punkte.size < 2) return;
    const v = ui.ansicht.get(svg.dataset.ansicht); if (!v) return;
    const neu = gestenMitte(), alt = beruehrung.geste;
    const z = alt.d / neu.d;                                  // Finger auseinander → hineinzoomen
    const p = svgPunkt(svg, { clientX: neu.x, clientY: neu.y });
    v.x = p.x - (p.x - v.x) * z; v.y = p.y - (p.y - v.y) * z; v.b *= z; v.h *= z;
    svg.setAttribute("viewBox", vbText(v));
    const f = mmJePixel(svg);
    v.x -= (neu.x - alt.x) * f; v.y -= (neu.y - alt.y) * f;
    svg.setAttribute("viewBox", vbText(v));
    beruehrung.geste = neu;
    zoomAnzeige(el, svg);
  }, true);
  const ende = e => {
    if (e.pointerType !== "touch") return;
    beruehrung.punkte.delete(e.pointerId);
    if (beruehrung.geste) { e.stopPropagation(); if (!beruehrung.punkte.size) beruehrung.geste = null; }
  };
  el.addEventListener("pointerup", ende, true);
  el.addEventListener("pointercancel", ende, true);
  document.addEventListener("pointerdown", e => { if (e.pointerType === "touch") touchErkannt(); }, true);

  // Module mit dem Finger aus der Palette in die Zeichnung ziehen (HTML-Drag & Drop geht auf Tablets nicht)
  $("#palette").addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch" || ui.reiter !== "aufbau") return;
    const it = e.target.closest('[data-lib][draggable="true"]'); if (!it) return;
    const start = { x: e.clientX, y: e.clientY };
    let geist = null;
    const bewegen = ev => {
      if (ev.pointerId !== e.pointerId) return;
      if (!geist && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 10) {
        geist = it.cloneNode(true);
        geist.className = "palette-item geist";
        document.body.appendChild(geist);
      }
      if (geist) { geist.style.left = ev.clientX + "px"; geist.style.top = ev.clientY + "px"; }
    };
    const loslassen = ev => {
      if (ev.pointerId !== e.pointerId) return;
      document.removeEventListener("pointermove", bewegen); document.removeEventListener("pointerup", loslassen); document.removeEventListener("pointercancel", loslassen);
      if (!geist) return;
      geist.remove();
      ui.klickSperre = Date.now();
      const svg = $("#zeichnung svg[data-ansicht]"); const s = aktuellerScreen();
      if (ev.type !== "pointerup" || !svg || !s) return;
      const r = svg.getBoundingClientRect();
      if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return;
      modulAbsetzen(svg, s, it.dataset.lib, ev.clientX, ev.clientY, !ui.einrasten);
    };
    document.addEventListener("pointermove", bewegen);
    document.addEventListener("pointerup", loslassen);
    document.addEventListener("pointercancel", loslassen);
  });

  // Zoom-Knöpfe in der Zeichnung (Finger und Maus)
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-zoom]"); if (!b) return;
    const svg = el.querySelector("svg[data-ansicht]"); if (!svg) return;
    if (b.dataset.zoom === "fit") return einpassen();
    const v = ui.ansicht.get(svg.dataset.ansicht); if (!v) return;
    const f = b.dataset.zoom === "+" ? 1 / 1.4 : 1.4;
    const cx = v.x + v.b / 2, cy = v.y + v.h / 2;
    v.b *= f; v.h *= f; v.x = cx - v.b / 2; v.y = cy - v.h / 2;
    svg.setAttribute("viewBox", vbText(v));
    zoomAnzeige(el, svg);
  });

  // Seitenspalten ein-/ausklappen (schmaler Bildschirm, z.B. Tablet hochkant)
  $("#unterleiste").addEventListener("click", e => {
    const b = e.target.closest("[data-spalte]"); if (!b) return;
    const k = "zeige-" + b.dataset.spalte;
    const an = !document.body.classList.contains(k);
    document.body.classList.remove("zeige-links", "zeige-rechts");
    document.body.classList.toggle(k, an);
  });
}

      ${s.module.length ? riggingKarte(s) + kurveKarte(s) : ""}

        ${libListe("modul").filter(eintragNutzbar).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></label></div>` : ""}`;
  },

  pruefungen() {
    const liste = [];
    if (!P.screens.length) return [{ art: "info", text: "Noch kein Screen angelegt." }];
    for (const s of P.screens) {
      if (!s.module.length) { liste.push({ art: "warn", text: `${s.name}: noch keine Module.`, ziel: "screen:" + s.id }); continue; }
      const typen = [...new Set(s.module.map(m => m.lib))];
      for (const t of typen) {
        const e = eintrag(t);
        if (!e) liste.push({ art: "fehler", text: `${s.name}: Modultyp „${t}“ fehlt in der Library.`, ziel: "screen:" + s.id });

      if (sum.unbekannt.size) liste.push({ art: "warn", text: `${s.name}: ${[...sum.unbekannt].join(", ")} nicht bei allen Modulen bekannt.`, ziel: "screen:" + s.id });
      // Überlappung
      const r = s.module.map(m => ({ m, r: modRect(m) }));
      const ueber = new Set();
      for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++) if (schneidet(r[i].r, r[j].r)) { ueber.add(r[i].m.id); ueber.add(r[j].m.id); }
      if (ueber.size) liste.push({ art: "fehler", text: `${s.name}: ${ueber.size} Module überlappen.`, ziel: "modul:" + [...ueber][0] });
      liste.push(...kurvePruefungen(s));
      // Max. Module untereinander / übereinander
      const feld = s.bauart === "geflogen" ? "maxGeflogen" : "maxGestellt";
      const spalten = new Map();
      for (const m of s.module) { const k = Math.round(m.x); spalten.set(k, [...(spalten.get(k) || []), m]); }
      let unbekannt = false;
      for (const [, ms] of spalten) {
        const grenze = Math.min(...ms.map(m => eintrag(m.lib)?.attribute?.led?.mechanik?.[feld] ?? Infinity));
        if (!Number.isFinite(grenze)) { unbekannt = true; continue; }
        if (ms.length > grenze) liste.push({ art: "warn", text: `${s.name}: ${ms.length} Module ${s.bauart === "geflogen" ? "untereinander" : "übereinander"}, erlaubt ${grenze}.`, ziel: "modul:" + ms[0].id });
      }
      if (unbekannt) liste.push({ art: "warn", text: `${s.name}: max. Module ${s.bauart === "geflogen" ? "geflogen untereinander" : "gestellt übereinander"} unbekannt – nicht geprüft.`, ziel: "screen:" + s.id });
      const pitches = [...new Set(typen.map(t => fmtFlex(eintrag(t)?.attribute?.led?.pitchMm ?? (eintrag(t)?.attribute?.led?.mmB / eintrag(t)?.attribute?.led?.pixelB), 2)))];
      if (pitches.length > 1) liste.push({ art: "info", text: `${s.name}: verschiedene Pixelpitches (${pitches.join(" / ")} mm) – getrennte Datenports nötig.`, ziel: "screen:" + s.id });
    }
    return [...liste, ...riggingPruefungen()];
  },

  taste(e) {
    const s = aktuellerScreen();
    if (!s) return false;
    const k = e.key;
    if (k === "Delete" || k === "Backspace") { if (ui.auswahl.size) modulEntfernen(s, [...ui.auswahl]); return true; }
    if (k === "Escape") { ui.auswahl.clear(); render(); return true; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "a") { ui.auswahl = new Set(s.module.map(m => m.id)); render(); return true; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "d") { aufbauDuplizieren(s); return true; }
    const pfeile = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (pfeile[k] && ui.auswahl.size) {
      const schritt = e.shiftKey ? 100 : 10;
      const [dx, dy] = pfeile[k];
      verschiebeAuswahl(s, dx * schritt * (ui.hinten ? -1 : 1), dy * schritt);
      return true;
    }
    return false;
  },
};

/* ---------- Aktionen ---------- */

function modulEntfernen(s, ids) {
  const weg = new Set(ids);
  s.module = s.module.filter(m => !weg.has(m.id));
  for (const k of P.kreise) if (k.screen === s.id) k.module = k.module.filter(id => !weg.has(id));
  for (const k of P.straenge) if (k.screen === s.id) k.module = k.module.filter(id => !weg.has(id));
  P.kreise = P.kreise.filter(k => k.module.length);
  P.straenge = P.straenge.filter(k => k.module.length);
  ids.forEach(id => ui.auswahl.delete(id));
  aenderung();
}

function verschiebeAuswahl(s, dx, dy) {
  const ms = s.module.filter(m => ui.auswahl.has(m.id));
  const neu = ms.map(m => ({ ...modRect(m), x: m.x + dx, y: m.y + dy }));
  if (!platzFrei(s, neu, ui.auswahl)) return toast("Dort ist kein Platz – Module würden sich überlappen.", "fehler");
  ms.forEach(m => { m.x += dx; m.y += dy; });

}

function modulHinzufuegen(s, lib, x, y) {

/* Klick in der Palette: rechts neben den vorhandenen Modulen (oben bündig) anfügen */

async function erweiternKuerzen() {

/* ---------- Maus und Ziehen ---------- */

function aufbauInteraktion(svg, s) {
  let zug = null;      // Verschieben der Auswahl
  let rahmen = null;   // Auswahlrahmen
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0 || leertaste.gedrueckt) return;
    const fuge = e.target.closest("[data-fuge]");
    if (fuge) { fugeBearbeiten(s, Number(fuge.dataset.fuge)); return; }
    const p = svgPunkt(svg, e);
    const g = e.target.closest("[data-mod]");
    if (g) {
      const id = g.dataset.mod;
      if (e.shiftKey || e.ctrlKey || ui.mehrfach) { ui.auswahl.has(id) ? ui.auswahl.delete(id) : ui.auswahl.add(id); render(); return; }
      if (!ui.auswahl.has(id)) { ui.auswahl = new Set([id]); markiereAuswahl(svg); }
      zug = { start: p, dx: 0, dy: 0, bewegt: false, ankerId: id };
    } else {
      rahmen = { start: p, el: null };
    }
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    const p = svgPunkt(svg, e);
    if (zug) {
      let dx = (p.x - zug.start.x) * (ui.hinten ? -1 : 1), dy = p.y - zug.start.y;
      if (!e.altKey && ui.einrasten) {
        const anker = s.module.find(m => m.id === zug.ankerId);
        const r = modRect(anker);
        const andere = s.module.filter(m => !ui.auswahl.has(m.id)).map(modRect);
        const z = einrasten({ ...r, x: r.x + dx, y: r.y + dy }, andere, 14 * mmJePixel(svg));
        dx = z.x - r.x; dy = z.y - r.y;
      }
      zug.dx = dx; zug.dy = dy; zug.bewegt = zug.bewegt || Math.abs(dx) > 0 || Math.abs(dy) > 0;
      for (const id of ui.auswahl) svg.querySelector(`[data-mod="${id}"]`)?.setAttribute("transform", `translate(${dx * (ui.hinten ? -1 : 1)} ${dy})`);
    } else if (rahmen) {
      const x = Math.min(p.x, rahmen.start.x), y = Math.min(p.y, rahmen.start.y), b = Math.abs(p.x - rahmen.start.x), h = Math.abs(p.y - rahmen.start.y);
      if (!rahmen.el) { rahmen.el = document.createElementNS("http://www.w3.org/2000/svg", "rect"); rahmen.el.setAttribute("fill", "rgba(77,163,255,.12)"); rahmen.el.setAttribute("stroke", "#4da3ff"); rahmen.el.setAttribute("stroke-width", 3 * mmJePixel(svg)); svg.appendChild(rahmen.el); }
      Object.entries({ x, y, width: b, height: h }).forEach(([k, v]) => rahmen.el.setAttribute(k, v));
      rahmen.r = { x, y, b, h };
    }
  });
  svg.addEventListener("pointerup", e => {
    if (zug) {
      const z = zug; zug = null;
      if (z.bewegt) {
        const ms = s.module.filter(m => ui.auswahl.has(m.id));
        const neu = ms.map(m => ({ ...modRect(m), x: m.x + z.dx, y: m.y + z.dy }));
        if (platzFrei(s, neu, ui.auswahl)) { ms.forEach(m => { m.x = Math.round(m.x + z.dx); m.y = Math.round(m.y + z.dy); }); aenderung(); }
        else { toast("Dort ist kein Platz – Module würden sich überlappen.", "fehler"); render(); }
      } else render();
    } else if (rahmen) {
      const r = rahmen; rahmen = null;
      if (r.r && r.r.b > 2 && r.r.h > 2) {
        const rr = ui.hinten ? spiegelRect(s, r.r) : r.r;
        ui.auswahl = new Set(s.module.filter(m => schneidet(modRect(m), rr)).map(m => m.id));
      } else if (!ui.mehrfach) ui.auswahl.clear();
      render();
    }
  });
  // Drag & Drop aus der Palette
  svg.addEventListener("dragover", e => { if (e.dataTransfer.types.includes("text/lib")) e.preventDefault(); });
  svg.addEventListener("drop", e => {
    e.preventDefault();
    const lib = e.dataTransfer.getData("text/lib");
    if (lib) modulAbsetzen(svg, s, lib, e.clientX, e.clientY, e.altKey || !ui.einrasten);
  });
}
/* Modul an einer Bildschirmposition absetzen (Maus-Drop oder Finger-Ziehen) */
function modulAbsetzen(svg, s, lib, clientX, clientY, frei) {
  nutzeEintrag(lib);
  const { b, h } = modMass({ lib });
  const p = svgPunkt(svg, { clientX, clientY });
  let x = p.x - b / 2, y = p.y - h / 2;
  if (ui.hinten) { const g = grenzen(s.module); x = g.x + g.x + g.b - x - b; }
  if (!frei && s.module.length) ({ x, y } = einrasten({ x, y, b, h }, s.module.map(modRect), 40 * mmJePixel(svg)));
  else if (!s.module.length) { x = Math.round(x / 10) * 10; y = Math.round(y / 10) * 10; }
  const m = modulHinzufuegen(s, lib, x, y);
  if (m) { ui.auswahl = new Set([m.id]); aenderung(); }
}
function spiegelRect(s, r) { const g = grenzen(s.module); return { ...r, x: g.x + g.x + g.b - r.x - r.b }; }
function markiereAuswahl(svg) { svg.querySelectorAll("[data-mod]").forEach(g => g.classList.toggle("sel", ui.auswahl.has(g.dataset.mod))); }
